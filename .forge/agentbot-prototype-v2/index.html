  .sidebar:hover .sidebar-foot, .sidebar:focus-within .sidebar-foot { align-items: stretch; }
  .sidebar:hover .foot-roster, .sidebar:focus-within .foot-roster { justify-content: flex-start; }
  .sidebar:hover .nav-item.is-active::before, .sidebar:focus-within .nav-item.is-active::before { left: -6px; }
  /* 右面板折叠为右侧抽屉（UX §2.2 + §7）。宽屏常驻，窄屏抽屉；按钮必须可见，否则面板彻底不可达。
     z-index 高于演示浮钮（90）与演示面板（91）：抽屉打开时它是唯一该被看见的浮层，
     否则 32px 演示按钮会正好压在抽屉的关闭按钮上。 */
  .aside {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(320px, 86vw); z-index: 95;
    transform: translateX(100%); transition: transform var(--duration-base) var(--ease-out);

  .aside-drawer-head { display: flex; align-items: center; gap: 8px; margin-bottom: var(--space-4); }
  .aside-scrim {

  .chat-head [data-act="toggle-aside"] { display: inline-flex; }
  .page { padding-left: var(--space-5); padding-right: var(--space-5); }

  .task-tipbar { margin-left: var(--space-5); margin-right: var(--space-5); }

/* <1024 窄屏（UX §7）：权限卡片改为「底部全宽固定条」。
   窄屏一屏只能放一个 Turn，把卡片吸在流中间会同时压住正文与输入区；
   固定在视口底部（输入框上方）才能既看见上下文又做出决定。 */
@media (max-width: 1023px) {
  /* z-index 必须一起归零：.turn--perm-block 原本是 sticky + z-index:18，
     即使改成 static，残留的 z-index 仍会造出一个 z=18 的层叠上下文，
     把内部 fixed 的卡片困在 18 层里 —— 左侧 64px 图标栏（z=40）就会盖住卡片左缘。 */
  .turn--perm-block { position: static; z-index: auto; }
  /* 卡片在 .turn-body > .ev > .perm 里，不是 Turn 的直接子元素，选择器必须用后代 */
  .turn--perm-block .perm {
    position: fixed; left: 0; right: 0; bottom: 58px; z-index: 120;
    border-radius: var(--radius-xl) var(--radius-xl) 0 0;
    max-height: 62vh; overflow: auto;
    padding: 14px var(--space-4) 16px 20px;
    box-shadow: 0 -6px 24px rgba(22, 32, 43, .16);
  }
  body.is-chat .turn--perm-block .perm { bottom: 58px; }
  .turn--perm-block .perm-actions { gap: 6px; }
  .turn--perm-block .perm-actions .perm-btn { flex: 1 1 auto; }
  .turn--perm-block .perm-actions .perm-btn .btn { width: 100%; }
  /* 固定条会盖住流尾，留出可滚动的底部空白，最后一条消息仍能滚出来 */
  body:has(.turn--perm-block) .stream { padding-bottom: 260px; }
}
@media (min-width: 768px) and (max-width: 1023px) {
  /* 768–1023 没有底部导航条，固定条贴底（≤767 才让开 58px 底部导航）。
     条本身 z-index 高于图标栏，所以是「全宽」而不是让开 64px：
     左侧留出与图标栏等宽的 padding，标签不会压在图标上。 */
  /* 768–1023：没有底部导航条，固定条贴底；左侧从 64px 图标栏之后起铺。
     「全宽」指的是铺满内容区而不是 560px 的窄卡；让开图标栏才不会把导航底部的
     待批计数整个盖住（那条计数是用户在别处判断紧急度的唯一入口）。 */
  body.is-chat .turn--perm-block .perm,
  .turn--perm-block .perm { bottom: 0; left: var(--nav-width-rail); padding-left: var(--space-4); }
}

   入参可以是单个 botId，也可以是 id 数组（群聊按全部参与者合计）。 */
const MEM_CAP = 6000;
const MEM_CHARS_PER_ITEM = 520;
function memBudget(botIds) {
  const ids = Array.isArray(botIds) ? botIds : [botIds];
  const pool = ids.flatMap((id) => S.memory[id] || []);
  const on = pool.filter((m) => m.on);
  return { count: on.length, chars: Math.min(MEM_CAP, on.length * MEM_CHARS_PER_ITEM), cap: MEM_CAP };
}

/* ---- 运行控制器 ----
   一次生成（私聊回复 / 群聊一轮 / 接管 / 向导首条消息）拿到一个 gen 号与一组定时器。
   stopRun() 让 gen 前进一格并清空所有定时器；此后任何在飞的回调发现 gen 不匹配就静默退出。
   这是「停止是终态」的实现基础：不清状态的话，下一次 tick 会把光标重新 append 回来，
   最终 done() 还会把头部从「已中断」覆盖成「完成」。 */
function newRun() {
  S.run.gen++;
  return S.run.gen;
}
function isRun(gen) { return S.run.gen === gen; }
function trackInterval(gen, fn, ms) {
  const id = setInterval(() => { if (!isRun(gen)) { clearInterval(id); return; } fn(); }, ms);
  S.run.timers.push(id);
  return id;
}
function trackTimeout(gen, fn, ms) {
  const id = setTimeout(() => { if (!isRun(gen)) return; fn(); }, ms);
  S.run.timeouts.push(id);
  return id;
}
/* 单轮结束时停掉自己的计时器：finishTurn 会重写 Turn 头，
   如果秒表还在跑，它会把「完成 · 842/214」又改回「12s」。 */
function untrack(id) {
  if (id == null) return;
  clearInterval(id);
  const i = S.run.timers.indexOf(id);
  if (i >= 0) S.run.timers.splice(i, 1);
}
function stopRun() {
  S.run.gen++;
  S.run.timers.forEach(clearInterval);
  S.run.timeouts.forEach(clearTimeout);
  S.run.timers = [];
  S.run.timeouts = [];
  groupRunning = false;
}

  setTimeout(() => el.remove(), 3300);
}

      return `<svg ${A} aria-hidden="true"><circle cx="8" cy="8" r="5.6"/></svg>`;
  }
}
function stateChip(state, label, opts) {
  opts = opts || {};
  const decay = opts.decay && state === "done" ? " is-decay" : "";
  return `<span class="state state--${state}${decay}"><span class="state-dot" style="--s:var(--state-${state})"></span><span class="si-wrap">${stateIcon(state)}</span><span>${esc(label || STATE_WORD[state] || state)}</span></span>`;
}
function stateBadge(b) {
  return `<span class="av-badge" style="--s:var(--state-${b.state})"></span>`;
}
function av(b, size, withBadge) {
  return `<span class="av av--${size || 32}" style="${botVars(b)}" aria-hidden="true">${esc(b.initial)}</span>`
    + (withBadge ? `<span class="av-wrap" style="display:none"></span>` : "");
}
function avWrap(b, size) {
  return `<span class="av-wrap"><span class="av av--${size || 32}" style="${botVars(b)}">${esc(b.initial)}</span><span class="av-badge" style="--s:var(--state-${b.state})"></span></span>`;
}
function capBadge(v) {
  if (v === true) return '<span class="cap cap--yes">✓ 支持</span>';
  if (v === false) return '<span class="cap cap--no">— 不支持</span>';
  return '<span class="cap cap--unknown">? 未知</span>';
}
function rtChip(rt) { return `<span class="rt-chip">${esc(rt.name)} · ${esc(rt.protocol)}</span>`; }
function statusWord(a) { return { done: "已完成", running: "执行中", queued: "排队中", failed: "失败", timeout: "超时" }[a.status] || a.status; }
function assignState(s) { return { done: "done", running: "working", queued: "waiting", failed: "blocked", timeout: "blocked" }[s] || "idle"; }

function routeKey(parts) {
  const head = parts[0] || "bots";
  if (head === "bots") return parts.length > 1 ? "bot" : "bots";
  if (head === "assignments") return parts.length > 1 ? "assignment" : "assignments";
  if (head === "chat") return "chat";
  return head;
}

/* =========================================================================
   4. 九类事件渲染
   ========================================================================= */
/* P0-05 降级：已声明类型内必填字段无法解析 → 「未知事件」折叠块，保留原始 JSON。
   必填字段取自架构文档 §3.4 事件契约（tool_result 必须能按 callId 挂回调用）。
   未声明的类型不在此列 —— 它们在流中完全不出现、不产生空块。 */
const EV_REQUIRED = {
  tool_call: ["name"],
  tool_result: ["callId", "ok"],
  plan: ["items"],
  permission: ["action"],
  error: ["text"]
};
function evMissing(ev) {
  const req = EV_REQUIRED[ev.type];
  if (!req) return null;                       /* 未声明类型：不渲染 */
  const miss = req.filter((k) => ev[k] === undefined || ev[k] === null || ev[k] === "");
  return miss.length ? miss : null;
}
function unknownEvHtml(ev, miss, id) {
  const raw = JSON.stringify(ev, null, 2);
  return `<div class="ev ev--unknown">
    <button class="ev-row" data-act="fold" data-target="${id}" aria-expanded="false">
      <span class="ev-unknown-mark">?</span>
      <span>未知事件</span>
      <span class="ev-unknown-why">${esc(ev.type)} · 缺 ${esc(miss.join(" / "))} · 已保留原始 JSON</span>
      <span class="chev">›</span></button>
    <div class="ev-body" id="${id}"><pre>${esc(raw)}</pre></div>
  </div>`;
}

function evHtml(ev, bot, uid) {
  const id = "ev-" + uid;
  const bc = `--bc:var(--bot-${bot.color});--bc-ink:var(--bot-${bot.color}-ink);--bc-tint:var(--bot-${bot.color}-tint)`;
  const miss = evMissing(ev);
  if (miss) return unknownEvHtml(ev, miss, id);
  switch (ev.type) {
    case "thinking":
      return `<div class="ev ev--think" style="${bc}">
        <button class="ev-row" data-act="fold" data-target="${id}" aria-expanded="false">
          <span class="u-faint">⋯</span><span>思考 ${esc(ev.dur || "")}${ev.chars ? " · " + ev.chars + " 字" : ""}</span>
          <span class="chev">›</span></button>
        <div class="ev-body" id="${id}"><pre>${esc(ev.text || "先确认输入，再决定要不要调用工具；这一步不需要用户参与。")}</pre></div>
      </div>`;
    case "tool_call":
      return `<div class="ev ev--tool${ev.running ? " is-running" : ""}" style="${bc}">
        <button class="ev-row" data-act="fold" data-target="${id}" aria-expanded="false">
          <span style="color:var(--bc)">▸</span>
          <span class="u-mono" style="font-size:11.5px">${esc(ev.name)}${ev.target ? " " + esc(ev.target) : ""}</span>
          <span class="chev">›</span></button>
        <div class="ev-body" id="${id}"><pre>${esc(ev.args || ("tool: " + ev.name + "\ninput: " + (ev.target || "") + "\nstarted: 14:32:08"))}</pre></div>
      </div>`;
    case "tool_result":
      return `<div class="ev ev--result" style="${bc}">
        <button class="ev-row" data-act="fold" data-target="${id}" aria-expanded="false">
          <span style="color:var(--color-${ev.ok ? "success" : "danger"})">${ev.ok ? "✓" : "✕"}</span>
          <span>${esc(ev.summary || (ev.ok ? "成功" : "失败"))}</span>
          <span class="chev">›</span></button>
        <div class="ev-body" id="${id}"><pre>${esc(ev.output || (ev.ok ? "# 输出\n1. Cursor\n2. [CC]\n3. Gemini CLI\n(42 行，已折叠)" : "exit code: 1\nstderr: ENOENT: no such file or directory"))}</pre></div>
      </div>`;
    case "plan": {
      const items = ev.items || [];
      const done = items.filter((i) => i.s === "done").length;
      const pct = items.length ? done / items.length : 0;
      const C = 2 * Math.PI * 6;
      const list = items.map((i) => `<li><span class="plan-dot ${i.s === "done" ? "is-done" : i.s === "doing" ? "is-doing" : ""}"></span>${esc(i.t)}</li>`).join("");
      return `<div class="ev" style="${bc}">
        <button class="ev-row" data-act="fold" data-target="${id}" aria-expanded="false">
          <svg class="plan-ring" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
            <circle class="bg" cx="8" cy="8" r="6"/><circle class="fg" cx="8" cy="8" r="6"
              stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C * (1 - pct)).toFixed(1)}"/></svg>
          <span>计划 ${items.length} 项 · ${done} 完成</span>
          <span class="chev">›</span></button>
        <div class="ev-body" id="${id}"><ul class="ev-plan-list">${list}</ul></div>
      </div>`;
    }
    case "permission":
      return permCardHtml(ev, bot);
    case "usage":
      return `<div class="ev" style="${bc}"><div class="usage-line"><span>∑</span><span>${num(ev.in)} in / ${num(ev.out)} out · ${esc(ev.mode)} ×${ev.mult}</span></div></div>`;
    case "end":
      return `<div class="ev" style="${bc}"><div class="end-stamp"><span class="state-dot" style="--s:var(--state-${ev.label === "失败" ? "blocked" : "done"})"></span>${esc(ev.label || "完成")} · ${esc(ev.dur || "")}</div></div>`;
    case "error":
      return `<div class="ev" style="${bc}">
        <div class="err-block">
          <div class="err-msg">${esc(ev.text)}</div>
          <div class="err-actions">
            <button class="btn btn--sm btn--primary" data-act="resend">重发</button>
            <button class="btn btn--sm btn--ghost" data-act="fold" data-target="${id}" aria-expanded="false">查看详情</button>
          </div>
          <div class="ev-body" id="${id}"><pre>${esc(ev.detail || "exit code: 1")}</pre></div>
        </div></div>`;
    case "message":
    default:
      return "";
  }
}

/* 权限卡片 */
function permCardHtml(ev, bot) {
  const no = ev.no || ("P-" + String(S.permSeq).padStart(4, "0"));
  const kind = ev.kind || "block";
  const bc = `--bc:var(--bot-${bot.color});--bc-ink:var(--bot-${bot.color}-ink)`;

  if (ev.state === "decided") {
    const rejected = /拒绝/.test(ev.decision || "");
    return `<div class="ev" style="${bc}">
      <button class="audit-row" data-act="fold" data-target="audit-${esc(no)}" aria-expanded="false">
        <span class="${rejected ? "no" : "ok"}">${rejected ? "✕" : "✓"}</span>
        <span>${esc(ev.decision || (rejected ? "已拒绝 · 你" : "已批准 · 你"))}</span>
        <span class="u-mono" style="font-size:11px;color:var(--color-text-muted)">${esc(ev.action || "")}</span>
        <span class="audit-no">№ ${esc(no)}</span>
      </button>
      <div class="ev-body" id="audit-${esc(no)}"><pre>${esc((ev.action || "") + "\n" + (ev.target || "") + "\n" + (ev.decision || "") + "\n记录已写入设置 › 权限审计")}</pre></div>
    </div>`;
  }

  const head = `<div class="perm-head">
      <span class="perm-tag">${kind === "boundary" ? "▲ 超出边界" : kind === "invalid" ? "▲ 已失效" : kind === "hold" ? "◷ 挂起中" : "▲ 等待批准"}</span>
      <span class="perm-no">№ ${esc(no)}</span></div>`;

  const fields = `<div class="perm-fields">
      <div class="perm-field"><span class="k">动作</span><span class="v">${esc(ev.action || "写文件 · Write")}</span></div>
      <div class="perm-field"><span class="k">目标</span><span class="v"><code>${esc(ev.target || "~/projects/agentbot/src/auth/session.ts")}</code></span></div>
      <div class="perm-field"><span class="k">来源</span><span class="v">${esc(ev.source || (bot.name + " · " + rtOf(bot.runtimeId).name + " · 第 3 轮"))}</span></div>
      ${kind === "hold"
        ? `<div class="perm-field"><span class="k">状态</span><span class="v" style="color:var(--color-info-ink)">等待你回来 · 已挂起 ${esc(ev.heldFor || "1h 20m")}</span></div>
           <div class="perm-field"><span class="k">上限</span><span class="v">最长保留 24h，期间运行时不退出</span></div>`
        : kind === "boundary"
          ? `<div class="perm-field"><span class="k">判定</span><span class="v" style="color:var(--color-danger-ink)">超出 Bot 边界 · 已自动拒绝</span></div>`
          : kind === "invalid"
            ? `<div class="perm-field"><span class="k">状态</span><span class="v">请求已失效 · 运行时进程已退出</span></div>`
            : `<div class="perm-field"><span class="k">剩余</span><span class="v"><span class="perm-countdown" data-no="${esc(no)}">${S.permSec}s</span> 后自动拒绝</span></div>`}
    </div>`;

  let actions;
  if (kind === "boundary") {
    actions = `<div class="perm-actions"><button class="btn btn--sm btn--secondary" data-act="go-boundary" data-bot="${esc(bot.id)}">去调整边界</button></div>`;
  } else if (kind === "invalid") {
    actions = `<div class="perm-actions">
      <span class="perm-btn"><button class="btn btn--sm" disabled>批准一次</button><kbd>A</kbd></span>
      <span class="perm-btn"><button class="btn btn--sm" disabled>拒绝</button><kbd>R</kbd></span></div>`;
  } else {
    actions = `<div class="perm-actions">
      <span class="perm-btn"><button class="btn btn--sm btn--primary" data-act="perm-decide" data-no="${esc(no)}" data-d="approve">批准一次</button><kbd>A</kbd></span>
      <span class="perm-btn"><button class="btn btn--sm btn--secondary" data-act="perm-decide" data-no="${esc(no)}" data-d="reject">拒绝</button><kbd>R</kbd></span>
      <span class="perm-btn"><button class="btn btn--sm btn--ghost" data-act="perm-decide" data-no="${esc(no)}" data-d="remember">记住（本会话）</button><kbd>⇧A</kbd></span>
      <span class="perm-btn"><button class="btn btn--sm btn--ghost" data-act="perm-decide" data-no="${esc(no)}" data-d="forever">记住（本 Bot 永久）</button><kbd>⌃⇧A</kbd></span>
    </div>`;
  }

  const note = kind === "boundary"
    ? "这个动作没有转发给运行时。边界变更只影响之后的请求。"
    : kind === "hold"
      ? "该请求来自 Assignment，不会因超时被拒绝；会话输入框不锁定。"
      : kind === "invalid"
        ? "运行时已退出，无法回传决定。重新发送可发起新请求。"
        : "决定会写入权限审计，记录不可在界面内删除。";

  return `<div class="ev" style="${bc}">
    <div class="perm perm--${kind}" data-perm="${esc(no)}" data-kind="${kind}" tabindex="-1">
      ${head}${fields}${actions}<div class="perm-note">${esc(note)}</div>
    </div></div>`;
}

/* =========================================================================
   5. 消息 / Turn
   ========================================================================= */
function bubbleRadius(cont, nextIsMsg) {
  if (!cont) return "";
  return nextIsMsg ? " bubble--mid" : " bubble--last";
}

function msgHtml(bot, text, opts) {
  opts = opts || {};
  const cont = !!opts.cont;
  const streaming = !!opts.streaming;
  const id = opts.id || "";
  const radius = bubbleRadius(cont, opts.nextIsMsg);
  const body = esc(text) + (streaming ? '<span class="cursor-stream"></span>' : "");
  const tools = opts.tools ? `<div class="msg-tools">
      <button class="msg-tool" data-act="to-assignment" data-text="${esc(text.slice(0, 40))}">转为任务</button>
      <button class="msg-tool" data-act="noop">设为定时</button>
    </div>` : "";
  const at = opts.at ? `<span class="msg-time">${esc(bot.name)} · ${esc(opts.at)}</span>` : "";
  const hover = (tools || at) ? `<div class="msg-hover">${tools}${at}</div>` : "";
  return `<div class="msg msg--bot${cont ? " msg--cont" : ""}" data-msg="${esc(id)}" style="${botVars(bot)}">
    ${cont ? "" : avWrap(bot, 32)}
    <div class="msg-col">
      ${cont ? "" : `<div class="msg-name">${esc(bot.name)}</div>`}
      <div class="bubble bubble--bot${radius}">${body}</div>
      ${hover}
    </div></div>`;
}

function userMsgHtml(text, at) {
  return `<div class="msg msg--user">
    <div class="msg-col">
      <div class="bubble bubble--user">${esc(text)}</div>
      <div class="msg-hover">
        <div class="msg-tools"><button class="msg-tool" data-act="to-assignment" data-text="${esc(text.slice(0, 40))}">转为任务</button></div>
        <span class="msg-time">你 · ${esc(at || "刚刚")}</span>
      </div>
    </div>
    <span class="av av--32 av--user">你</span></div>`;
}

function turnHtml(t) {
  const bot = botOf(t.botId);
  const rt = rtOf(t.runtimeId);
  const collapsed = t.status === "done" && !t.expanded;
  let right;
  if (t.status === "interrupted") {
    /* 中断是终态：重渲染后仍然是「已中断」，不能回退成「排队中」或「完成」 */
    right = stateChip("idle", "已中断") + '<span class="turn-sum">内容保留</span>';
  } else if (t.status === "done") {
    /* Turn 头的「完成」是轮次状态，不是 Bot 六态 —— 不参与 3s 回落到 idle（§2.5 只约束 Bot 状态） */
    right = stateChip("done", "完成") + `<span class="turn-sum">${esc(t.summary || "")}</span>`;
  } else if (t.status === "failed") {
    right = stateChip("blocked", "失败") + `<span class="turn-sum u-num">${esc(t.dur || "")}</span>`;
  } else if (t.status === "streaming") {
    /* data-tick 是秒表锚点：finishTurn 重写 Turn 头后这个锚点消失，
       秒表的下一次 tick 找不到它，就不会把「完成 · 842/214」改回「12s」。 */
    right = stateChip("working", "生成中") + `<span class="turn-sum u-num" data-tick>${esc(t.dur || "0s")}</span>`;
  } else {
    right = stateChip(t.stateKey || "waiting", t.statusLabel || "排队中") + `<span class="turn-sum">${esc(t.summary || "")}</span>`;
  }

  /* 消息连发：组首无缺口、组中双缺口、组末缺口朝上 */
  const evs = t.events || [];
  let body = "";
  evs.forEach((e, i) => {
    if (e.type === "message") {
      const prev = evs[i - 1];
      const next = evs[i + 1];
      const cont = !!(prev && prev.type === "message");
      body += msgHtml(bot, e.text, {
        cont, nextIsMsg: !!(next && next.type === "message"),
        streaming: !!e.streaming, tools: true, id: t.id + "-m" + i,
        at: e.at || t.at || ""
      });
    } else {
      body += evHtml(e, bot, t.id + "-" + i);
    }
  });

  /* 中断轮次的尾注也要能重建（否则切主题后只剩一个灰头，用户不知道发生过什么） */
  if (t.status === "interrupted") {
    body += `<div class="interrupted-note">已中断 · 已向运行时发出 cancel，生成的内容保留在原处。</div>`;
  }

  return `<section class="turn${collapsed ? " is-collapsed" : ""}${t.status === "interrupted" ? " is-interrupted" : ""}${t.permKind === "block" ? " turn--perm-block" : ""}"
      data-turn="${esc(t.id)}" data-bot="${esc(bot.id)}" style="${botVars(bot)}">
    <header class="turn-head" tabindex="0" role="button" aria-expanded="${!collapsed}"
      data-act="toggle-turn" data-id="${esc(t.id)}">
      ${av(bot, 24)}
      <span class="turn-name">${esc(bot.name)}</span>
      ${rtChip(rt)}
      <span class="rt-chip">${esc(t.mode || "交互")}</span>
      <span class="turn-right">${right}
        <span class="turn-chev">${collapsed ? "›" : "⌄"}</span></span>
    </header>
    <div class="turn-body">${body}</div>
  </section>`;
}

function sysHtml(it) {
  return `<div class="sys-block enter">
    <span class="sys-tag">${esc(it.tag)}</span>
    <div class="sys-body">
      <div style="font-size:var(--font-size-caption);color:var(--color-text)">${esc(it.title)}</div>
      ${it.items && it.items.length ? `<ul class="sys-list">${it.items.map((x) => {
        const b = S.bots.find((v) => v.name === x.name);
        return `<li style="${b ? botVars(b) : ""}">${b ? av(b, 20) : ""}<b style="color:var(--bc-ink, var(--color-text))">${esc(x.name)}</b><span class="u-muted">— ${esc(x.reason)}</span></li>`;
      }).join("")}</ul>` : ""}
      <div class="sys-foot">${esc(it.foot || "")}</div>
    </div></div>`;
}
function fenceHtml(it) {
  const dots = (it.bots || []).map((id) => `<i style="--c:var(--bot-${botOf(id).color})"></i>`).join("");
  return `<div class="fence"><span class="dots">${dots}</span><span>本轮结束 · ${(it.bots || []).length} 个 Bot · ${num(it.tokens)} token</span></div>`;
}
function dividerHtml(it) {
  return `<div class="session-divider"><span>${esc(it.text || "新 Session · 已重建上下文（人格 + 记忆 + 最近 20 条）")}</span></div>`;
}
/* 活动行：其余运行中的 Bot 折叠成 40px 一行，点击接管展开 */
function actRowHtml(it) {
  const b = botOf(it.botId);
  return `<button class="act-row" data-act="takeover" data-bot="${esc(b.id)}" data-what="${esc(it.what || "正在运行")}"
      data-dur="${esc(it.dur || "0s")}" style="${botVars(b)}" aria-label="${esc(b.name)} 正在运行，点击接管这一轮">
    ${av(b, 20)}
    <span class="act-name">${esc(b.name)}</span>
    <span class="act-what">正在运行 <code>${esc(it.what || "")}</code> · <span class="act-dur" data-act-dur>${esc(it.dur || "0s")}</span></span>
    <span class="act-take">点击接管</span>
    <span class="act-bar"><i style="width:${it.pct == null ? 40 : it.pct}%"></i></span>
  </button>`;
}
/* 「期间发生了什么」：事件数与最后活动时间来自数据层，不补播流式动画 */
function awayHtml(it) {
  if (!(it.eventCount > 0)) return "";
  return `<div class="task-away">期间发生了什么 · ${it.eventCount} 条事件${it.lastEventAt ? " · 最后活动 " + agoText(it.lastEventAt) : ""}</div>`;
}

function taskHtml(it) {
  const b = botOf(it.botId);
  const st = it.status || "queued";
  const label = { queued: "已排队", running: "执行中", done: "已完成", failed: "失败" }[st];
  const stateKey = { queued: "waiting", running: "working", done: "done", failed: "blocked" }[st];
  const extra = st === "queued" ? ` · ${esc(b.name)} · 0s`
    : st === "running" ? ` · ${esc(b.name)} · ${esc(it.dur || "12s")} · 正在读 docs/plan.md`
      : ` · ${esc(b.name)} · ${esc(it.dur || "1m 12s")}`;
  /* UX F3-4：离开页面再回来，卡片显示最新状态 +「期间发生了什么」。 */
  const away = awayHtml(it);
  return `<div class="task-card" data-task="${esc(it.no)}" style="${botVars(b)}">
    <div class="task-head"><span class="u-label">Assignment</span><span class="task-no">№ ${esc(it.no)}</span></div>
    <div class="task-title">${esc(it.title)}</div>
    <div class="task-status">${stateChip(stateKey, label + extra)}</div>
    ${away}
    <div class="task-report" ${st === "done" ? "" : "hidden"} data-report>
      <div class="u-label" style="margin-bottom:6px">报告摘要</div>
      <ul>
        <li>三处风险已按影响面排序，第一条会推迟发布一天。</li>
        <li>涉及 2 个文件的改动建议，未直接修改。</li>
      </ul>
      <div class="usage-line" style="margin-top:8px">${it.usage ? num(it.usage.in) + " in / " + num(it.usage.out) + " out · 交互 ×1" : "1,204 in / 388 out · 交互 ×1"}</div>
      <button class="btn btn--sm btn--secondary" style="margin-top:10px" data-act="open-assignment" data-id="${esc(it.assignmentId || "a-0142")}">查看完整报告</button>
    </div>
    ${st === "done" ? "" : `<div class="u-faint task-note" style="font-size:11px;margin-top:8px">执行不占用输入框，你可以继续聊天。</div>`}
  </div>`;
}

/* 相对时间（任务卡「最后活动」用）：只做秒/分/小时三档，够用且不引入日期库 */
function agoText(ts) {
  const s = Math.max(0, Math.round((Date.now() - ts) / 1000));
  if (s < 60) return s + "s 前";
  const m = Math.floor(s / 60);
  if (m < 60) return m + "m 前";
  return Math.floor(m / 60) + "h 前";
}

function renderStreamItems(items) {
  return items.map((it) => {
    if (it.k === "user") return userMsgHtml(it.text, it.at);
    if (it.k === "turn") return turnHtml(it);
    if (it.k === "sys") return sysHtml(it);
    if (it.k === "fence") return fenceHtml(it);
    if (it.k === "divider") return dividerHtml(it);
    if (it.k === "act") return actRowHtml(it);
    if (it.k === "task") return taskHtml(it);
    return "";
  }).join("");
}

          <div class="u-label" style="margin-bottom:8px;color:var(--color-danger-ink)">危险区</div>
          <p style="font-size:var(--font-size-caption);color:var(--color-text-muted);line-height:1.7;margin-bottom:12px">删除需要输入 Bot 名称，并选择会话与记忆的处理方式。worktree 不会被自动删除。</p>
          <button class="btn btn--sm btn--danger" data-act="noop">删除这个 Bot</button>
        </section>
      </aside></div>`;
  }

  if (S.botTab === "memory") {
    const mems = S.memory[b.id] || [];
    const injected = mems.filter((m) => m.on).length;
    /* 与 /chat 右面板、输入框下同一口径（memBudget），同一个 Bot 全站只有一个数 */
    const budget = memBudget(b.id);
    body += `<div class="detail-grid"><div>
      <div class="filters" style="min-height:auto">
        <span class="u-label">本轮注入估算</span><span class="u-mono" data-mem-budget="${esc(b.id)}">${num(budget.chars)} / ${num(budget.cap)} 字符</span>
        <span class="spacer"></span>
        <button class="btn btn--sm btn--secondary" data-act="noop">立即摘要</button>
        <button class="btn btn--sm btn--primary" data-act="add-memory">新增</button>
      </div>
      ${mems.length ? mems.map((m) => `<div class="mem-item">
        <button class="switch${m.on ? " is-on" : ""}" data-act="toggle-memory" data-id="${m.id}" aria-label="是否注入" aria-pressed="${m.on}"></button>
        <div style="flex:1;min-width:0">
          <div class="mem-text">${esc(m.text)}</div>
          <div class="mem-meta"><span>来源 ${esc(m.src)}</span><span>${esc(m.at)}</span>
          ${m.kind === "summary" ? '<span class="cap cap--no">自动摘要</span>' : ""}</div>
        </div></div>`).join("") : `<div class="empty"><h3>还没有记忆条目</h3><p>记忆条目跨 Session 保留，换运行时不丢。</p><div class="empty-actions"><button class="btn btn--primary" data-act="add-memory">新增记忆</button></div></div>`}
    </div>
    <aside><section class="card card-pad"><div class="u-label" style="margin-bottom:8px">注入规则</div>
      <p style="font-size:var(--font-size-caption);color:var(--color-text-muted);line-height:1.8">人格 + 标记注入的记忆，总字符不超过 6,000；超出按更新时间倒序截断，并在会话里显示「已截断 N 条」。当前注入 ${injected} 条。</p></section></aside></div>`;
  }

  if (S.botTab === "boundary") {
    body += `<div class="detail-grid"><div>
      <section class="card card-pad" style="margin-bottom:24px">
        <div class="u-label" style="margin-bottom:10px">允许目录</div>
        <pre class="u-mono" style="margin:0 0 16px;padding:12px;background:var(--color-surface-2);border-radius:8px;color:var(--color-text-secondary)">~/projects/agentbot
~/.agentbot/wt/research</pre>
        <div class="u-label" style="margin-bottom:10px">工具</div>
        <div class="cap-row">
          <span style="display:flex;gap:8px;align-items:center"><span class="u-label" style="letter-spacing:0">Shell</span><span class="cap cap--no">— 不允许</span></span>
          <span style="display:flex;gap:8px;align-items:center"><span class="u-label" style="letter-spacing:0">联网</span><span class="cap cap--yes">✓ 允许</span></span>
          <span style="display:flex;gap:8px;align-items:center"><span class="u-label" style="letter-spacing:0">写操作</span><span class="cap cap--unknown">? 需批准</span></span>
        </div>
      </section>
      <section class="card card-pad">
        <div class="u-label" style="margin-bottom:8px">边界拒绝记录（只读）</div>
        ${[["14:32", "写 /etc/hosts", "超出边界", "v3"], ["昨天 16:20", "Bash: rm -rf ~/projects", "超出边界", "v3"]].map((r) =>
          `<div class="grid-row" style="grid-template-columns:80px minmax(0,1fr) 90px 40px;cursor:default">
            <span class="u-mono u-faint">${r[0]}</span><span class="u-mono">${esc(r[1])}</span>
            <span style="color:var(--color-danger-ink);font-size:var(--font-size-caption)">${r[2]}</span><span class="u-mono u-faint">${r[3]}</span>
          </div>`).join("")}
      </section></div>
      <aside style="display:grid;gap:16px">
        <section class="card card-pad"><div class="u-label" style="margin-bottom:8px">写操作自动批准</div>
          <p style="font-size:var(--font-size-caption);color:var(--color-text-muted);line-height:1.8;margin-bottom:12px">开启后，边界内的写操作不再弹卡片，只写审计。边界外仍然拒绝。</p>
          <button class="btn btn--sm btn--secondary" data-act="noop">开启（需二次确认）</button></section>
        <section class="card card-pad"><div class="u-label" style="margin-bottom:8px">预授权</div>
          <p style="font-size:var(--font-size-caption);color:var(--color-text-muted)">暂无。记住过的动作会出现在这里。</p></section>
      </aside></div>`;
  }

  if (S.botTab === "sessions") {
    body += `<div class="card" style="padding:8px">
      <div class="grid-row is-head sess-head"><span>时间</span><span>运行时</span><span>续接状态</span><span style="text-align:right">消息</span><span style="text-align:right">token</span><span></span></div>
      ${[["今天 14:12", rt.name, "已续接上下文", "24", "1,592"], ["昨天 16:20", rt.name, "已重建上下文", "41", "3,204"], ["昨天 09:04", "Gemini CLI", "新 Session", "12", "918"]].map((r) =>
        `<div class="grid-row sess-row" data-act="open-chat" data-id="d1">
          <span class="sess-time">${r[0]}</span><span class="sess-rt u-muted">${esc(r[1])}</span><span class="sess-state u-muted">${esc(r[2])}</span>
          <span class="cell-num sess-msgs">${r[3]}</span><span class="cell-num sess-tokens">${r[4]}</span>
          <span class="sess-open" style="text-align:right"><span class="btn btn--sm btn--ghost">只读打开</span></span>
        </div>`).join("")}
    </div>`;
  }

  return shell("bots", [{ t: "Bot", href: "/bots" }, { t: b.name }], head + tabBar + body);
}

      ${avatars}
      <div class="row-main">
        <div class="row-title">${esc(c.name)}
          ${isGroup ? `<span class="rt-chip">群聊 · ${c.participants.length} 人</span>` : ""}
          ${c.type === "dm" && c.id === "d3" ? `<span class="state state--waiting">${stateIcon("waiting")}<span>挂起</span></span>` : ""}
        </div>
        <div class="row-sub">${esc(c.last)}</div>
      </div>
      <div class="row-time">${esc(c.time)}${c.unread ? `<div style="margin-top:4px"><span class="unread">${c.unread}</span></div>` : ""}</div>
    </a>`;
  };

  const groups = S.channels.filter((c) => c.type === "group");
  const dms = S.channels.filter((c) => c.type === "dm");

  return shell("chats", [{ t: "会话", href: "/chats" }], head +
    `<div class="u-label" style="margin:0 0 8px 12px">群聊</div><div class="rows">${groups.map((c, i) => row(c, i)).join("")}</div>
     <div class="u-label" style="margin:24px 0 8px 12px">私聊</div><div class="rows">${dms.map((c, i) => row(c, i + 2)).join("")}</div>`);
}

/* F3-1：会话顶部细提示条（单一实现，视图与运行中刷新都用它） */
function taskTipbarHtml(chId) {
  const active = S.assignments.filter((a) => a.channelId === chId && (a.status === "running" || a.status === "queued"));
  if (!active.length) return "";
  const a0 = active[0];
  return `<a class="task-tipbar" href="#/assignments/${esc(a0.id)}">
      <span class="state-dot" style="--s:var(--state-working)"></span>
      <span>本会话有 ${active.length} 个任务执行中 · ${esc(a0.title.slice(0, 18))}${a0.title.length > 18 ? "…" : ""}</span>
      <span class="spacer"></span>
      <span class="u-mono">${esc(a0.no)} ›</span></a>`;
}

/* 会话视图 */
function viewChat(chId) {

    <button class="btn btn--sm btn--ghost" data-act="toggle-aside" aria-controls="aside" aria-expanded="false">上下文</button>
  </div>`;

  let streamBody = "";

    streamBody += `<div class="banner" style="margin:8px 0"><span class="state-dot" style="--s:var(--state-blocked)"></span><span>和本地服务的连接断开了，正在重连。已收到的内容不会丢。</span><span class="spacer"></span><button class="btn btn--sm" data-act="demo-set" data-v="normal">手动重连</button></div>`;
  }
  if (st === "loading") {
    streamBody += `<div style="display:grid;gap:14px;padding-top:16px">${["70%", "88%", "52%", "76%"].map((w) => `<div class="sk" style="height:16px;width:${w}"></div>`).join("")}</div>`;
  } else if (st === "empty" || items.length === 0) {
    const b = isGroup ? botOf(c.host) : botOf(c.botId);
    streamBody = `<div class="empty" style="margin-top:8px">
      <div class="empty-icon">${ICONS.chats}</div>
      <h3>${esc(b.name)}</h3>
      <p>${esc(b.persona)}。${isGroup ? "主持人会决定这一轮谁来回答。" : ""}</p>
      <div class="empty-actions" style="flex-direction:column;align-items:stretch;width:100%;max-width:460px">
        ${["这版发布计划有什么风险？", "把结论整理成一段可以直接贴进周报的话", "这三家里谁的免费额度收紧得最狠？"].map((q) =>
          `<button class="btn btn--secondary" style="justify-content:flex-start;text-align:left" data-act="fill-prompt" data-q="${esc(q)}">${esc(q)}</button>`).join("")}
      </div></div>`;
  } else {
    streamBody += renderStreamItems(items);
  }

  const participants = isGroup ? c.participants.map(botOf) : [botOf(c.botId)];
  const memPool = isGroup ? participants.flatMap((p) => S.memory[p.id] || []) : (S.memory[c.botId] || []);
  const memOn = memPool.filter((m) => m.on);
  /* 注入预算：与 /bots/:id 记忆标签同一口径（memBudget）。
     单聊＝该 Bot 的数；群聊＝全部参与者合计。之前这里自己算 length*520、
     记忆标签硬编码 3,120，同一个 Bot 在两个页面显示两个数，用户无法判断哪个是真的。 */
  const budget = memBudget(isGroup ? participants.map((p) => p.id) : c.botId);
  const memChars = budget.chars;
  const ctx = `<aside class="aside" id="aside" aria-label="上下文面板">
    <div class="aside-drawer-head">
      <span class="u-label">上下文</span>
      <span class="spacer"></span>
      <button class="icon-btn" data-act="close-aside" aria-label="关闭上下文面板">${ICONS.close}</button>
    </div>
    <div class="aside-sec">
      <h4>参与者与运行时</h4>
      ${participants.map((p) => `<div class="person" style="${botVars(p)}">
        ${avWrap(p, 24)}
        <span class="person-name">${esc(p.name)}${isGroup && p.id === c.host ? ' <span class="u-label">主持</span>' : ""}</span>
        <span class="rt-chip">${esc(rtOf(p.runtimeId).name)}</span>
      </div>`).join("")}
    </div>
    <div class="aside-sec">
      <h4>当前 Session</h4>
      <div class="kv"><span class="k">状态</span><span class="v">${(() => {
        const ds = (S.streams[chId] || []).filter((x) => x.k === "divider");
        const last = ds[ds.length - 1];
        if (!last) return "已续接上下文";
        return /新 Session|重建/.test(last.text) ? "新 Session · 已重建" : "已续接上下文";
      })()}</span></div>
      <div class="kv"><span class="k">开始</span><span class="v">今天 14:12</span></div>
      <div class="kv"><span class="k">执行位置</span><span class="v">${esc(participants[0].location)} ${esc(participants[0].path)}</span></div>
    </div>
    <div class="aside-sec">
      <h4>记忆</h4>
      <div class="kv"><span class="k">注入</span><span class="v" data-mem-budget="${esc(isGroup ? participants.map((p) => p.id).join(",") : c.botId)}">${memOn.length} 条 · ${num(memChars)} 字符</span></div>
      <div class="kv"><span class="k">截断</span><span class="v">—</span></div>
    </div>
    <div class="aside-sec">
      <h4>边界</h4>
      <div class="kv"><span class="k">目录</span><span class="v">只读 2 · 写 1</span></div>
      <div class="kv"><span class="k">Shell</span><span class="v">不允许</span></div>
      <div class="kv"><span class="k">联网</span><span class="v">允许</span></div>
    </div>
    <div class="aside-sec">
      <h4>最近任务</h4>
      ${S.assignments.filter((a) => a.channelId === chId).slice(0, 3).map((a) =>
        `<a href="#/assignments/${a.id}" class="kv" style="text-decoration:none"><span class="k">${esc(a.no)}</span><span class="v">${esc(statusWord(a))} · ${esc(a.title.slice(0, 12))}…</span></a>`).join("")
        || `<p style="font-size:11px;color:var(--color-text-muted)">这个会话还没有任务</p>`}
    </div>
  </aside>`;
  /* 抽屉遮罩：窄屏右面板改为覆盖层，点遮罩关闭（UX §7「折叠为右侧抽屉」） */
  const asideScrim = `<div class="aside-scrim" data-act="close-aside" aria-hidden="true"></div>`;

  const locked = !!S.activePerm;

  const composer = `<div class="composer-wrap">
    <div class="composer${locked ? " is-locked" : ""}" id="composer">
      <button class="comp-icon" data-act="noop" aria-label="指定 Bot" title="指定 Bot">${ICONS.at}</button>
      <textarea id="composer-input" rows="1" placeholder="${locked ? "等待你批准，无法继续发送" : "给 " + esc(c.name) + " 发消息…"}" ${st === "error" ? "disabled" : ""}></textarea>
      <button class="comp-send" data-act="send" id="send-btn" aria-label="发送">${ICONS.send}</button>
    </div>
    <div class="comp-meta">
      <span>Enter 发送 · Shift+Enter 换行</span><span>·</span>
      <span>${isGroup ? "主持人会先决定谁来说" : "运行时 " + esc(rtOf(botOf(c.botId).runtimeId).name)}</span>
      <span class="spacer"></span>
      <span class="u-mono" data-mem-budget="${esc(isGroup ? participants.map((p) => p.id).join(",") : c.botId)}">≈ ${num(memChars)} / ${num(budget.cap)} 字符注入</span>
    </div>

  /* F3-1 / UX §6.1：会话顶部细提示条「本会话有 N 个任务执行中」。

     否则会以为任务丢了。 */
  const taskBar = taskTipbarHtml(chId);

  const dmRt = isGroup ? null : rtOf(botOf(c.botId).runtimeId);

    ? `<div class="banner banner--info" style="margin:8px var(--space-7) 0">${esc(dmRt.name)} 一次返回完整结果，期间不会显示中间过程（预计 30–60s）。</div>`
    : "";

  return shell("chats", [{ t: "会话", href: "/chats" }, { t: c.name }],
    `<div class="chat"><div class="chat-main">${head}${capTip}${taskBar}
      <div class="stream" id="stream"><div class="stream-inner" id="stream-inner">${streamBody}</div></div>

  const tabs = [["all", "全部"], ["queued", "排队"], ["running", "执行中"], ["done", "已完成"], ["failed", "失败"]];
  const chips = `<div class="filters enter" style="--i:1">${tabs.map(([k, l]) =>
    `<button class="chip${S.assignFilter === k ? " is-on" : ""}" data-act="assign-filter" data-v="${k}">${l}<span class="n">${counts[k] || 0}</span></button>`).join("")}</div>`;

  const rows = S.assignments.filter((a) => S.assignFilter === "all" || a.status === S.assignFilter);
  const list = `<div class="card" style="padding:8px">
    <div class="grid-row is-head assign-head">
      <span>标题</span><span>指派 Bot</span><span>来源会话</span><span>状态</span><span style="text-align:right">耗时</span><span style="text-align:right">用量</span></div>
    ${rows.map((a, i) => {
      const b = botOf(a.botId);
      const usage = a.usage.in == null ? "—" : shortNum(a.usage.in) + " / " + shortNum(a.usage.out);
      return `<div class="grid-row assign-row enter${a.status === "failed" ? " is-dim" : ""}" style="--i:${Math.min(i + 2, 5)}" data-act="open-assignment" data-id="${a.id}">
        <span class="assign-title" style="font-weight:var(--weight-semibold);color:var(--color-text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(a.title)}</span>
        <span class="assign-bot" style="display:flex;align-items:center;gap:8px;min-width:0;${botVars(b)}">
          ${av(b, 24)}<span style="font-size:var(--font-size-caption);color:var(--bc-ink)">${esc(b.name)}</span>
        </span>
        <span class="assign-channel u-muted" style="font-size:var(--font-size-caption)">${esc(chanOf(a.channelId) ? chanOf(a.channelId).name : "—")}</span>
        <span class="assign-status">${stateChip(assignState(a.status), statusWord(a))}</span>
        <span class="cell-num u-muted assign-dur">${esc(a.dur)}</span>
        <span class="cell-num u-muted assign-usage">${usage}</span>
      </div>`;
    }).join("")}</div>`;

  return shell("assignments", [{ t: "任务", href: "/assignments" }], head + chips + list);
}

function viewAssignment(id) {
  const a = assignOf(id);
  if (!a) return shell("assignments", [{ t: "任务", href: "/assignments" }, { t: "未找到" }], `<div class="empty"><h3>没有这个任务</h3><p>它可能已被删除。</p><a class="btn" href="#/assignments">返回</a></div>`);
  const st = demoOf("assignment");
  const b = botOf(a.botId);
  const rt = rtOf(a.runtimeId);
  const ch = chanOf(a.channelId);

  const head = `<div class="page-head enter" style="--i:0">
    <div><h1 class="page-title">${esc(a.title)}</h1>
      <div class="detail-meta">
        <span class="u-mono" style="color:var(--color-text-muted)">№ ${esc(a.no)}</span>
        ${stateChip(assignState(a.status), statusWord(a))}
        <span style="display:flex;align-items:center;gap:6px" >${av(b, 20)}<span style="font-size:var(--font-size-caption);color:var(--bc-ink);${botVars(b)}">${esc(b.name)}</span></span>
        ${rtChip(rt)}
      </div></div>
    <div class="page-actions">
      ${a.status === "failed" || a.status === "timeout" ? `<button class="btn btn--primary" data-act="rerun" data-id="${a.id}">重跑</button>` : ""}
      <a class="btn btn--secondary" href="#/assignments">全部任务</a></div>
  </div>`;

  const fields = `<div class="card card-pad enter" style="--i:1;margin-bottom:24px">
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:16px">
      ${[["来源会话", ch ? ch.name : "—"], ["执行位置", b.location + " " + b.path], ["开始", a.started], ["耗时", a.dur],
         ["用量", a.usage.in == null ? "— 未上报" : num(a.usage.in) + " in / " + num(a.usage.out) + " out"]].map(([k, v]) =>
        `<div><div class="u-label" style="margin-bottom:4px">${k}</div><div style="font-size:var(--font-size-caption);color:var(--color-text-secondary)">${esc(v)}</div></div>`).join("")}
    </div></div>`;

  let doc = "";
  if (st === "empty" || a.status === "queued") {
    const waitingForPerm = /等待你批准/.test(a.wait || "");
    doc = `<div class="card card-pad"><div class="empty" style="box-shadow:none;padding:24px 0">
      <div class="empty-icon">${ICONS.clock}</div>
      <h3>${esc(a.wait || "等待前序任务（第 2 位）")}</h3>
      <p>${waitingForPerm ? "权限请求 P-0143 正在「文案助手」会话里等待你的决定。批准后任务会从这里继续；请求挂起期间不占用会话输入框。" : "同一个 Bot 同时只执行 2 个任务，队列上限 5。前序任务结束后会自动开始，不需要你操作。"}</p>
      <div class="empty-actions">${waitingForPerm ? `<a class="btn btn--sm btn--secondary" href="#/chat/d3">查看权限请求</a>` : `<a class="btn btn--sm btn--secondary" href="#/assignments/a-0141">查看前序任务 A-0141</a>`}</div></div></div>`;
  } else if (st === "error" || a.status === "failed") {
    doc = `<div class="card card-pad">
      <div class="err-block" style="margin-bottom:24px">
        <div class="err-msg">${esc(a.failReason || "运行时退出，这一轮没有完成。已有产出保留。")}</div>
        <div class="err-actions"><button class="btn btn--sm btn--primary" data-act="rerun" data-id="${a.id}">重跑</button><button class="btn btn--sm btn--secondary" data-act="noop">导出最后 50 条事件</button></div>
      </div>
      <div class="u-label" style="margin-bottom:8px">最后 50 条事件</div>
      <pre class="u-mono" style="margin:0;padding:12px;background:var(--color-surface-2);border-radius:8px;color:var(--color-text-secondary);white-space:pre-wrap">${esc((a.events || []).map((e, i) => String(i + 1).padStart(3, "0") + "  " + e.type + "  " + (e.text || e.target || e.summary || "")).join("\n"))}</pre>
    </div>`;
  } else if (st === "loading") {
    doc = `<div class="card card-pad"><div class="u-label" style="margin-bottom:12px">报告生成中 · 已完成 18 个事件</div>
      ${["86%", "72%", "90%", "54%"].map((w) => `<div class="sk" style="height:12px;width:${w};margin-bottom:12px"></div>`).join("")}</div>`;
  } else {
    doc = `<div class="card card-pad">
      <div class="u-label" style="margin-bottom:10px">执行摘要</div>
      <ol style="font-size:var(--font-size-body-sm);color:var(--color-text-secondary);line-height:1.8;padding-left:1.2em">
        ${a.summary.length ? a.summary.map((s) => `<li style="margin-bottom:8px">${esc(s)}</li>`).join("") : "<li>任务正在执行，报告将在完成后生成。</li>"}</ol>
      <div class="u-label" style="margin:24px 0 10px">改动文件</div>
      ${a.files.length ? a.files.map((f) => `<div style="display:flex;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--color-border)">
        <span class="u-mono" style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis">${esc(f.p)}</span>
        <span class="u-mono" style="color:var(--color-success-ink)">+${f.add}</span>
        <span class="u-mono" style="color:var(--color-danger-ink)">−${f.del}</span></div>`).join("")
        : `<p style="font-size:var(--font-size-caption);color:var(--color-text-muted)">尚未产生文件改动。</p>`}
      <div class="u-label" style="margin:24px 0 8px">用量</div>
      <div class="usage-line">${a.usage.in == null ? "— 运行时未上报" : num(a.usage.in) + " in / " + num(a.usage.out) + " out · 交互 ×1"}</div>
      <div style="margin-top:20px;padding-top:16px;border-top:1px solid var(--color-border);display:flex;align-items:center;gap:12px;flex-wrap:wrap">
        <span style="font-size:var(--font-size-caption);color:var(--color-text-muted)">交付物：${esc(a.deliverable)}</span>
        <span class="spacer"></span>
        <span class="state state--done">${stateIcon("done")}<span>已交付 · ${esc(a.started)}</span></span>
      </div>
    </div>`;
  }

  const timeline = `<aside class="card card-pad" style="position:sticky;top:72px">
    <div class="u-label" style="margin-bottom:12px">事件流</div>
    ${(a.events || []).length ? a.events.map((e, i) => {
      const sym = { thinking: "⋯", tool_call: "▸", tool_result: "◂", plan: "≡", permission: "▲", usage: "∑", end: "■", error: "✕", message: "·" }[e.type] || "·";
      const color = e.type === "error" || (e.type === "tool_result" && e.ok === false) ? "var(--color-danger)" : e.type === "tool_call" ? "var(--color-primary)" : e.type === "tool_result" ? "var(--color-success)" : "var(--color-text-muted)";
      const label = e.type === "thinking" ? "思考 " + e.dur
        : e.type === "tool_call" ? e.name + " " + (e.target || "")
          : e.type === "tool_result" ? e.summary
            : e.type === "plan" ? "计划 " + e.items.length + " 项"
              : e.type === "permission" ? "权限 · " + (e.state === "decided" ? e.decision : "待批")
                : e.type === "usage" ? num(e.in) + " in / " + num(e.out) + " out"
                  : e.type === "end" ? e.label + " · " + e.dur
                    : e.type === "error" ? "错误" : "消息";
      return `<div style="display:flex;gap:8px;font-size:11px;padding:4px 0;color:var(--color-text-secondary)">
        <span class="u-mono" style="color:${color};width:12px;text-align:center">${sym}</span>
        <span class="u-mono" style="color:var(--color-text-muted);width:20px">${String(i + 1).padStart(2, "0")}</span>
        <span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(label)}</span></div>`;
    }).join("") : `<p style="font-size:11px;color:var(--color-text-muted)">还没有事件</p>`}
  </aside>`;

  return shell("assignments", [{ t: "任务", href: "/assignments" }, { t: a.no }],
    head + `<div class="assign-detail" style="display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;align-items:start">${fields ? `<div>${fields}${doc}</div>` : doc}${timeline}</div>`);
}

function viewUsage() {
  const st = demoOf("usage");
  const head = `<div class="page-head enter" style="--i:0">
    <div><h1 class="page-title">用量</h1>
      <p class="page-desc">按 Bot × 运行时聚合。数值全部来自运行时上报；没上报的显示 —，不估算。</p></div>
    <div class="spacer"></div><button class="btn btn--secondary" data-act="noop">导出 CSV</button></div>`;

  const chips = `<div class="filters enter" style="--i:1">
    <div class="filter-group"><span class="u-label">范围</span>
      ${["今天", "7 天", "30 天", "全部"].map((t) => `<button class="chip${S.usageRange === t ? " is-on" : ""}" data-act="usage-range" data-v="${t}">${t}</button>`).join("")}</div>
    <div class="filter-group"><span class="u-label">Bot</span><button class="chip is-on" data-act="noop">全部</button></div>
    <div class="filter-group"><span class="u-label">运行时</span><button class="chip is-on" data-act="noop">全部</button></div></div>`;

  if (st === "loading") return shell("usage", [{ t: "用量", href: "/usage" }], head + chips + `<div class="rows">${[1, 2, 3, 4, 5, 6].map(() => `<div class="row-item"><span class="sk sk-line" style="width:80%;display:block"></span></div>`).join("")}</div>`);
  if (st === "error") return shell("usage", [{ t: "用量", href: "/usage" }], head + chips + `<div class="banner"><span class="state-dot" style="--s:var(--state-blocked)"></span><span>查询失败，筛选条件已保留。</span><span class="spacer"></span><button class="btn btn--sm" data-act="demo-set" data-v="normal">重试</button></div>`);
  if (st === "empty") return shell("usage", [{ t: "用量", href: "/usage" }], head + chips + `<div class="empty"><div class="empty-icon">${ICONS.chart}</div><h3>还没有可统计的调用</h3><p>每轮对话结束后 5 秒内，用量会出现在这里。运行时不上报的，会单列成「未上报」。</p></div>`);

  const maxIn = Math.max(...S.usage.map((u) => u.in || 0));
  const sumIn = S.usage.reduce((s, u) => s + (u.in || 0), 0);
  const sumOut = S.usage.reduce((s, u) => s + (u.out || 0), 0);
  const sumReq = S.usage.reduce((s, u) => s + u.req, 0);

  const rows = S.usage.map((u, i) => {
    const b = u.deleted
      ? { id: u.botId, name: u.name, initial: u.initial, color: u.color, state: "idle", runtimeId: u.runtimeId }
      : botOf(u.botId);
    const pct = u.in ? Math.max(3, Math.round((u.in / maxIn) * 100)) : 0;
    return `<div class="grid-row usage-row enter${u.deleted ? " is-dim" : ""}" style="--i:${Math.min(i + 2, 5)};${botVars(b)}">
      <span class="usage-bot" style="display:flex;align-items:center;gap:10px;min-width:0">
        ${av(b, 28)}
        <span style="min-width:0">
          <span style="font-size:var(--font-size-caption);font-weight:var(--weight-semibold);color:var(--bc-ink)">${esc(b.name)}</span>
          ${u.deleted ? `<span class="cap cap--no" style="margin-left:6px">已删除 Bot</span>` : ""}
        </span>
      </span>
      <span class="rt-chip usage-rt" style="justify-self:start">${esc(rtOf(u.runtimeId).name)}</span>
      <span class="usage-nums">
        <span class="cell-num" data-label="请求数">${u.req}</span>
        <span class="cell-num" data-label="输入 token">${u.unreported ? "—" : num(u.in)}</span>
        <span class="cell-num" data-label="输出 token">${u.unreported ? "—" : num(u.out)}</span>
      </span>
      <span class="usage-bar-cell" style="${botVars(b)}">
        <span class="bar-track"><span class="bar-fill" style="width:${pct}%"></span></span>
        <span class="u-mono" style="color:var(--color-text-muted);font-size:11px">${u.unreported ? "未上报" : "×" + u.mult}</span>
      </span>
    </div>`;
  }).join("");

  const table = `<div class="card" style="padding:8px">
    <div class="grid-row is-head usage-head">
      <span>Bot</span><span>运行时</span>
      <span class="usage-nums"><span>请求数</span><span>输入 token</span><span>输出 token</span></span>
      <span>占比 / 模式</span></div>
    ${rows}
    <div class="grid-row is-head usage-total" style="border-top:1px solid var(--color-border);background:var(--color-surface-2);border-radius:0 0 10px 10px;color:var(--color-text-secondary);min-height:48px">
      <span style="font-weight:var(--weight-bold);color:var(--color-text)">合计</span><span></span>
      <span class="usage-nums">
        <span class="cell-num" data-label="请求数" style="font-weight:var(--weight-bold);color:var(--color-text)">${sumReq}</span>
        <span class="cell-num" data-label="输入 token" style="font-weight:var(--weight-bold);color:var(--color-text)">${num(sumIn)}</span>
        <span class="cell-num" data-label="输出 token" style="font-weight:var(--weight-bold);color:var(--color-text)">${num(sumOut)}</span>
      </span>
      <span></span></div>
  </div>
  <p class="hint">headless 模式按 ×3 计费倍率标注；审查助手（ZCode）未上报 token，聚合时不估算，单列显示 —。</p>`;

  return shell("usage", [{ t: "用量", href: "/usage" }], head + chips + table);
}

const PROBE_ITEMS = [
  { id: "zcode", name: "ZCode", ver: "0.9.0", path: "/opt/zcode/bin/zcode", state: "ok" },
  { id: "codex", name: "Codex", ver: "0.48.1", path: "~/.local/bin/codex", state: "ok" },
  { id: "cc", name: "[CC]", ver: "3 秒无响应", path: "—", state: "timeout" },
  { id: "gemini", name: "Gemini CLI", ver: "0.14.2", path: "/usr/local/bin/gemini", state: "ok" },
  { id: "dsh", name: "DSH", ver: "PATH 中未找到可执行文件", path: "—", state: "missing" }
];

function viewSetup() {
  const st = S.setup;
  const stepNames = ["探测运行时", "创建 Bot", "发第一条消息"];
  const steps = stepNames.map((n, i) => {
    const idx = i + 1;
    const cls = st.step === idx ? "is-on" : st.step > idx ? "is-done" : "";
    return `<div class="setup-step ${cls}"><span class="n">${st.step > idx ? "✓" : idx}</span><span>${n}</span></div>` +
      (i < 2 ? '<span class="bar"></span>' : "");
  }).join("");

  let body = "";
  if (st.step === 1) {
    /* 四态（UX §4.1 /setup 行）：
       空   = 全部未安装 → 给安装指引，不阻断进入工作台
       加载 = 每行独立骨架（不整页转圈）
       正常 = 逐项出结果
       错误 = 探测本身失败（本地服务无响应）→ 顶部 banner + 重试，行保持骨架 */
    const demo = demoOf("setup");
    const probeState = (it) => {
      if (demo === "empty") return "missing";
      if (demo === "loading" || demo === "error") return "pending";
      return st.detected.indexOf(it.id) >= 0 ? it.state : "pending";
    };
    const rows = PROBE_ITEMS.map((it) => {
      const ps = probeState(it);
      if (ps === "pending") {
        return `<div class="probe-row" data-probe="${it.id}" aria-busy="true">
          <span class="sk" style="width:16px;height:16px;border-radius:99px"></span>
          <div style="flex:1"><div class="sk sk-line" style="width:100px"></div>
            <div class="probe-bar"><i style="width:${demo === "error" ? 0 : 30}%"></i></div></div>
          <span class="probe-state">检测中…</span></div>`;
      }
      const cls = ps === "ok" ? "is-ok" : ps === "timeout" ? "is-timeout" : "is-missing";
      const label = ps === "ok" ? "可用" : ps === "timeout" ? "检测超时" : "未安装";
      const icon = ps === "ok" ? stateIcon("done") : ps === "timeout" ? stateIcon("waiting") : stateIcon("blocked");
      return `<div class="probe-row" data-probe="${it.id}" style="animation:enter var(--duration-base) var(--ease-out) both">
        <span class="state state--${ps === "ok" ? "done" : ps === "timeout" ? "waiting" : "blocked"}" style="padding:0;width:22px;justify-content:center">${icon}</span>
        <div style="flex:1;min-width:0"><div class="nm">${esc(it.name)}</div><div class="sub">${esc(ps === "ok" ? it.ver + " · " + it.path : it.ver)}</div></div>
        <span class="probe-state ${cls}">${label}${ps === "ok" ? "" : ` <button class="btn btn--sm btn--ghost" data-act="probe-retry">重试</button>`}</span></div>`;
    }).join("");

    const errBanner = demo === "error"
      ? `<div class="banner"><span class="state-dot" style="--s:var(--state-blocked)"></span><span>探测失败：本地服务没有响应。已探测到的项不受影响，可以直接跳过向导稍后重试。</span><span class="spacer"></span><button class="btn btn--sm" data-act="demo-set" data-v="normal">重试</button></div>`
      : "";

    /* 空态：一台机器上一个都没装。不弹全屏错误，停在第一步给可复制的安装命令 + 手动添加出口 */
    const noneInstalled = demo === "empty";
    const emptyGuide = noneInstalled
      ? `<div class="empty" style="margin-top:16px;box-shadow:none;background:var(--color-surface-2)">
          <div class="empty-icon">${ICONS.gear}</div>
          <h3 style="font-size:var(--font-size-h3)">没有找到可用的 agent</h3>
          <p>这不是错误：PATH 里确实一个都没有。按下面任一命令装一个，或者先用「手动添加」给出启动命令；也可以直接跳过，先建 Bot，稍后在设置里补。</p>
          <pre class="u-mono" style="margin:16px 0;padding:12px 16px;background:var(--color-surface);border-radius:8px;color:var(--color-text-secondary);text-align:left;width:100%;max-width:420px">npm i -g @google/gemini-cli
npm i -g @openai/codex</pre>
          <div class="empty-actions">
            <button class="btn btn--sm btn--secondary" data-act="noop">复制命令</button>
            <button class="btn btn--sm btn--secondary" data-act="noop">手动添加</button>
            <button class="btn btn--sm btn--ghost" data-act="setup-skip">先跳过</button></div>
        </div>`
      : "";

    body = `<h1 class="setup-title">检测你机器上的 agent</h1>
      <p class="setup-sub">每项独立探测，3 秒超时互不阻塞。没有可用的也没关系，可以先跳过，稍后在设置里手动添加。</p>
      ${errBanner}
      ${demo === "loading" ? `<div class="probe-status" aria-live="polite">正在逐项检查…（每项独立 3s 超时）</div>` : ""}
      <div class="setup-card"${demo === "loading" ? ' aria-busy="true" data-probing="1"' : ""}>${rows}</div>
      ${emptyGuide}
      <div class="setup-foot"><button class="btn btn--ghost" data-act="setup-skip">跳过</button><span class="spacer"></span>
        <button class="btn btn--primary btn--lg" data-act="setup-next" ${(demo === "normal" && st.detected.length < 5) ? "disabled" : ""}>下一步</button></div>`;
  }

  if (st.step === 2) {
    const picks = RUNTIMES.filter((r) => r.status === "ready").map((r) => {
      const on = st.runtime === r.id;
      return `<div class="pick${on ? " is-on" : ""}" data-act="setup-runtime" data-id="${r.id}">
        <input type="radio" ${on ? "checked" : ""} name="rt" aria-label="${esc(r.name)}" style="accent-color:var(--color-primary)">
        <div style="flex:1;min-width:0">
          <div style="font-size:var(--font-size-body-sm);font-weight:var(--weight-semibold)">${esc(r.name)} <span class="u-mono u-muted">${esc(r.version)}</span></div>
          <div class="cap-row" style="margin-top:6px">${["plan", "permission", "resume"].map((c) => `<span style="display:flex;gap:4px;align-items:center"><span class="u-label" style="letter-spacing:0;font-size:10px">${c}</span>${capBadge(r.caps[c])}</span>`).join("")}</div>
        </div>
        <span class="rt-chip">${esc(r.protocol)}</span></div>`;
    }).join("");

    body = `<h1 class="setup-title">给你的第一个 Bot 起名</h1>
      <p class="setup-sub">Bot 是主角，运行时只是它当前绑定的机器。以后换运行时，人格和记忆都留着。</p>
      <div class="field"><label class="u-label" for="bot-name">名称</label>
        <input class="input" id="bot-name" value="${esc(st.name)}" maxlength="32" data-act="setup-name"
          aria-invalid="${st.nameErr ? "true" : "false"}" aria-describedby="bot-name-err">
        ${st.nameErr
          ? `<div class="field-err" id="bot-name-err" role="alert">${esc(st.nameErr)}</div>`
          : `<div class="hint" id="bot-name-err">1–32 个字符，工作区内唯一。</div>`}</div>
      <div class="field"><label class="u-label" for="bot-persona">人格</label>
        <textarea class="textarea" id="bot-persona" rows="3">用 Gemini 做竞品与论文调研，产出带出处的结论。不确定的地方直接说不确定。</textarea></div>
      <div class="field"><label class="u-label">执行位置</label><div class="radio-row">
        <label class="radio"><input type="radio" name="loc" checked> local · 当前目录</label>
        <label class="radio"><input type="radio" name="loc"> git worktree · 另开一份</label></div></div>
      <div class="field"><label class="u-label">默认运行时</label><div class="pick-list">${picks}</div>
        <div class="hint">能力值来自运行时上报。显示「未知」表示它没有声明，不代表不支持。</div></div>
      <div class="setup-foot"><button class="btn btn--secondary" data-act="setup-back">上一步</button><span class="spacer"></span>
        <button class="btn btn--primary btn--lg" data-act="setup-create">创建</button></div>`;
  }

  if (st.step === 3) {
    const b = { id: "b1", name: st.name, initial: st.name.slice(0, 1), color: 1, state: st.sent ? "working" : "idle", runtimeId: st.runtime };
    const rt = rtOf(st.runtime);
    body = `<h1 class="setup-title">发第一条消息</h1>
      <p class="setup-sub">${esc(st.name)} · ${esc(rt.name)} · local ~/projects/agentbot</p>
      <div class="setup-card" style="padding:16px 20px;min-height:220px" id="setup-stream">
        ${st.sent
          ? `<section class="turn" style="${botVars(b)}">
              <header class="turn-head" style="position:static">
                ${av(b, 24)}<span class="turn-name">${esc(st.name)}</span>
                <span class="rt-chip">${esc(rt.name)} · ${esc(rt.protocol)}</span>
                <span class="turn-right">${stateChip("working", "生成中")}<span class="turn-sum u-num" id="setup-dur">0.4s</span></span>
              </header>
              <div class="turn-body" style="padding-left:0">
                <div class="msg msg--bot" style="${botVars(b)}">
                  ${av(b, 32)}
                  <div class="msg-col"><div class="msg-name">${esc(st.name)}</div>
                    <div class="bubble bubble--bot" id="setup-text" style="min-height:48px"></div></div>
                </div>
              </div></section>`
          : `<div class="empty" style="box-shadow:none;padding:32px 0">
              <div class="empty-icon">${ICONS.chats}</div>
              <h3 style="font-size:var(--font-size-h3)">问点什么试试</h3>
              <p>比如：这个仓库的结构是什么样的？</p></div>`}
      </div>
      <div style="display:flex;gap:8px;margin-top:16px">
        <input class="input" id="setup-msg" placeholder="给 ${esc(st.name)} 发消息…" value="${st.sent ? "" : "先看看这个仓库的结构，用三句话说明"}">
        <button class="btn btn--primary btn--lg" data-act="setup-send" ${st.sent ? "disabled" : ""}>发送</button></div>
      <div class="setup-foot"><button class="btn btn--secondary" data-act="setup-back">上一步</button><span class="spacer"></span>
        <button class="btn btn--primary btn--lg" data-act="setup-finish" ${st.sent ? "" : "disabled"}>完成，进入工作台</button></div>`;
  }

  return `<div class="setup-wrap"><div class="setup-col enter" style="--i:0">
    <div class="setup-brand">
      <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <div><div class="brand-name">AgentBot</div><div class="brand-sub">首次启动 · 大约 60 秒</div></div>
      <span class="spacer"></span>
      <a class="btn btn--sm btn--ghost" href="#/bots">跳过向导</a>
    </div>
    <div class="setup-steps">${steps}</div>${body}</div></div>`;
}

function runProbe() {
  /* 演示面板切到空 / 加载 / 错误时，不跑真实探测，避免把演示态覆盖回正常 */
  if (demoOf("setup") !== "normal") return;
  PROBE_ITEMS.forEach((it, i) => {
    if (S.setup.detected.indexOf(it.id) >= 0) return;
    setTimeout(() => {
      if (S.setup.step !== 1) return;
      if (S.setup.detected.indexOf(it.id) >= 0) return;
      S.setup.detected.push(it.id);
      const el = document.querySelector('[data-probe="' + it.id + '"]');
      if (!el) { render(); return; }
      const cls = it.state === "ok" ? "is-ok" : it.state === "timeout" ? "is-timeout" : "is-missing";
      const label = it.state === "ok" ? "可用" : it.state === "timeout" ? "检测超时" : "未安装";
      const icon = it.state === "ok" ? stateIcon("done") : it.state === "timeout" ? stateIcon("waiting") : stateIcon("blocked");
      el.style.animation = "enter var(--duration-base) var(--ease-out) both";
      el.innerHTML = `<span class="state state--${it.state === "ok" ? "done" : it.state === "timeout" ? "waiting" : "blocked"}" style="padding:0;width:22px;justify-content:center">${icon}</span>
        <div style="flex:1;min-width:0"><div class="nm">${esc(it.name)}</div><div class="sub">${esc(it.state === "ok" ? it.ver + " · " + it.path : it.ver)}</div></div>
        <span class="probe-state ${cls}">${label}${it.state === "ok" ? "" : ` <button class="btn btn--sm btn--ghost" data-act="probe-retry">重试</button>`}</span>`;
      if (S.setup.detected.length === PROBE_ITEMS.length) {
        const btn = document.querySelector('[data-act="setup-next"]');
        if (btn) btn.disabled = false;
      }
    }, 420 + i * 460);
  });
}

/* =========================================================================
   16. 渲染
   ========================================================================= */
function parts() {
  const h = location.hash.replace(/^#/, "") || "/bots";
  return h.split("/").filter(Boolean);
}
function go(path) { location.hash = "#" + path; }
window.addEventListener("hashchange", () => { closeModal(); render(); });

function render() {
  const p = parts();
  const key = routeKey(p);
  let html = "";
  if (key === "setup") html = viewSetup();
  else if (key === "bots") html = viewBots();
  else if (key === "bot") html = viewBot(p[1]);
  else if (key === "chats") html = viewChats();
  else if (key === "chat") html = viewChat(p[1]);
  else if (key === "assignments") html = viewAssignments();
  else if (key === "assignment") html = viewAssignment(p[1]);
  else if (key === "schedules") html = viewSchedules();
  else if (key === "usage") html = viewUsage();
  else if (key === "settings") html = viewSettings();
  else html = viewBots();

  $("#app").innerHTML = html;
  renderDemo();
  document.documentElement.dataset.theme = S.theme;
  document.body.classList.toggle("is-chat", key === "chat");
  document.body.classList.toggle("demo-open", !!S.demoOpen);

  if (key === "setup" && S.setup.step === 1 && !S.setup.probeStarted) {
    S.setup.probeStarted = true;
    runProbe();
  }
  if (key === "setup" && S.setup.step === 3 && S.setup.sent && !S.setup.typed) {
    S.setup.typed = true;
    runSetupStream();
  }
  if (key === "chat") {
    attachChat();
    scrollStream();
    startCountdowns();
  }
}

function scrollStream() {
  const el = $("#stream");
  if (el) el.scrollTop = el.scrollHeight;
}

/* =========================================================================
   17. 演示控制
   ========================================================================= */
function renderDemo() {
  const root = $("#demo-root");
  const key = routeKey(parts());
  document.body.classList.toggle("demo-open", !!S.demoOpen);
  const states = [["normal", "正常"], ["empty", "空"], ["loading", "加载"], ["error", "错误"]];
  const cur = demoOf(key);
  const stateBtns = states.map(([k, l]) =>
    `<button class="chip${cur === k ? " is-on" : ""}" data-act="demo-set" data-v="${k}">${l}</button>`).join("");

  let extra = "";
  if (key === "chat") {
    extra = `<div class="demo-line"><span class="u-label">注入权限卡片</span>
        <button class="chip" data-act="inject-perm" data-v="block">阻断型 · 120s</button>
        <button class="chip" data-act="inject-perm" data-v="hold">挂起型</button>
        <button class="chip" data-act="inject-perm" data-v="boundary">边界拒绝</button>
        <button class="chip" data-act="inject-perm" data-v="invalid">已失效</button></div>
