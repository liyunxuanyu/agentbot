/* =========================================================================
   18. 会话交互
   ========================================================================= */
function attachChat() {
  const input = $("#composer-input");
  if (input) {
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); handleSend(); }
    });
    input.addEventListener("input", () => {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 160) + "px";
    });
  }
  const stream = $("#stream");
  if (stream) {
    /* 吸顶判定：Turn 头贴在流容器顶边即视为吸顶（Turn 自身不动，只有头会吸住） */
    const markStuck = () => {
      const sTop = stream.getBoundingClientRect().top;
      $$(".turn", stream).forEach((t) => {
        const head = $(".turn-head", t);
        if (!head) return;
        const hr = head.getBoundingClientRect();
        t.classList.toggle("is-stuck", hr.top <= sTop + 1 && hr.bottom > sTop + 8);
      });
    };
    stream.addEventListener("scroll", markStuck, { passive: true });
    window.addEventListener("resize", markStuck, { passive: true });
    markStuck();
  }
}

function currentChannel() { return chanOf(parts()[1]) || chanOf("g1"); }

function appendToStream(html) {
  const inner = $("#stream-inner");
  if (!inner) return null;
  const tmp = document.createElement("div");
  tmp.innerHTML = html;
  const node = tmp.firstElementChild;
  inner.appendChild(node);
  scrollStream();
  return node;
}

function setSending(on) {
  const b = $("#send-btn");
  if (!b) return;
  b.innerHTML = on ? ICONS.stop : ICONS.send;
  b.classList.toggle("is-stop", on);
  b.dataset.act = on ? "stop-stream" : "send";
  b.setAttribute("aria-label", on ? "停止" : "发送");
}

function handleSend() {
  const input = $("#composer-input");
  if (!input || input.disabled) return;
  if (S.activePerm) { toast("等待你批准，无法继续发送"); return; }
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  input.style.height = "auto";
  const c = currentChannel();
  const now = new Date();
  const at = String(now.getHours()).padStart(2, "0") + ":" + String(now.getMinutes()).padStart(2, "0");

  pushItem(c.id, { k: "user", text, at });
  appendToStream(userMsgHtml(text, at));
  setSending(true);
  if (c.type === "group") runGroupRound(c, text);
  else runDmReply(c, text);
}

function pushItem(chId, item) {
  if (!S.streams[chId]) S.streams[chId] = [];
  S.streams[chId].push(item);
}

function appendTurnEl(t) {
  const el = appendToStream(turnHtml(t));
  return el;
}

function finishTurn(el, summary, keepOpen) {
  if (!el) return;
  if (!keepOpen) {
    el.classList.add("is-collapsed");
    const head = $(".turn-head", el);
    if (head) head.setAttribute("aria-expanded", "false");
  }
  const right = $(".turn-right", el);
  if (right) right.innerHTML = stateChip("done", "完成") + `<span class="turn-sum">${esc(summary)}</span><span class="turn-chev">${keepOpen ? "⌄" : "›"}</span>`;
}

/* 流式追加文本。
   gen 是这一轮的代号：stopRun() 之后 gen 前进，本函数的下一次 tick 发现失效就
   清掉定时器、移除光标并 return —— 不写文本、不调 done()。
   返回的 handle 让调用方也能主动取消（例如整轮被替换）。 */
function streamText(el, text, cursor, done, gen) {
  const g = gen == null ? S.run.gen : gen;
  if (reduced()) {
    if (!isRun(g)) { if (cursor && cursor.parentNode) cursor.remove(); return; }
    el.textContent = text;
    if (cursor && cursor.parentNode) cursor.remove();
    done && done();
    return;
  }
  let i = 0;
  const timer = setInterval(() => {
    if (!isRun(g)) {
      clearInterval(timer);
      if (cursor && cursor.parentNode) cursor.remove();
      return;
    }
    i += 2;
    if (!el.isConnected) { clearInterval(timer); return; }
    el.textContent = text.slice(0, i);
    el.appendChild(cursor);
    scrollStream();
    if (i >= text.length) {
      clearInterval(timer);
      el.textContent = text;
      if (cursor.parentNode) cursor.remove();
      done && done();
    }
  }, 34);
  S.run.timers.push(timer);
  return timer;
}

function runDmReply(c, text) {
  collapseAllTurns();
  const gen = newRun();
  const bot = botOf(c.botId);
  const rt = rtOf(bot.runtimeId);
  const streaming = rt.streaming !== false;
  const turnItem = { k: "turn", id: "t" + Date.now(), botId: bot.id, runtimeId: bot.runtimeId,
    mode: streaming ? "交互" : "非流式", status: "streaming", dur: "0.6s", expanded: true,
    events: streaming ? [{ type: "message", text: "", streaming: true }] : [] };
  pushItem(c.id, turnItem);
  const turn = appendTurnEl(turnItem);
  const body = $(".turn-body", turn);

  const reply = "收到。我先看一下这个仓库里与「" + text.slice(0, 10) + "」相关的部分：Session 的续接状态记在 Session 表里，重建上下文时按记忆更新时间倒序取最近 20 条。结论是现有实现能跑通，但重建路径缺一个跨运行时的回放测试，建议在合并前补上。";

  /* 非流式运行时（§6.1）：完全不渲染光标 —— 光标意味着「token 正在到达」，
     一次返回的运行时没有这个过程，画一个假光标就是骗人。
     改为一条 info 提示 + 已等待时长。 */
  if (!streaming) {
    body.insertAdjacentHTML("beforeend",
      `<div class="banner banner--info" style="margin:0">${esc(rt.name)} 一次返回完整结果，期间不会显示中间过程。预计 30–60s。</div>
       <div class="wait-line">等待运行时返回 · 已 <span class="u-num" data-wait>0s</span></div>`);
    let sec = 0;
    const tick = trackInterval(gen, () => {
      sec++;
      /* 只写 data-tick 锚点；finishTurn 之后锚点已不存在，秒表自然失效 */
      const d = $("[data-tick]", turn);
      if (d) d.textContent = sec + "s";
      const w = $("[data-wait]", turn);
      if (w) w.textContent = sec + "s";
    }, 1000);
    trackTimeout(gen, () => {
      if (!isRun(gen)) return;
      untrack(tick);
      const waitLine = $(".wait-line", turn);
      if (waitLine) waitLine.remove();
      body.insertAdjacentHTML("beforeend", msgHtml(bot, reply, { tools: true, id: turnItem.id + "-m0" }));
      body.insertAdjacentHTML("beforeend", evHtml({ type: "usage", in: 842, out: 214, mode: "交互", mult: 1 }, bot, turnItem.id + "-u"));
      body.insertAdjacentHTML("beforeend", evHtml({ type: "end", label: "完成", dur: sec + "s" }, bot, turnItem.id + "-e"));
      turnItem.status = "done"; turnItem.dur = sec + "s"; turnItem.summary = "完成 · 842/214";
      turnItem.events = [{ type: "message", text: reply }];
      finishTurn(turn, "完成 · 842/214", true);
      setSending(false);
      scrollStream();
    }, 4200);
    return;
  }

  const target = $(".bubble", body);
  const cursor = document.createElement("span");
  cursor.className = "cursor-stream";
  target.appendChild(cursor);

  let sec = 0;
  const tick = trackInterval(gen, () => { sec++; const d = $("[data-tick]", turn); if (d) d.textContent = sec + "s"; }, 1000);

  streamText(target, reply, cursor, () => {
    if (!isRun(gen)) return;
    untrack(tick);
    turnItem.status = "done"; turnItem.dur = sec + "s"; turnItem.summary = "完成 · 842/214";
    turnItem.events = [{ type: "message", text: reply }];
    body.insertAdjacentHTML("beforeend", evHtml({ type: "usage", in: 842, out: 214, mode: "交互", mult: 1 }, bot, turnItem.id + "-u"));
    body.insertAdjacentHTML("beforeend", evHtml({ type: "end", label: "完成", dur: sec + "s" }, bot, turnItem.id + "-e"));
    finishTurn(turn, "完成 · 842/214", true);
    setSending(false);
  }, gen);
}

/* §8.2 单展开：新的一轮开始时，先前展开的 Turn 收成折叠行 */
function collapseAllTurns() {
  $$("#stream-inner .turn").forEach((t) => {
    if (t.classList.contains("is-collapsed")) return;
    t.classList.add("is-collapsed");
    const head = $(".turn-head", t);
    if (head) head.setAttribute("aria-expanded", "false");
    const chev = $(".turn-chev", t);
    if (chev) chev.textContent = "›";
    const cursor = $(".cursor-stream", t);
    if (cursor) cursor.remove();
  });
  $$("#stream-inner .act-row").forEach((r) => r.remove());
  /* 数据同步：上一轮的活动行不再参与渲染 */
  const arr = S.streams[S.activeChannel];
  if (arr) S.streams[S.activeChannel] = arr.filter((x) => x.k !== "act");
}

/* F2：群聊一轮 */
let groupRunning = false;
function runGroupRound(c, userText) {
  if (groupRunning) { toast("上一轮还在跑，等它结束"); return; }
  groupRunning = true;
  collapseAllTurns();
  const gen = newRun();

  const host = botOf(c.host);
  const others = c.participants.filter((p) => p !== c.host).map(botOf);
  const speakers = others.slice(0, 2);

  const hostTurn = appendToStream(`<section class="turn" data-turn="host" style="${botVars(host)}">
    <header class="turn-head" style="position:static">${av(host, 24)}
      <span class="turn-name">${esc(host.name)}</span>
      <span class="rt-chip">${esc(rtOf(host.runtimeId).name)} · 交互</span>
      <span class="turn-right">${stateChip("thinking", "正在决定发言人")}</span></header>
    <div class="turn-body"><div class="ev-row" style="cursor:default;background:transparent;color:var(--color-text-muted)">
      <span>${esc(host.name)} 正在看这轮该由谁来答…</span></div></div></section>`);

  trackTimeout(gen, () => {
    if (!isRun(gen)) return;
    if (!hostTurn.isConnected) { groupRunning = false; return; }
    hostTurn.remove();
    const sys = { k: "sys", tag: "本轮发言人", title: host.name + "把问题分给了两个人，理由如下。",
      items: speakers.map((b) => ({ name: b.name, reason: b.id === "b1" ? "问题涉及竞品与排期，需要外部信息" : "问题涉及实现风险，需要读代码" })),
      /* UX §5.1-5 / UI §7：块尾固定「本轮调用 2/3」。分母是本轮主持人可点名的上限 3，
         分子是实际点名数；写成「2 · 上限 3」读起来像两个并列指标，扫读时抓不到「用了 2 个额度」。 */
      foot: `本轮调用 ${speakers.length}/3 · 未被点名的 Bot 产生 0 次运行时调用` };
    pushItem(c.id, sys);
    appendToStream(sysHtml(sys));
    trackTimeout(gen, () => { if (isRun(gen)) runSpeaker(speakers, 0, c, gen); }, 500);
  }, 1500);
}

function runSpeaker(speakers, idx, c, gen) {
  if (!isRun(gen)) return;
  if (idx >= speakers.length) {
    const total = speakers.length * 1592;
    const fence = { k: "fence", bots: speakers.map((b) => b.id), tokens: total };
    pushItem(c.id, fence);
    appendToStream(fenceHtml(fence));
    const summary = { k: "sys", tag: "本轮小结",
      title: "研究助手给出三条外部风险，实现助手补了两处代码问题，两者不冲突。",
      items: [], foot: `总用量 ${num(total)} token · 未发言：审查助手（本轮不需要读 diff）` };
    pushItem(c.id, summary);
    appendToStream(sysHtml(summary));
    groupRunning = false;
    setSending(false);
    toast("本轮完成 · 2 个 Bot 发言");
    return;
  }

  const bot = speakers[idx];
  const rt = rtOf(bot.runtimeId);
  const streaming = rt.streaming !== false;
  const texts = {
    b1: "这版发布计划有三处风险。第一，权限卡片在 hold 策略下的 24h 上限没有对应的服务重启清理逻辑，重启后挂起的请求会变成孤儿。第二，群聊主持人的发言人名单上限是 3，但 @ 多个 Bot 时的并行分支没有测过。第三，用量页的未上报单列在筛选后仍然计入合计，会让成本看起来比实际低。",
    b2: "我看了一遍 diff。第一处：session.ts 里重建上下文时没有把记忆条目按更新时间排序，注入顺序依赖数据库返回顺序。第二处：permission 的 24h 清理只在启动时跑一次，长跑进程里不会触发，建议加一个每小时触发的清理。测试方面，现有 12 个用例里有 2 个依赖时序，连跑 3 次会挂 1 次。",
    b3: "只读审查：两处改动都没有越界。风险集中在「重建上下文」这条路径，建议在合并前补一个跨运行时的回放测试。"
  };

  const item = { k: "turn", id: "t" + Date.now() + "-" + idx, botId: bot.id, runtimeId: bot.runtimeId,
    mode: streaming ? "交互" : "非流式", status: "streaming", dur: "0s", expanded: true,
    events: streaming ? [{ type: "message", text: "", streaming: true }] : [] };
  pushItem(c.id, item);

  const turn = appendTurnEl(item);
  const body = $(".turn-body", turn);
  const target = streaming ? $(".bubble", body) : null;
  const cursor = document.createElement("span");
  cursor.className = "cursor-stream";
  if (streaming && target) target.appendChild(cursor);

  /* §8.2 单展开：正在说话的 Bot 展开流式；其余在跑的 Bot 折叠为 40px 活动行，点击接管 */
  const actEls = [];
  speakers.slice(idx + 1).forEach((nb) => {
    const what = nb.id === "b2" ? "npm test" : "Read src/session.ts";
    const el = appendToStream(actRowHtml({ botId: nb.id, what, dur: "0s", pct: 6 }));
    if (el) actEls.push({ el, what });
  });

  let sec = 0;
  const tick = trackInterval(gen, () => {
    sec++;
    const d = $("[data-tick]", turn);
    if (d) d.textContent = sec + "s";
    const w = $("[data-wait]", turn);
    if (w) w.textContent = sec + "s";
    actEls.forEach(({ el }) => {
      if (!el.isConnected) return;
      const dd = $("[data-act-dur]", el);
      if (dd) dd.textContent = sec + "s";
      const bar = $(".act-bar i", el);
      if (bar) bar.style.width = Math.min(94, 6 + sec * 7) + "%";
    });
  }, 1000);

  const full = texts[bot.id] || "这一轮我看了一下上下文，结论是：现有方案可行，但需要在合并前补一个跨运行时的回放测试。";

  const finish = () => {
    if (!isRun(gen)) return;
    untrack(tick);
    actEls.forEach(({ el }) => { if (el.isConnected) el.remove(); });
    if (streaming) {
      body.insertAdjacentHTML("beforeend", evHtml({ type: "tool_call", callId: "c-live-1", name: "Read", target: bot.id === "b2" ? "src/session.ts" : "docs/plan.md" }, bot, item.id + "-t"));
      body.insertAdjacentHTML("beforeend", evHtml({ type: "tool_result", callId: "c-live-1", ok: true, summary: "成功 · 31 行输出" }, bot, item.id + "-r"));
    }
    body.insertAdjacentHTML("beforeend", evHtml({ type: "usage", in: 1204, out: 388, mode: "交互", mult: 1 }, bot, item.id + "-u"));
    body.insertAdjacentHTML("beforeend", evHtml({ type: "end", label: "完成", dur: sec + "s" }, bot, item.id + "-e"));
    item.status = "done"; item.dur = sec + "s"; item.summary = "完成 · 1.2k/0.4k";
    item.events = [{ type: "message", text: full }];
    finishTurn(turn, "完成 · 1.2k/0.4k", idx === speakers.length - 1);
    trackTimeout(gen, () => { if (isRun(gen)) runSpeaker(speakers, idx + 1, c, gen); }, 700);
  };

  if (!streaming) {
    /* 群聊里的非流式 Bot 同样不给假光标：提示条 + 等待时长，到点整段出现 */
    body.insertAdjacentHTML("beforeend",
      `<div class="banner banner--info" style="margin:0">${esc(rt.name)} 一次返回完整结果，期间不会显示中间过程。预计 30–60s。</div>
       <div class="wait-line">等待运行时返回 · 已 <span class="u-num" data-wait>0s</span></div>`);
    trackTimeout(gen, () => {
      if (!isRun(gen)) return;
      const waitLine = $(".wait-line", turn);
      if (waitLine) waitLine.remove();
      body.insertAdjacentHTML("beforeend", msgHtml(bot, full, { tools: true, id: item.id + "-m0" }));
      finish();
      scrollStream();
    }, 3600);
    return;
  }

  streamText(target, full, cursor, finish, gen);
}

/* F4：权限卡片 */
function lastTurnBot() {
  const turns = document.querySelectorAll("#stream-inner .turn[data-bot]");
  if (!turns.length) {
    const c = currentChannel();
    return c ? botOf(c.participants ? c.participants[0] : c.botId) : botOf("b1");
  }
  return botOf(turns[turns.length - 1].dataset.bot);
}

function injectPermission(kind) {
  const chId = (parts()[1] || "g1");
  S.permSeq++;
  const no = "P-" + String(S.permSeq).padStart(4, "0");
  const bot = lastTurnBot();
  const rt = rtOf(bot.runtimeId);
  const suffix = kind === "hold" ? " · Assignment A-0141" : " · 第 3 轮";
  const source = bot.name + " · " + rt.name + suffix;
  const ev = kind === "boundary"
    ? { type: "permission", no, kind: "boundary", action: "写文件 · Write", target: "/etc/hosts", source }
    : kind === "hold"
      ? { type: "permission", no, kind: "hold", action: "执行命令 · Bash", target: "npm run build && npm test", source, heldFor: "1h 20m" }
      : kind === "invalid"
        ? { type: "permission", no, kind: "invalid", action: "执行命令 · Bash", target: "rm -rf .release/tmp", source }
        : { type: "permission", no, kind: "block", action: "写文件 · Write", target: "~/projects/agentbot/src/auth/session.ts", source };

  /* 归属：权限请求以该 Bot 的独立 Turn 呈现，来源与 Turn 的 Bot 一致 */
  const turns = document.querySelectorAll("#stream-inner .turn[data-bot]");
  const lastTurn = turns[turns.length - 1];
  const pendingTurn = {
    k: "turn", id: "t-perm-" + no,
    botId: bot.id, runtimeId: bot.runtimeId,
    mode: rt.streaming ? "交互" : "非流式",
    status: "waiting", expanded: true, summary: "",
    stateKey: kind === "block" || kind === "boundary" ? "blocked" : kind === "invalid" ? "idle" : "waiting",
    statusLabel: kind === "block" ? "等待批准" : kind === "hold" ? "挂起中" : kind === "boundary" ? "边界拒绝" : "已失效",
    permKind: kind,
    events: [ev]
  };
  /* 权限请求是「此刻发生的事」：作为该 Bot 的一个新 Turn 追加到流尾。
     写进数据再渲染，切主题 / 重渲染后卡片不会消失（否则输入框锁着但卡片没了）。 */
  const pendingHtml = turnHtml(pendingTurn);
  if (S.streams[S.activeChannel]) {
    pushItem(S.activeChannel, pendingTurn);
    const inner = $("#stream-inner");
    if (inner) inner.insertAdjacentHTML("beforeend", pendingHtml);
    else appendToStream(pendingHtml);
  } else {
    appendToStream(pendingHtml);
  }
  void lastTurn;

  if (kind === "block") {
    S.activePerm = { no, botId: bot.id, action: ev.action, target: ev.target };
    S.permSec = 118;
    lockComposer(true);
    startCountdowns();
  }
  if (kind === "hold") toast("挂起型：输入框不锁，Session 保持等待");
  if (kind === "boundary") toast("边界拒绝：请求没有转发给运行时");
  if (kind === "invalid") toast("运行时已退出，这个请求失效了");
  scrollStream();
  void chId;
}

/* 点击活动行 → 接管：把该 Bot 从 40px 活动行提升为展开的流式 Turn */

  const target = $(".bubble", body);
  const cursor = document.createElement("span");
  cursor.className = "cursor-stream";
  target.appendChild(cursor);
  let sec = 0;
  trackInterval(gen, () => { sec++; const d = $(".turn-right .turn-sum", turn); if (d) d.textContent = sec + "s"; }, 1000);
  const full = what === "npm test"
    ? "接手这一轮。测试跑完 24 个用例，其中 2 个依赖时序，连跑 3 次会挂 1 次。建议先把这两个用例的等待改成轮询。"
    : "接手这一轮。diff 读完了，风险集中在「重建上下文」这条路径：注入顺序依赖数据库返回顺序，没有按更新时间排序。";
  streamText(target, full, cursor, () => {
    if (!isRun(gen)) return;
    item.status = "done"; item.dur = sec + "s"; item.summary = "完成 · " + sec + "s";
    item.events = [{ type: "message", text: full }];
    finishTurn(turn, "完成 · " + sec + "s", true);
    setSending(false);
    toast("已接管 " + b.name + " 的这一轮");
  }, gen);
}

function decidePerm(no, decision) {
  const card = document.querySelector('[data-perm="' + no + '"]');
  const label = { approve: "已批准 · 你", reject: "已拒绝 · 你", remember: "已批准（记住本会话）· 你", forever: "已批准（本 Bot 永久）· 你" }[decision];
  const at = new Date();
  const time = String(at.getHours()).padStart(2, "0") + ":" + String(at.getMinutes()).padStart(2, "0");
  if (!card && !S.activePerm) return;
  const action = card ? (($(".perm-field .v", card) || {}).textContent || "").trim() : (S.activePerm ? S.activePerm.action : "");
  const target = card ? (($(".perm-field code", card) || {}).textContent || "") : (S.activePerm ? S.activePerm.target : "");
  const bot = card ? botOf(card.closest(".turn").dataset.bot) : botOf(S.activePerm.botId);
  const turnEl = card ? card.closest(".turn") : null;

  const html = permCardHtml({ type: "permission", no, state: "decided", decision: label, at: time, action: "已决 · " + action, target }, bot);
  if (card) {
    const wrap = document.createElement("div");
    wrap.innerHTML = html;
    card.closest(".ev").replaceWith(wrap.firstElementChild);
  }
  if (turnEl) {
    turnEl.classList.remove("turn--perm-block");
    turnEl.classList.add("is-collapsed");
    const head = $(".turn-head", turnEl);
    if (head) head.setAttribute("aria-expanded", "false");
    const right = $(".turn-right", turnEl);
    if (right) {
      right.innerHTML = (decision === "reject" ? stateChip("blocked", "已拒绝") : stateChip("done", "已处理")) +
        '<span class="turn-sum">权限请求</span><span class="turn-chev">›</span>';
    }
  }
  S.auditLog.push({ no, decision, at: time });

  /* 写回数据：切主题/重渲染后保持已决态，不会复活待批卡 */
  const arr = S.streams[S.activeChannel] || [];
  const rec = arr.find((x) => x.k === "turn" && x.events && x.events[0] && x.events[0].no === no);
  if (rec) {
    rec.status = "done";
    rec.expanded = false;
    rec.summary = "权限请求";
    rec.stateKey = decision === "reject" ? "blocked" : "done";
    rec.statusLabel = decision === "reject" ? "已拒绝" : "已处理";
    delete rec.permKind;
    rec.events = [{ type: "permission", no, state: "decided", decision: label, action: "已决 · " + action, target }];
  }

  if (S.activePerm && S.activePerm.no === no) {
    S.activePerm = null;
    lockComposer(false);
  }
  toast("决定已回传运行时 · " + label);
}

let countdownTimer = null;
function startCountdowns() {
  $$(".perm-countdown").forEach((el) => { el.dataset.started = "1"; });
  if (countdownTimer) clearInterval(countdownTimer);
  countdownTimer = setInterval(() => {
    const els = $$(".perm-countdown");
    if (!els.length) { clearInterval(countdownTimer); countdownTimer = null; return; }
    S.permSec--;
    els.forEach((el) => {
      el.textContent = Math.max(0, S.permSec) + "s";
      if (S.permSec <= 15) el.classList.add("is-urgent");
    });
    if (S.permSec <= 0 && S.activePerm) {
      const no = S.activePerm.no;
      clearInterval(countdownTimer); countdownTimer = null;
      decidePerm(no, "reject");
      toast("超时自动拒绝 · " + no);
    }
  }, 1000);
}

      wrap.insertAdjacentHTML("beforeend", evHtml({ type: "end", label: "完成", dur: "3.6s" }, botOf("b1"), "setup-e"));

/* F3：任务卡状态流转。
   状态推进写在数据层（S.assignments），DOM 只是渲染结果。
   之前的写法在 setTimeout 首行 `if (!wrap.isConnected) return;`，用户一切走页面，
   后续所有状态转移就永久丢掉 —— 切回来卡片永远停在「已排队 · 0s」。
   现在推进不受 DOM 影响，重新进入会话时按已经过的时间直接渲染最新态，
   并给出「期间发生了什么」（事件数 + 最后活动时间），不补播动画。 */
function runAssignmentCard(botId, title, opts) {
  opts = opts || {};
  const b = botOf(botId);
  const seq = 144 + Math.floor(Math.random() * 5);
  const no = "A-" + String(seq).padStart(4, "0");
  const assignmentId = "a-" + String(seq).padStart(4, "0");
  const chId = opts.channelId || S.activeChannel || "g1";
  const startedAt = Date.now();
  const newAssignment = {
    id: assignmentId, no, title, botId, runtimeId: b.runtimeId, status: "queued",
    channelId: chId, started: "刚刚", dur: "—", usage: { in: null, out: null },
    deliverable: "一段可直接贴进周报的结论，附每条结论的出处。", summary: [], files: [], events: [],
    startedAt, lastEventAt: startedAt, eventCount: 0
  };
  S.assignments.unshift(newAssignment);
  const item = { k: "task", no, title, botId, status: "queued", dur: "0s", assignmentId, usage: null,
    startedAt, lastEventAt: startedAt, eventCount: 0 };
  pushItem(chId, item);

  /* 数据变了就刷新周边 UI：
     - 停在 /assignments 时，列表行状态必须跟着动（否则「排队中」永远不变，用户会以为卡死）；
     - 停在本会话时，顶部提示条要跟着任务的开始 / 结束出现与消失。 */
  const refreshListIfVisible = () => {
    const p = parts();
    if (p[0] === "assignments") { render(); return; }
    if (p[0] === "chat" && p[1] === chId) {
      const old = $(".task-tipbar");
      const html = taskTipbarHtml(chId);
      if (old) {
        if (html) old.outerHTML = html;
        else old.remove();
      } else if (html) {
        const anchor = $(".chat-main > .stream");
        if (anchor) anchor.insertAdjacentHTML("beforebegin", html);
      }
    }
  };

  /* DOM 渲染只在当前会话在场时发生；不在场就只更新数据 */
  const wrap = (S.activeChannel === chId && $("#stream-inner")) ? appendToStream(taskHtml(item)) : null;
  scrollStream();
  refreshListIfVisible();   /* 提示条立刻出现，不等下一次状态推进 */

  /* 数据层推进器：只改对象，不碰 DOM。定时器不因 DOM 断开而中止。 */
  setTimeout(() => {
    newAssignment.status = "running";
    newAssignment.started = "刚刚";
    newAssignment.dur = "12s";
    newAssignment.eventCount = 3;
    newAssignment.lastEventAt = Date.now();
    item.status = "running"; item.dur = "12s";
    item.eventCount = 3; item.lastEventAt = newAssignment.lastEventAt;
    if (wrap && wrap.isConnected) {
      const st = $(".task-status", wrap);
      if (st) st.innerHTML = stateChip("working", "执行中 · " + b.name + " · 12s · 正在读 docs/plan.md");
    }
    refreshListIfVisible();
  }, 1600);

  setTimeout(() => {
    newAssignment.status = "done";
    newAssignment.dur = "1m 12s";
    newAssignment.usage = { in: 1204, out: 388 };
    newAssignment.summary = [
      "三处风险已按影响面排序，第一条会推迟发布一天。",
      "涉及 2 个文件的改动建议，未直接修改。"
    ];
    newAssignment.events = [
      { type: "thinking", dur: "41s", chars: 318 },
      { type: "message", text: "三处风险已按影响面排序，第一条会推迟发布一天。" },
      { type: "usage", in: 1204, out: 388, mode: "交互", mult: 1 },
      { type: "end", label: "完成", dur: "1m 12s" }
    ];
    newAssignment.eventCount = 12;
    newAssignment.lastEventAt = Date.now();
    item.status = "done"; item.dur = "1m 12s"; item.usage = newAssignment.usage;
    item.eventCount = 12; item.lastEventAt = newAssignment.lastEventAt;
    if (wrap && wrap.isConnected) {
      const st = $(".task-status", wrap);
      if (st) st.innerHTML = stateChip("done", "已完成 · " + b.name + " · 1m 12s");
      const usage = $(".usage-line", wrap);
      if (usage) usage.textContent = "1,204 in / 388 out · 交互 ×1";
      const rep = $("[data-report]", wrap);
      if (rep) rep.hidden = false;
      const note = $(".task-note", wrap);
      if (note) note.remove();
      /* 卡片是在排队态渲染的，没有「期间发生了什么」行；完成时补上，
         否则只有重渲染（切主题 / 离开再回来）才看得到事件数。 */
      if (!$(".task-away", wrap)) {
        const statusEl = $(".task-status", wrap);
        if (statusEl) statusEl.insertAdjacentHTML("afterend", awayHtml(item));
      }
      toast("任务完成 · 报告已回贴");
      scrollStream();
    }
    /* 不在该会话时只更新列表与会话行，不弹全局弹窗（UX §6.1） */
    refreshListIfVisible();
  }, 5200);
}

/* 重发（PRD P0-04）：以上一条用户消息原文新建一轮，原轮次不覆盖。
   之前的「重发」是 data-act="noop"，点了只弹提示 —— 这是 P0 明确要求的动作。 */
function resendLast(c) {
  const arr = S.streams[c.id] || [];
  let text = "";
  for (let i = arr.length - 1; i >= 0; i--) {
    if (arr[i].k === "user") { text = arr[i].text; break; }
  }
  if (!text) { toast("这个会话里还没有可重发的用户消息"); return; }
  const now = new Date();
  const at = String(now.getHours()).padStart(2, "0") + ":" + String(now.getMinutes()).padStart(2, "0");
  pushItem(c.id, { k: "user", text, at });
  appendToStream(userMsgHtml(text, at));
  setSending(true);
  if (c.type === "group") runGroupRound(c, text);
  else runDmReply(c, text);
  toast("已按上一条消息原文重发");
}

const SCHED_TRIG = {
  daily: { label: "每日 HH:MM", control: "time", hint: "每天这个时刻触发一次" },
  every: { label: "每 N 分钟", control: "minutes", hint: "周期任务，最小间隔 5 分钟" },
  delay: { label: "延迟 N 分钟", control: "delay", hint: "只触发一次；保存后按延迟时间排队" }
};

function schedTriggerControl(mode) {
  if (mode === "daily") {
    return `<input class="input" id="sc-time" type="time" value="09:00" style="max-width:160px" aria-label="触发时刻">`;
  }
  const isEvery = mode === "every";
  return `<div style="display:flex;align-items:center;gap:8px;max-width:220px">
      <input class="input" id="sc-mins" type="number" min="1" max="1440" value="${isEvery ? "30" : "10"}"
        inputmode="numeric" aria-label="${isEvery ? "间隔分钟数" : "延迟分钟数"}">
      <span class="u-muted" style="font-size:var(--font-size-caption);white-space:nowrap">分钟</span>
    </div>`;
}

       ${S.bots.filter((b) => rtOf(b.runtimeId).status === "ready").map((b) => `<option value="${b.id}">${esc(b.name)}</option>`).join("")}</select></div>
     <div class="field"><label class="u-label" for="sc-channel">目标会话</label><select class="select" id="sc-channel">
       ${S.channels.map((c) => `<option value="${c.id}">${esc(c.name)}</option>`).join("")}</select></div>
     <div class="field"><label class="u-label" for="sc-body">任务内容</label><textarea class="textarea" id="sc-body" rows="2">抓一次三家竞品的更新，按「变化 / 影响 / 建议」三段输出。</textarea></div>
     <div class="field"><label class="u-label">触发方式</label>
       <div class="radio-row" role="radiogroup" aria-label="触发方式">
         ${Object.entries(SCHED_TRIG).map(([k, v]) => `<label class="radio"><input type="radio" name="sc-trig" value="${k}" ${k === mode ? "checked" : ""} data-act="sc-trig"> ${v.label}</label>`).join("")}
       </div>
       <div id="sc-trig-fields" style="margin-top:12px">${schedTriggerControl(mode)}</div>
       <div class="hint" id="sc-trig-hint">${SCHED_TRIG[mode].hint}</div>
       <div class="field-err" id="sc-err" role="alert" hidden></div></div>`,
    `<button class="btn btn--secondary" data-act="close-modal">取消</button><span class="spacer"></span>
     <button class="btn btn--primary" data-act="create-schedule">保存</button>`));
}

function updateSchedTriggerFields() {
  const mode = (document.querySelector('input[name="sc-trig"]:checked') || {}).value || "daily";
  const box = $("#sc-trig-fields");
  const hint = $("#sc-trig-hint");
  const err = $("#sc-err");
  if (box) box.innerHTML = schedTriggerControl(mode);
  if (hint) hint.textContent = SCHED_TRIG[mode].hint;
  if (err) { err.hidden = true; err.textContent = ""; }
}

/* =========================================================================
   20. 事件委托
   ========================================================================= */
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-act]");
  if (!t) return;
  const act = t.dataset.act;
  const v = t.dataset.v;
  const id = t.dataset.id;

  if (t.classList.contains("bot-card") && e.target.closest("button")) return;

  switch (act) {
    case "noop": e.preventDefault(); toast("原型未实现这个动作"); break;
    case "open-bot": go("/bots/" + id); break;
    case "open-chat": go("/chat/" + id); break;
    case "open-assignment": go("/assignments/" + id); break;
    case "new-bot": modalNewBot(); break;
    case "new-group": modalNewGroup(); break;
    case "new-schedule": modalNewSchedule(); break;
    case "sc-trig": updateSchedTriggerFields(); break;
    case "close-modal": closeModal(); break;
    case "modal-bg": if (e.target === t) closeModal(); break;
    case "toggle-theme": S.theme = S.theme === "light" ? "dark" : "light"; render(); break;
    case "toggle-demo": S.demoOpen = !S.demoOpen; renderDemo(); break;
    case "toggle-aside": {
      /* 两种形态共用一个按钮：
         ≥1280 右面板是常驻栏 → 点击收起/展开这一列（网格列变 1）；
         <1280 折叠为右侧抽屉 → 点击滑出，遮罩 / 关闭按钮 / Esc 收回。
         之前只在窄屏生效，宽屏点这个按钮毫无反应（按钮可见却无效）。 */
      const a = $("#aside");
      if (!a) break;
      const wide = window.matchMedia("(min-width: 1280px)").matches;
      if (wide) {
        const chat = $(".chat");
        if (!chat) break;
        const collapsed = chat.classList.toggle("is-aside-collapsed");
        t.setAttribute("aria-expanded", String(!collapsed));
        t.textContent = collapsed ? "展开上下文" : "上下文";
        break;
      }
      const open = !a.classList.contains("is-open");
      a.classList.toggle("is-open", open);
      const scrim = $(".aside-scrim");
      if (scrim) scrim.classList.toggle("is-open", open);
      t.setAttribute("aria-expanded", String(open));
      if (open) { const close = $(".aside-drawer-head .icon-btn", a); if (close) close.focus(); }
      break;
    }
    case "close-aside": {
      const a = $("#aside");
      if (a) a.classList.remove("is-open");
      const scrim = $(".aside-scrim");
      if (scrim) scrim.classList.remove("is-open");
      const btn = $('[data-act="toggle-aside"]');
      if (btn) { btn.setAttribute("aria-expanded", "false"); btn.focus(); }
      break;
    }
    case "demo-set": {
      S.demo[routeKey(parts())] = v;
      /* /setup 的四态只存在于第一步（探测列表）。演示面板切态时一律回到第一步并重置探测：
         - normal → 重新逐项探测（probeStarted=false 让 render 启动）
         - 其余三态 → 不跑真实探测（probeStarted=true），否则演示态会被探测结果覆盖 */
      if (routeKey(parts()) === "setup") {
        S.setup.step = 1;
        S.setup.detected = [];
        S.setup.probeStarted = v !== "normal";
      }
      render();
      break;
    }
    case "reset":
      S.bots = JSON.parse(JSON.stringify(BOTS));
      S.channels = JSON.parse(JSON.stringify(CHANNELS));
      S.assignments = JSON.parse(JSON.stringify(ASSIGNMENTS));
      S.schedules = JSON.parse(JSON.stringify(SCHEDULES));
      S.usage = JSON.parse(JSON.stringify(USAGE));
      S.memory = JSON.parse(JSON.stringify(MEMORY));
      S.streams = JSON.parse(JSON.stringify(SEED));
      S.demo = {}; S.activePerm = null; S.permSec = 118;
      S.setup = { step: 1, probeStarted: false, detected: [], runtime: "gemini", name: "研究助手", sent: false, typed: false };
      render(); toast("演示数据已重置"); break;

    case "filter": S.filters[t.dataset.k] = v; render(); break;
    case "clear-filters": S.filters = { runtime: "all", state: "all", location: "all" }; render(); break;
    case "bot-tab": S.botTab = v; render(); break;
    case "settings-tab": S.settingsTab = v; render(); break;
    case "assign-filter": S.assignFilter = v; render(); break;
    case "usage-range": S.usageRange = v; render(); break;
    case "toggle-memory": {
      const m = Object.values(S.memory).flat().find((x) => x.id === id);
      if (m) m.on = !m.on;
      t.classList.toggle("is-on", m && m.on);
      t.setAttribute("aria-pressed", String(!!(m && m.on)));
      break;
    }
    case "add-memory": toast("新增记忆（原型未展开表单）"); break;

    case "toggle-turn": {
      const turn = t.closest(".turn");
      const expanded = t.getAttribute("aria-expanded") === "true";
      t.setAttribute("aria-expanded", String(!expanded));
      turn.classList.toggle("is-collapsed", expanded);
      const chev = $(".turn-chev", turn);
      if (chev) chev.textContent = expanded ? "›" : "⌄";
      break;
    }
    case "fold": {
      const expanded = t.getAttribute("aria-expanded") === "true";
      t.setAttribute("aria-expanded", String(!expanded));
      const body = document.getElementById(t.dataset.target);
      if (body) body.classList.toggle("is-open", !expanded);
      break;
    }
    case "fill-prompt": {
      const input = $("#composer-input");
      if (input) { input.value = t.dataset.q; input.focus(); }
      break;
    }
    case "send": handleSend(); break;
    case "stop-stream": {
      /* 1) 先杀运行时：gen 前进 + 所有定时器清空。之后任何在飞的 tick / done 都失效，
            不会再把光标 append 回来、也不会把头部覆盖成「完成」。 */
      stopRun();
      setSending(false);
      const live = $$("#stream-inner .turn").filter((t) => !t.classList.contains("is-collapsed")
        && !t.classList.contains("is-interrupted")).pop();
      if (live) {
        /* 2) 数据层同步成终态：切主题 / 重渲染后不会复活成「生成中」 */
        const turnId = live.dataset.turn;
        const arr = S.streams[S.activeChannel] || [];
        const rec = arr.find((x) => x.k === "turn" && x.id === turnId);
        const kept = ($(".bubble", live) || {}).textContent || "";
        if (rec) {
          rec.status = "interrupted";
          rec.expanded = true;
          rec.events = kept.trim() ? [{ type: "message", text: kept.trim() }] : [];
          rec.summary = "";
          delete rec.permKind;
        }
        /* 3) 光标立即移除（不等下一帧） */
        $$(".cursor-stream", live).forEach((c) => c.remove());
        /* 4) Turn 头标「已中断」并灰化（§7「Turn 头 / 已中断（灰化）」）；
              「内容保留」写成正文尾注，头部只留状态，不出现「完成」。 */
        live.classList.add("is-interrupted");
        live.classList.remove("is-stuck");
        const right = $(".turn-right", live);
        if (right) right.innerHTML = stateChip("idle", "已中断") + '<span class="turn-sum">内容保留</span><span class="turn-chev">⌄</span>';
        const head = $(".turn-head", live);
        if (head) head.setAttribute("aria-expanded", "true");
        const body = $(".turn-body", live);
        if (body && !$(".interrupted-note", body)) {
          body.insertAdjacentHTML("beforeend",
            `<div class="interrupted-note">已中断 · 已向运行时发出 cancel，生成的内容保留在原处。</div>`);
        }
        /* 5) 群聊里其余的「正在跑」也一并收尾，避免第二个 Bot 继续发言 */
        $$("#stream-inner .act-row").forEach((r) => r.remove());
        const cur = S.streams[S.activeChannel];
        if (cur) S.streams[S.activeChannel] = cur.filter((x) => x.k !== "act");
      }
      groupRunning = false;
      toast("已中断这一轮 · 已生成内容保留");
      break;
    }
    case "to-assignment": modalAssignment(t.dataset.text || ""); break;
    /* PRD P0-04「重发」：以上一条用户消息原文新建一轮，原轮次不覆盖 */
    case "resend": resendLast(currentChannel()); break;
    case "create-assignment": {
      const botId = t.dataset.bot || ($("#as-bot") ? $("#as-bot").value : "b1");
      const title = $("#as-title") ? $("#as-title").value : "新任务";
      const chSel = $("#as-ch") ? $("#as-ch").value : null;
      closeModal();
      /* 目标会话：表单里选了就用；在会话页里派活用当前会话；
         在 /bots 卡片上派活则回落到该 Bot 的私聊（没有私聊就用群聊） */
      const dm = S.channels.find((c) => c.type === "dm" && c.botId === botId);
      const target = chSel
        || (parts()[0] === "chat" ? parts()[1] : null)
        || (dm ? dm.id : "g1");
      runAssignmentCard(botId, title, { channelId: target });
      const chName = (chanOf(target) || {}).name || target;
      if (parts()[0] === "assignments") render();   /* 停在列表页时立刻看到新行 */
      else if (parts()[0] !== "chat") toast("已提交 · 状态卡在「" + chName + "」里");
      break;
    }
    case "assign-from-card": {
      const b = botOf(id);
      openModal(modalFrame("派任务给 " + b.name,
        `<div class="field"><label class="u-label">标题</label><input class="input" id="as-title" value="核对这周的依赖变更"></div>
         <div class="field"><label class="u-label">交付物</label><textarea class="textarea" rows="2">一份差异清单 + 需要人工确认的 3 条。</textarea></div>
         <p class="hint">从 Bot 卡片派活会新建一个任务会话，不占用现有会话。</p>`,
        `<button class="btn btn--secondary" data-act="close-modal">取消</button><span class="spacer"></span>
         <button class="btn btn--primary" data-act="create-assignment" data-bot="${b.id}">提交</button>`));
      break;
    }
    case "inject-assign": runAssignmentCard("b1", "整理这版发布计划的风险"); break;
    /* /assignments 右上「从会话派活」不是跳 /chats（那是索引页，还得再点一层），
       直接打开派活表单，与卡片上的「派任务」同一个入口。 */
    case "assign-from-chats": {
      const ready = S.bots.filter((b) => rtOf(b.runtimeId).status === "ready");
      const def = ready[0] || S.bots[0];
      openModal(modalFrame("从会话派活",
        `<div class="field"><label class="u-label" for="as-title">标题</label><input class="input" id="as-title" value="整理这版发布计划的风险"></div>
         <div class="field"><label class="u-label" for="as-body">交付物</label><textarea class="textarea" id="as-body" rows="2">一段可直接贴进周报的结论，附每条结论的出处。</textarea></div>
         <div class="field"><label class="u-label" for="as-bot">指派 Bot</label><select class="select" id="as-bot">
           ${ready.map((b) => `<option value="${b.id}" ${b.id === def.id ? "selected" : ""}>${esc(b.name)}（${esc(rtOf(b.runtimeId).name)}）</option>`).join("")}</select></div>
         <div class="field"><label class="u-label" for="as-ch">来源会话</label><select class="select" id="as-ch">
           ${S.channels.map((c) => `<option value="${c.id}">${esc(c.name)}</option>`).join("")}</select>
           <div class="hint">任务会在这个会话里出现状态卡，完成后报告回贴到这里。</div></div>`,
        `<button class="btn btn--secondary" data-act="close-modal">取消</button><span class="spacer"></span>
         <button class="btn btn--primary" data-act="create-assignment" data-bot="${def.id}">提交</button>`));
      break;
    }

    case "perm-decide": decidePerm(t.dataset.no, t.dataset.d); break;
    case "inject-perm": injectPermission(v); break;
    case "takeover": takeoverActivity(t); break;
    case "go-boundary": go("/bots/" + (t.dataset.bot || "b1")); break;
    case "scroll-perm": {
      const card = $(".perm");
      if (card) card.scrollIntoView({ block: "center", behavior: reduced() ? "auto" : "smooth" });
      break;
    }
    case "run-group": {
      const c = currentChannel();
      if (c.type !== "group") { toast("这个会话不是群聊"); break; }
      const text = "这版发布计划还有哪些风险？";
      const at = "14:33";
      pushItem(c.id, { k: "user", text, at });
      appendToStream(userMsgHtml(text, at));
      runGroupRound(c, text);
      break;
    }

    case "rebind": modalRebind(id); break;
    case "confirm-rebind": {
      const b = S.bots.find((x) => x.id === id);
      const nextId = $("#rebind-select").value;
      b.runtimeId = nextId;
      const rt = rtOf(nextId);
      b.state = rt.status === "ready" ? "idle" : "blocked";
      const chId = b.id === "b1" ? "d1" : b.id === "b2" ? "d2" : b.id === "b5" ? "d3" : "g1";
      pushItem(chId, { k: "divider", text: `新 Session · 已重建上下文（人格 + 记忆 + 最近 20 条） · 运行时 ${rt.name}` });
      closeModal();
      render();
      toast("已改绑到 " + rt.name + " · 新 Session 已开始");
      break;
    }

    case "create-group": {
      const name = $("#group-name").value || "新群聊";
      const picked = $$('input[name="gp"]:checked').map((x) => x.value);
      const host = $("#group-host").value;
      if (picked.length < 2) { toast("至少选 2 个参与者"); break; }
      const nid = "g" + (S.channels.length + 1);
      S.channels.unshift({ id: nid, type: "group", name, participants: picked, host,
        last: "刚刚创建", time: "刚刚", unread: 0 });
      S.streams[nid] = [];
      closeModal();
      go("/chat/" + nid);
      toast("群聊已创建 · 主持人：" + botOf(host).name);
      break;
    }

    case "create-bot": {
      const name = ($("#nb-name").value || "").trim();
      if (!name) { $("#nb-err").hidden = false; $("#nb-err").textContent = "名称不能为空。"; break; }
      if (S.bots.some((b) => b.name === name)) { $("#nb-err").hidden = false; $("#nb-err").textContent = "这个名称已经存在。"; break; }
      const rid = $("#nb-runtime").value;
      const used = S.bots.map((b) => b.color);
      const color = [1, 2, 3, 4, 5, 6, 7, 8].find((c) => used.indexOf(c) < 0) || 8;
      S.bots.push({ id: "b" + (S.bots.length + 1), name, initial: name.slice(0, 1), color,
        persona: "负责把技术结论改写成非技术同事能读的段落", runtimeId: rid, location: "local",
        path: "~/projects/agentbot", state: "idle", ago: "刚刚", pending: 0 });
      closeModal(); render(); toast("已创建 " + name);
      break;
    }

    case "create-schedule": {
      const mode = (document.querySelector('input[name="sc-trig"]:checked') || {}).value || "daily";
      const errEl = $("#sc-err");
      const fail = (msg) => {
        if (errEl) { errEl.hidden = false; errEl.textContent = msg; errEl.scrollIntoView({ block: "nearest" }); }
        toast(msg);
      };
      let rule, next;
      if (mode === "daily") {
        const time = ($("#sc-time") || {}).value || "";
        if (!/^\d{2}:\d{2}$/.test(time)) { fail("请填写触发时刻（HH:MM）。"); break; }
        rule = "每日 " + time;
        next = "明天 " + time;
      } else {
        const mins = Number(($("#sc-mins") || {}).value);
        if (!Number.isFinite(mins) || mins <= 0) { fail("请填写分钟数。"); break; }
        /* PRD P0-11：周期任务最小间隔 5 分钟，更小则拒绝保存。
           一次性延迟没有这个下限（延迟 1 分钟是合法用法），只要求 > 0。 */
        if (mode === "every" && mins < 5) { fail("周期不能小于 5 分钟。"); break; }
        const t = new Date(Date.now() + mins * 60000);
        const at = String(t.getHours()).padStart(2, "0") + ":" + String(t.getMinutes()).padStart(2, "0");
        if (mode === "every") { rule = "每 " + mins + " 分钟"; next = "今天 " + at; }
        else { rule = "延迟 " + mins + " 分钟"; next = "今天 " + at; }
      }
      const name = ($("#sc-name").value || "新定时任务").trim();
      const botId = $("#sc-bot").value;
      const chId = $("#sc-channel").value;
      S.schedules.unshift({ id: "s" + (S.schedules.length + 1), name, botId, channelId: chId,
        rule, next, last: "—", ok: true, enabled: true, once: mode === "delay" });
      closeModal(); render();
      toast("已保存 · 下次触发 " + next);
      break;
    }
    case "toggle-schedule": {
      const s = S.schedules.find((x) => x.id === id);
      s.enabled = !s.enabled;
      s.next = s.enabled ? "明天 09:00" : "—";
      render();
      toast(s.enabled ? "已恢复" : "已暂停");
      break;
    }
    case "rerun": toast("已重新排队 · 新任务 A-0145"); break;
    case "reset-token": toast("token 已重置 · 10 秒内断开所有客户端"); break;
    case "pending-chip": go("/chat/g1"); break;

    case "setup-next": S.setup.step = 2; render(); break;
    case "setup-back": S.setup.step = Math.max(1, S.setup.step - 1); S.setup.typed = false; render(); break;
    case "setup-skip": S.setup.step = 2; S.setup.detected = PROBE_ITEMS.map((p) => p.id); render(); break;
    case "setup-runtime": S.setup.runtime = id; render(); break;
    case "probe-retry": toast("重试该项探测（其余项不受影响）"); break;
    case "setup-create": {
      const raw = ($("#bot-name").value || "").trim();
      const err = $("#bot-name-err");
      const showErr = (msg) => {
        S.setup.nameErr = msg;
        const el = $("#bot-name-err");
        if (el) {
          el.className = "field-err";
          el.setAttribute("role", "alert");
          el.textContent = msg;
        }
        const inp = $("#bot-name");
        if (inp) { inp.setAttribute("aria-invalid", "true"); inp.focus(); }
      };
      /* PRD P0-03：名称 1–32 字符，工作区内唯一；重复内联报错不提交。 */
      if (!raw) { showErr("名称不能为空。"); break; }
      if (raw.length > 32) { showErr("名称最多 32 个字符。"); break; }
      if (S.bots.some((b) => b.name === raw)) { showErr("名称已被占用：工作区里已经有叫「" + raw + "」的 Bot。"); break; }
      S.setup.name = raw;
      S.setup.nameErr = "";
      S.setup.step = 3;
      render();
      break;
    }
    case "setup-send": {
      const val = ($("#setup-msg").value || "").trim();
      if (!val) break;
      S.setup.sent = true; S.setup.typed = false;
      render();
      break;
    }
    case "setup-finish":
      S.bots[0].name = S.setup.name;
      S.bots[0].initial = S.setup.name.slice(0, 1);
      S.setup = { step: 1, probeStarted: false, detected: [], runtime: "gemini", name: "研究助手", sent: false, typed: false };
      go("/bots");
      toast("完成 · 已进入工作台");
      break;
  }
});

document.addEventListener("input", (e) => {
  if (e.target.dataset.act === "setup-name") {
    S.setup.name = e.target.value;
    /* 用户重新输入时清掉旧报错（不立即重校验，避免边打字边报红） */
    if (S.setup.nameErr) {
      S.setup.nameErr = "";
      const el = $("#bot-name-err");
      if (el) { el.className = "hint"; el.removeAttribute("role"); el.textContent = "1–32 个字符，工作区内唯一。"; }
      e.target.setAttribute("aria-invalid", "false");
    }
  }
});

document.addEventListener("keydown", (e) => {
  const tag = (e.target.tagName || "").toLowerCase();
  const typing = tag === "input" || tag === "textarea" || tag === "select";
  if (e.key === "Escape") { closeModal(); return; }
  if (typing) return;

  const blocking = $('.perm[data-kind="block"]');
  if (blocking) {
    if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === "a" || e.key === "A")) {
      e.preventDefault(); decidePerm(blocking.dataset.perm, "forever"); return;
    }
    if (!e.metaKey && !e.ctrlKey) {
      if (e.key === "a" || e.key === "A") {
        e.preventDefault();
        decidePerm(blocking.dataset.perm, e.shiftKey ? "remember" : "approve");
        return;
      }
      if (e.key === "r" || e.key === "R") { e.preventDefault(); decidePerm(blocking.dataset.perm, "reject"); return; }
    }
  }
  if (e.key === "F6") {
    const c = $(".perm");
    if (c) { e.preventDefault(); c.scrollIntoView({ block: "center" }); c.setAttribute("tabindex", "-1"); c.focus(); }
  }
});

/* =========================================================================
   21. 启动
   ========================================================================= */
if (!location.hash) location.hash = "#/bots";
render();
</script>
</body>
