<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentBot · 本地多 Bot 工作台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%230C7A8F'/%3E%3C/svg%3E">
<style>
/* ============================================================
   AgentBot · vivid design tokens
   Bot 是同事。圆角 + 三级柔和阴影 + 回弹动效 + 8 个身份色。
   注释内对比度为 WCAG 2.1 实测值（对白卡 / 对页底）。
   ============================================================ */
:root {
  /* ---- 表面 ---- */
  --color-bg: #F6F8FA;
  --color-surface: #FFFFFF;
  --color-surface-2: #EEF2F5;      /* 凹陷、折叠块、徽标底 */
  --color-surface-3: #E7F2F4;      /* 选中行 = 主色 10% 混白 */
  --color-surface-hover: #F1F5F7;

  /* ---- 文字 ---- */
  --color-text: #16202B;           /* 16.5 / 15.5 */
  --color-text-secondary: #3D4E5C; /*  8.6 /  8.1 */
  --color-text-muted: #5A6B7A;     /*  5.5 /  5.2 */
  --color-text-faint: #77879A;     /*  3.7 /  3.5  仅占位符与禁用 */

  /* ---- 边框与焦点环 ---- */
  --color-border: #DCE3E8;
  --color-border-strong: #C6D0D8;
  --color-border-focus: #0C7A8F;
  --ring-focus: 0 0 0 3px rgba(12, 122, 143, .28);
  --ring-danger: 0 0 0 3px rgba(179, 55, 42, .30);

  /* ---- 主色：青蓝 H188（非紫非靛） ---- */
  --color-primary: #0C7A8F;        /* 白字 5.0 */
  --color-primary-hover: #096775;  /* 白字 6.5 */
  --color-primary-active: #075260; /* 白字 8.8 */
  --color-primary-ink: #07596A;    /* 主色文字；对 soft 6.9 */
  --color-primary-soft: #E4F2F5;
  --color-primary-tint: #EDF5F7;
  --color-primary-bright: #4FC3CF; /* 仅装饰（扫光/光环），禁做文字 */

  /* ---- 语义 ---- */
  --color-success: #1E7A46; --color-success-ink: #186B3C; --color-success-soft: #E8F5ED;
  --color-warning: #8A5B00; --color-warning-ink: #8A5B00; --color-warning-soft: #FDF3E0;
  --color-danger:  #B3372A; --color-danger-ink:  #96291F; --color-danger-soft:  #FDECEA;
  --color-info:    #2A6FC0; --color-info-ink:    #1F4E8C; --color-info-soft:    #EAF1FB;
  --color-accent-live: #F2643F;    /* ≤8px 点缀：未读点、新消息脉冲；3.15 非文本可用 */

  /* ---- Bot 身份色：base / ink(文字) / tint(气泡底) ---- */
  --bot-1: #2A6FC0; --bot-1-ink: #205492; --bot-1-tint: #F0F5FB; /* 钴蓝 · 研究助手 */
  --bot-2: #6A57BE; --bot-2-ink: #514290; --bot-2-tint: #F5F3FA; /* 紫藤 · 审查助手 */
  --bot-3: #A8459B; --bot-3-ink: #803476; --bot-3-tint: #F9F2F8; /* 品红 · 文案助手 */
  --bot-4: #B23A57; --bot-4-ink: #872C42; --bot-4-tint: #FAF1F3; /* 莓红 · 客服助手 */
  --bot-5: #C2410C; --bot-5-ink: #933109; --bot-5-tint: #FBF2EE; /* 赭橙 · 实现助手 */
  --bot-6: #57791C; --bot-6-ink: #425C15; --bot-6-tint: #F3F6EF; /* 橄榄 · 运维助手 */
  --bot-7: #8C6A12; --bot-7-ink: #6A510E; --bot-7-tint: #F7F5EE; /* 芥金 · 数据分析 */
  --bot-8: #2F7D4A; --bot-8-ink: #245F38; --bot-8-tint: #F0F6F2; /* 松绿 · 未分配兜底 */

  /* ---- Bot 六态：点色 / 文字 / 底 ---- */
  --state-idle:     #8494A3; --state-idle-ink:     #5E7182; --state-idle-soft:     #EFF3F6;
  --state-thinking: #B7791F; --state-thinking-ink: #8A5B00; --state-thinking-soft: #FDF3E0;
  --state-working:  #0A8565; --state-working-ink:  #07596A; --state-working-soft:  #E4F2F5;
  --state-waiting:  #2A6FC0; --state-waiting-ink:  #1F4E8C; --state-waiting-soft:  #EAF1FB;
  --state-blocked:  #C0392B; --state-blocked-ink:  #96291F; --state-blocked-soft:  #FDECEA;
  --state-done:     #1E7A46; --state-done-ink:     #186B3C; --state-done-soft:     #E8F5ED;

  /* ---- 字体 ---- */
  --font-sans: -apple-system, "Segoe UI Variable Text", "Segoe UI", "PingFang SC",
               "Microsoft YaHei", Inter, sans-serif;
  --font-mono: "SF Mono", "JetBrains Mono", "Cascadia Code", Consolas, monospace;
  --font-size-display: 34px; --font-size-h1: 28px; --font-size-h2: 22px;
  --font-size-h3: 18px;      --font-size-body-lg: 16px; --font-size-body: 15px;
  --font-size-body-sm: 14px; --font-size-caption: 13px; --font-size-micro: 12px;
  --font-size-mono: 12.5px;
  --line-display: 1.15; --line-h1: 1.2; --line-h2: 1.3; --line-h3: 1.35;
  --line-body-lg: 1.6;  --line-body: 1.6; --line-body-sm: 1.55;
  --line-caption: 1.45; --line-micro: 1.4; --line-mono: 1.55;
  --weight-regular: 400; --weight-medium: 500; --weight-semibold: 600;
  --weight-bold: 700;    --weight-heavy: 800;
  --tracking-tight: -0.02em; --tracking-snug: -0.01em; --tracking-wide: 0.02em;

  /* ---- 间距（4 基准） ---- */
  --space-1: 4px;  --space-2: 8px;  --space-3: 12px; --space-4: 16px;
  --space-5: 20px; --space-6: 24px; --space-7: 32px; --space-8: 40px;
  --space-9: 48px; --space-10: 64px;

  /* ---- 圆角 ---- */
  --radius-xs: 4px;   --radius-sm: 8px;   --radius-md: 10px;  --radius-lg: 12px;
  --radius-xl: 14px;  --radius-2xl: 16px; --radius-3xl: 20px;
  --radius-pill: 24px; --radius-full: 999px;

  /* 连续消息气泡（TL TR BR BL） */
  --radius-bubble-single: 16px 16px 16px 4px;
  --radius-bubble-first:  16px 16px 16px 4px;
  --radius-bubble-mid:    4px 16px 16px 4px;
  --radius-bubble-last:   4px 16px 16px 16px;
  --radius-bubble-user:   16px 16px 4px 16px;

  /* ---- 阴影三级（墨蓝而非纯黑） ---- */
  --shadow-card:    0 1px 2px rgba(22, 32, 43, .05), 0 2px 8px rgba(22, 32, 43, .04);
  --shadow-raise:   0 6px 16px rgba(22, 32, 43, .08);
  --shadow-overlay: 0 16px 40px rgba(22, 32, 43, .12);

  /* ---- 动效 ---- */
  --ease-spring: cubic-bezier(.34, 1.56, .64, 1);
  --ease-out:    cubic-bezier(.22, .61, .36, 1);
  --ease-in-out: cubic-bezier(.4, 0, .2, 1);
  --duration-press: 120ms; --duration-hover: 160ms; --duration-fast: 200ms;
  --duration-base: 240ms;  --duration-slow: 280ms;  --duration-page: 360ms;
  --stagger-step: 40ms;

  /* ---- 组件局部色（按钮各态、折叠块底） ---- */
  --btn-primary-disabled-bg: #C9D6DC; --btn-primary-disabled-fg: #6F7F8C;
  --btn-secondary-disabled-bg: #F1F5F7; --btn-secondary-disabled-fg: #8A99A7;
  --btn-secondary-disabled-border: #DCE3E8;
  --btn-secondary-hover-bg: #F1F5F7;  --btn-secondary-hover-border: #B7C4CD;
  --btn-secondary-active-bg: #E7EDF1;
  --btn-ghost-fg: #46586A; --btn-ghost-hover-bg: #EDF2F4; --btn-ghost-active-bg: #E2E9ED;
  --btn-disabled-fg: #8A99A7;
  --btn-danger-hover: #97291E; --btn-danger-active: #7F2017;
  --btn-danger-disabled-bg: #E7C9C4; --btn-danger-disabled-fg: #8A625C;
  --block-bg: #F3F6F8;             /* 折叠块 / 思考展开底 */

  /* ---- 前景配对：与底色成对定义，暗色下整体反转 ---- */
  --av-fg: #FFFFFF;                /* 身份色方牌上的首字 */
  --btn-primary-fg: #FFFFFF;       /* 主按钮 / 发送键 / 未读数字 */
  --btn-danger-fg: #FFFFFF;        /* 危险按钮 */
  --bubble-user-fg: #FFFFFF;       /* 用户气泡文字 */
  --fab-bg: #0C7A8F; --fab-fg: #FFFFFF;   /* 演示浮钮 */
  --toast-bg: #16202B; --toast-fg: #F6F8FA;
  --color-sep: #5A6B7A;            /* 面包屑分隔符：对页底 5.2 */

  /* 遮罩与描边：由令牌合成，暗色下随 --scrim-base 反转 */
  --scrim-base: #16202B;
  --scrim: color-mix(in srgb, var(--scrim-base) 34%, transparent);
  --scrim-soft: color-mix(in srgb, var(--scrim-base) 8%, transparent);
  --hairline: 1px solid var(--color-border);

  /* ---- 布局 ---- */
  --nav-width: 240px; --nav-width-rail: 64px; --aside-width: 320px;
  --stream-max: 860px; --bubble-max: 660px; --composer-max: 760px;
  --card-width: 320px; --card-height: 200px; --row-height: 56px;
}

/* ============================================================
   可选暗色（非默认主题，需显式 data-theme="dark"）
   ============================================================ */
[data-theme="dark"] {
  --color-bg: #11161B; --color-surface: #1A2129; --color-surface-2: #0C1014;
  --color-surface-3: #153036; --color-surface-hover: #232B33;
  --color-text: #E9EEF2;           /* 13.9 */
  --color-text-secondary: #C2CDD6; /* 10.1 */
  --color-text-muted: #9AA9B6;     /*  6.8 */
  --color-text-faint: #8A99A7;     /* 5.5 对 surface，比亮色一档更亮：暗底小字需要 */
  --color-border: #2B343D; --color-border-strong: #3A4550; --color-border-focus: #35B8C8;

  --color-primary: #35B8C8; --color-primary-hover: #4CC8D6;
  --color-primary-active: #62D6E2; --color-primary-ink: #7DD9E4;
  --color-primary-soft: #153036; --color-primary-tint: #11262B;

  --color-success: #4FD08A; --color-success-ink: #7ADFA8; --color-success-soft: #12291D;
  --color-warning: #E0A33A; --color-warning-ink: #F0BE68; --color-warning-soft: #2A2010;
  --color-danger:  #F27A6B; --color-danger-ink:  #FF9C90; --color-danger-soft:  #2E1714;
  --color-info:    #7FB0E8; --color-info-ink:    #A6C9F2; --color-info-soft:    #14202E;

  --bot-1: #75A1D6; --bot-1-ink: #75A1D6; --bot-1-tint: #1D2D41;
  --bot-2: #9E92D5; --bot-2-ink: #9E92D5; --bot-2-tint: #272A41;
  --bot-3: #C686BE; --bot-3-ink: #C686BE; --bot-3-tint: #31273B;
  --bot-4: #CD7F92; --bot-4-ink: #CD7F92; --bot-4-tint: #322530;
  --bot-5: #D78461; --bot-5-ink: #D78461; --bot-5-tint: #352624;
  --bot-6: #92A86B; --bot-6-ink: #92A86B; --bot-6-tint: #242F27;
  --bot-7: #B49E65; --bot-7-ink: #B49E65; --bot-7-tint: #2C2D25;
  --bot-8: #78AA89; --bot-8-ink: #78AA89; --bot-8-tint: #1D302E;

  --state-idle: #9AA9B6;     --state-idle-ink: #9AA9B6;     --state-idle-soft: #1A2129;
  --state-thinking: #E0A33A; --state-thinking-ink: #E0A33A; --state-thinking-soft: #2A2010;
  --state-working: #35B8C8;  --state-working-ink: #35B8C8;  --state-working-soft: #153036;
  --state-waiting: #7FB0E8;  --state-waiting-ink: #7FB0E8;  --state-waiting-soft: #14202E;
  --state-blocked: #F27A6B;  --state-blocked-ink: #F27A6B;  --state-blocked-soft: #2E1714;
  --state-done: #4FD08A;     --state-done-ink: #4FD08A;     --state-done-soft: #12291D;

  --shadow-card:    0 1px 2px rgba(0, 0, 0, .40), 0 2px 8px rgba(0, 0, 0, .28);
  --shadow-raise:   0 6px 16px rgba(0, 0, 0, .45);
  --shadow-overlay: 0 16px 40px rgba(0, 0, 0, .60);
  --ring-focus:     0 0 0 3px rgba(53, 184, 200, .35);
  --ring-danger:    0 0 0 3px rgba(242, 122, 107, .35);

  /* 装饰色：仅扫光/光环/未读点，禁做文字 */
  --color-primary-bright: #6FE0EA;
  --color-accent-live: #FF7A55;     /* 对 #11161B 非文本 6.4:1 */
  --color-sep: #9AA9B6;
  --scrim-base: #000000;           /* 暗色遮罩用纯黑压暗，不用浅色蒙层 */
  --scrim: color-mix(in srgb, var(--scrim-base) 58%, transparent);
  --scrim-soft: color-mix(in srgb, var(--scrim-base) 18%, transparent);
  --hairline: 1px solid var(--color-border);

  /* 前景配对：暗色下浅底配深墨，深底配浅字 */
  --av-fg: #0B1418;
  --btn-primary-fg: #0B1418;
  --btn-danger-fg: #2A0F0C;
  --bubble-user-fg: #0B1418;
  --fab-bg: #35B8C8; --fab-fg: #0B1418;
  --toast-bg: #232B33; --toast-fg: #E9EEF2;

  /* 按钮各态（暗色：悬停提亮、按下更亮、禁用低饱和） */
  --btn-primary-disabled-bg: #253038; --btn-primary-disabled-fg: #8A99A7;
  --btn-secondary-disabled-bg: #232B33; --btn-secondary-disabled-fg: #8A99A7;
  --btn-secondary-disabled-border: #2B343D;
  --btn-secondary-hover-bg: #232B33;  --btn-secondary-hover-border: #4A5764;
  --btn-secondary-active-bg: #2B343D;
  --btn-ghost-fg: #C2CDD6; --btn-ghost-hover-bg: #1F272F; --btn-ghost-active-bg: #2B343D;
  --btn-disabled-fg: #8A99A7;
  --btn-danger-hover: #FF9084; --btn-danger-active: #FFA79B;
  --btn-danger-disabled-bg: #3A2320; --btn-danger-disabled-fg: #9C7A74;
  --block-bg: #0C1014;              /* 折叠块 / 思考展开底（凹陷 = surface-2） */

  /* 布局：与亮色相同，显式重复以保证两套主题令牌集合一致 */
  --nav-width: 240px; --nav-width-rail: 64px; --aside-width: 320px;
  --stream-max: 860px; --bubble-max: 660px; --composer-max: 760px;
  --card-width: 320px; --card-height: 200px; --row-height: 56px;
}

/* ============================================================
   动效降级：位移/缩放归零，循环改静态
   ============================================================ */
@media (prefers-reduced-motion: reduce) {
  :root {
    --ease-spring: linear; --ease-out: linear; --ease-in-out: linear;
    --duration-press: 1ms; --duration-hover: 1ms; --duration-fast: 1ms;
    --duration-base: 1ms; --duration-slow: 1ms; --duration-page: 1ms;
    --stagger-step: 0ms;
  }
  *, *::before, *::after {
    animation-duration: 1ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 1ms !important;
    scroll-behavior: auto !important;
    transform: none !important;
  }
  .cursor-stream { animation: none !important; opacity: 1 !important; } /* 光标改常显竖条 */
  .state-dot { animation: none !important; }                          /* 状态仅保留颜色 */
}

/* ============================================================
   ↑ 以上为定稿令牌，数值未改动。以下为原型层样式，全部引用令牌。
   ============================================================ */


* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font-sans);
  font-size: var(--font-size-body);
  line-height: var(--line-body);
  color: var(--color-text);
  background: var(--color-bg);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
h1, h2, h3, h4, p, ul, ol { margin: 0; }
ul, ol { padding-left: 1.15em; }
a { color: var(--color-primary-ink); text-decoration: none; }
button { font-family: inherit; font-size: inherit; }
:focus-visible { outline: none; box-shadow: var(--ring-focus); }
::selection { background: var(--color-primary-soft); }

*::-webkit-scrollbar { width: 10px; height: 10px; }
*::-webkit-scrollbar-thumb {
  background: var(--color-border-strong);
  border-radius: var(--radius-full);
  border: 3px solid transparent;
  background-clip: content-box;
}
*::-webkit-scrollbar-track { background: transparent; }

.u-mono { font-family: var(--font-mono); font-size: var(--font-size-mono); font-variant-numeric: tabular-nums; }
.u-num { font-variant-numeric: tabular-nums; }
.u-label { font-size: var(--font-size-micro); font-weight: var(--weight-semibold); letter-spacing: var(--tracking-wide); color: var(--color-text-muted); }
.u-muted { color: var(--color-text-muted); }
.u-faint { color: var(--color-text-muted); }   /* 元信息按内容对待；faint 只留给占位符/禁用/装饰 */
.spacer { flex: 1 1 auto; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

/* ---------------- 动效关键帧 ---------------- */
@keyframes enter { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes bubbleIn { from { opacity: 0; transform: translateY(8px) scale(.97); } to { opacity: 1; transform: none; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
@keyframes dotPulse { 0%, 100% { opacity: .22; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-1px); } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes breathe { 0%, 100% { transform: scale(.94); } 50% { transform: scale(1.02); } }
@keyframes shake { 20% { transform: translateX(-2px); } 60% { transform: translateX(2px); } 100% { transform: translateX(0); } }
@keyframes drawCheck { to { stroke-dashoffset: 0; } }
@keyframes railIn { from { transform: scaleY(.2); opacity: 0; } to { transform: scaleY(1); opacity: 1; } }
@keyframes sweep { from { transform: translateX(-110%); } to { transform: translateX(110%); } }
@keyframes shimmer { from { background-position: 100% 0; } to { background-position: 0 0; } }
@keyframes modalIn { from { opacity: 0; transform: translateY(6px) scale(.96); } to { opacity: 1; transform: none; } }
@keyframes modalOut { from { opacity: 1; transform: none; } to { opacity: 0; transform: scale(.98); } }
@keyframes overlayIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes toastIn { from { opacity: 0; transform: translateY(10px) scale(.96); } to { opacity: 1; transform: none; } }
@keyframes livePulse { 0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--color-accent-live) 45%, transparent); } 50% { box-shadow: 0 0 0 5px color-mix(in srgb, var(--color-accent-live) 0%, transparent); } }
@keyframes countPulse { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }

/* fill-mode 用 backwards 而非 both：动画结束后不再锁死 opacity:1，
   否则 .is-dim / .is-dim.enter（已删除 Bot 行、暂停的定时任务行、失败任务行）永远灰不下去。
   enter 的终态就是元素自身样式（opacity 1 / transform none），不需要 forwards 兜底。 */
.enter { animation: enter var(--duration-base) var(--ease-spring) backwards; animation-delay: calc(var(--i, 0) * var(--stagger-step)); }

/* ---------------- 应用外壳 ---------------- */
.app { display: grid; grid-template-columns: var(--nav-width) minmax(0, 1fr); min-height: 100vh; }

.sidebar {
  position: sticky; top: 0; height: 100vh;
  display: flex; flex-direction: column; gap: var(--space-6);
  padding: var(--space-5) var(--space-3) var(--space-4);
  background: var(--color-surface);
  z-index: 40;
}
.brand { display: flex; align-items: center; gap: var(--space-3); padding: 0 var(--space-2); }
.brand-mark { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; width: 28px; height: 28px; flex: 0 0 auto; }
.brand-mark i { border-radius: 3px; background: var(--color-primary); }
.brand-mark i:nth-child(2) { opacity: .62; }
.brand-mark i:nth-child(3) { opacity: .38; }
.brand-mark i:nth-child(4) { opacity: .82; }
.brand-text { display: flex; flex-direction: column; min-width: 0; }
.brand-name { font-size: var(--font-size-body-lg); font-weight: var(--weight-heavy); letter-spacing: var(--tracking-tight); line-height: 1.1; }
.brand-sub { font-size: 11px; color: var(--color-text-muted); margin-top: 2px; line-height: 1.2; }

.nav { display: flex; flex-direction: column; gap: 2px; }
.nav-item {
  position: relative; display: flex; align-items: center; gap: var(--space-3);
  height: 40px; padding: 0 var(--space-3); border-radius: var(--radius-md);
  color: var(--color-text-secondary); font-size: var(--font-size-body-sm); font-weight: var(--weight-medium);
  transition: background var(--duration-hover) var(--ease-out), color var(--duration-hover) var(--ease-out);
}
.nav-item:hover { background: var(--color-surface-hover); color: var(--color-text); }
.nav-item.is-active { background: var(--color-surface-3); color: var(--color-primary-ink); font-weight: var(--weight-bold); }
.nav-item.is-active::before {
  content: ""; position: absolute; left: -6px; top: 10px; bottom: 10px; width: 3px;
  border-radius: 3px; background: var(--color-primary); animation: railIn 180ms var(--ease-spring);
}
.nav-item svg { flex: 0 0 auto; opacity: .9; }
.nav-count {
  margin-left: auto; min-width: 20px; height: 20px; padding: 0 6px;
  display: inline-flex; align-items: center; justify-content: center;
  border-radius: var(--radius-full); background: var(--color-surface-2);
  font-size: 11px; font-weight: var(--weight-semibold); color: var(--color-text-muted);
  font-variant-numeric: tabular-nums;
}
.nav-count.is-alert { background: var(--color-warning-soft); color: var(--color-warning-ink); }

.sidebar-foot { margin-top: auto; display: flex; flex-direction: column; gap: var(--space-2); }
.foot-card {
  display: flex; align-items: center; gap: var(--space-2);
  padding: 10px var(--space-3); border-radius: var(--radius-lg);
  background: var(--color-surface-2); font-size: var(--font-size-micro); color: var(--color-text-muted);
}
.foot-card b { font-size: 13px; color: var(--color-text); font-variant-numeric: tabular-nums; }
.foot-roster { display: flex; gap: 5px; flex-wrap: wrap; padding: 0 var(--space-2); }
.roster-dot { width: 8px; height: 8px; border-radius: var(--radius-full); background: var(--c); }

.main { min-width: 0; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; gap: var(--space-3);
  height: 56px; padding: 0 var(--space-7);
  background: color-mix(in srgb, var(--color-bg) 86%, transparent);
  backdrop-filter: blur(10px);
}
.crumb { display: flex; align-items: center; gap: 8px; font-size: var(--font-size-caption); color: var(--color-text-muted); min-width: 0; }
.crumb a { color: var(--color-text-muted); }
.crumb a:hover { color: var(--color-primary-ink); }
.crumb b { color: var(--color-text); font-weight: var(--weight-semibold); }
.crumb .sep { color: var(--color-sep); }

.chip-pending {
  display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px;
  border: 0; border-radius: var(--radius-full); cursor: pointer;
  background: var(--color-warning-soft); color: var(--color-warning-ink);
  font-size: var(--font-size-micro); font-weight: var(--weight-semibold);
  transition: transform var(--duration-hover) var(--ease-out);
}
.chip-pending:hover { transform: translateY(-1px); }
.chip-pending:active { transform: scale(.97); }
.live-dot { width: 7px; height: 7px; border-radius: var(--radius-full); background: var(--color-accent-live); animation: livePulse 1.8s var(--ease-in-out) infinite; }

.page { padding: var(--space-5) var(--space-7) var(--space-9); min-width: 0; }
.page--flush { padding: 0; flex: 1; min-height: 0; }

/* ---------------- 页头 ---------------- */
.page-head { display: flex; align-items: flex-end; gap: var(--space-4); flex-wrap: wrap; margin-bottom: var(--space-6); }
.page-title { font-size: var(--font-size-h1); font-weight: var(--weight-bold); line-height: var(--line-h1); letter-spacing: var(--tracking-snug); }
.page-desc { margin-top: 6px; font-size: var(--font-size-body-sm); color: var(--color-text-muted); max-width: 620px; }
.page-actions { display: flex; align-items: center; gap: var(--space-2); margin-left: auto; }

.readbar { display: flex; gap: var(--space-7); align-items: flex-end; }
.read-group { display: flex; flex-direction: column; gap: 2px; }
.read-num { font-size: 26px; font-weight: var(--weight-heavy); line-height: 1; letter-spacing: var(--tracking-tight); font-variant-numeric: tabular-nums; }
.read-num.is-warning { color: var(--color-warning-ink); }
.read-num.is-working { color: var(--color-state-working-ink, var(--state-working-ink)); }
.read-cap { font-size: var(--font-size-micro); color: var(--color-text-muted); font-weight: var(--weight-medium); }

/* ---------------- 按钮 ---------------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 36px; padding: 0 14px; border: 0; border-radius: var(--radius-md);
  background: var(--color-surface); color: var(--color-text);
  font-size: var(--font-size-body-sm); font-weight: var(--weight-semibold);
  box-shadow: var(--shadow-card); cursor: pointer; white-space: nowrap;
  transition: transform var(--duration-hover) var(--ease-out),
              box-shadow var(--duration-hover) var(--ease-out),
              background var(--duration-hover) var(--ease-out),
              color var(--duration-hover) var(--ease-out);
}
.btn:hover { transform: translateY(-1px); box-shadow: var(--shadow-raise); }
.btn:active { transform: scale(.97); transition-duration: var(--duration-press); }
.btn:focus-visible { box-shadow: var(--ring-focus); }
.btn--primary { background: var(--color-primary); color: var(--btn-primary-fg); }
.btn--primary:hover { background: var(--color-primary-hover); }
.btn--primary:active { background: var(--color-primary-active); }
.btn--secondary { border: 1px solid var(--color-border-strong); box-shadow: none; }
.btn--secondary:hover { background: var(--btn-secondary-hover-bg); border-color: var(--btn-secondary-hover-border); box-shadow: var(--shadow-card); }
.btn--secondary:active { background: var(--btn-secondary-active-bg); }
.btn--ghost { background: transparent; box-shadow: none; color: var(--btn-ghost-fg); font-weight: var(--weight-medium); }
.btn--ghost:hover { background: var(--btn-ghost-hover-bg); box-shadow: none; }
.btn--ghost:active { background: var(--btn-ghost-active-bg); }
.btn--danger { background: var(--color-danger); color: var(--btn-danger-fg); }
.btn--danger:hover { background: var(--btn-danger-hover); }
.btn--danger:active { background: var(--btn-danger-active); }
.btn:disabled, .btn[disabled] {
  background: var(--btn-primary-disabled-bg); color: var(--btn-primary-disabled-fg);
  box-shadow: none; cursor: not-allowed; transform: none;
}
/* §7.1 四型各自的禁用色：secondary 保持「白底 + 灰字」，danger 保持「褪红底 + 暗红字」，
   不能统一套用 primary 的禁用色（否则三类按钮禁用时长得一样，用户分不出层级）。 */
.btn--secondary:disabled, .btn--secondary[disabled] {
  background: var(--btn-secondary-disabled-bg);
  color: var(--btn-secondary-disabled-fg);
  border-color: var(--btn-secondary-disabled-border);
  box-shadow: none;
}
.btn--danger:disabled, .btn--danger[disabled] {
  background: var(--btn-danger-disabled-bg);
  color: var(--btn-danger-disabled-fg);
  box-shadow: none;
}
.btn--ghost:disabled { background: transparent; color: var(--btn-disabled-fg); }
/* §7 按钮统一 r10；--sm 只是更矮更窄，圆角不缩水（8px 会让小按钮看起来像标签而非按钮） */
.btn--sm { height: 30px; padding: 0 10px; font-size: var(--font-size-micro); }
.btn--lg { height: 44px; padding: 0 18px; font-size: var(--font-size-body); }
.btn--icon { width: 36px; padding: 0; }
.btn.is-loading { color: transparent; position: relative; }
.btn.is-loading::after {
  content: ""; position: absolute; inset: 0; margin: auto; width: 4px; height: 4px;
  border-radius: 50%; background: currentColor; color: var(--btn-primary-fg);
  box-shadow: -8px 0 0 currentColor, 8px 0 0 currentColor;
  animation: dotPulse 1s var(--ease-in-out) infinite;
}

.chip {
  display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px;
  border: 1px solid var(--color-border-strong); border-radius: var(--radius-md); cursor: pointer;
  background: var(--color-surface); color: var(--color-text);
  font-size: var(--font-size-micro); font-weight: var(--weight-medium);
  transition: background var(--duration-hover) var(--ease-out), color var(--duration-hover) var(--ease-out),
              border-color var(--duration-hover) var(--ease-out), transform var(--duration-hover) var(--ease-out);
}
.chip:hover { background: var(--color-surface-hover); border-color: var(--btn-secondary-hover-border); transform: translateY(-1px); }
.chip:active { transform: scale(.97); transition-duration: var(--duration-press); }
.chip.is-on { background: var(--color-primary-soft); color: var(--color-primary-ink); border-color: var(--color-primary-soft); font-weight: var(--weight-semibold); }
.chip.is-quiet { background: transparent; border-color: transparent; color: var(--color-text-muted); }
.chip.is-quiet:hover { background: var(--color-surface-hover); border-color: transparent; }
.chip .n { font-variant-numeric: tabular-nums; color: var(--color-text-muted); }

.filters { display: flex; align-items: center; gap: var(--space-5); flex-wrap: wrap; margin-bottom: var(--space-5); }
.filter-group { display: flex; align-items: center; gap: 6px; }
.filter-count { font-size: var(--font-size-micro); color: var(--color-text-muted); font-variant-numeric: tabular-nums; }

/* ---------------- 头像 ---------------- */
.av {
  display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto;
  border-radius: var(--radius-sm); background: var(--bc, var(--color-primary));
  color: var(--av-fg); font-weight: var(--weight-bold); line-height: 1;
  user-select: none; transition: background var(--duration-hover) var(--ease-out);
}
.av--20 { width: 20px; height: 20px; font-size: 10px; border-radius: 6px; }
.av--24 { width: 24px; height: 24px; font-size: 11px; border-radius: 6px; }
.av--28 { width: 28px; height: 28px; font-size: 12px; border-radius: var(--radius-sm); }
.av--32 { width: 32px; height: 32px; font-size: 13px; }
.av--40 { width: 40px; height: 40px; font-size: 15px; }
.av--48 { width: 48px; height: 48px; font-size: 18px; border-radius: var(--radius-md); }
.av--user { border-radius: 50%; background: var(--color-primary-ink); font-size: 12px; color: var(--av-fg); }
.av-wrap { position: relative; display: inline-flex; flex: 0 0 auto; }
.av-badge {
  position: absolute; right: -2px; bottom: -2px; width: 10px; height: 10px;
  border-radius: var(--radius-full); background: var(--s);
  box-shadow: 0 0 0 2px var(--color-surface);
}
.av-stack { display: flex; }
.av-stack .av { margin-left: -8px; box-shadow: 0 0 0 2px var(--color-surface); }
.av-stack .av:first-child { margin-left: 0; }

/* ---------------- 六态 ---------------- */
.state {
  display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px;
  border-radius: var(--radius-full); background: var(--s-soft); color: var(--s-ink);
  font-size: 11px; font-weight: var(--weight-semibold); white-space: nowrap;
  transition: background-color var(--duration-hover) var(--ease-out), color var(--duration-hover) var(--ease-out);
}
.state svg { flex: 0 0 auto; }
.state .state-dot { width: 6px; height: 6px; }
.state--idle { --s-soft: var(--state-idle-soft); --s-ink: var(--state-idle-ink); --s: var(--state-idle); }
.state--thinking { --s-soft: var(--state-thinking-soft); --s-ink: var(--state-thinking-ink); --s: var(--state-thinking); }
.state--working { --s-soft: var(--state-working-soft); --s-ink: var(--state-working-ink); --s: var(--state-working); }
.state--waiting { --s-soft: var(--state-waiting-soft); --s-ink: var(--state-waiting-ink); --s: var(--state-waiting); }
.state--blocked { --s-soft: var(--state-blocked-soft); --s-ink: var(--state-blocked-ink); --s: var(--state-blocked); }
.state--done { --s-soft: var(--state-done-soft); --s-ink: var(--state-done-ink); --s: var(--state-done); }

.state--thinking .si circle { animation: dotPulse 1.6s var(--ease-in-out) infinite; }
.state--thinking .si circle:nth-child(2) { animation-delay: .18s; }
.state--thinking .si circle:nth-child(3) { animation-delay: .36s; }
/* §2.5 working：3/4 圆弧转 1.2s + 外环呼吸。外环用 .si-wrap 的伪元素，
   不占布局、不改变 chip 尺寸，只做「它还在动」的低频提示。 */
.state .si-wrap { position: relative; display: inline-flex; align-items: center; justify-content: center; }
.state--working .si { animation: spin 1.2s linear infinite; transform-origin: 50% 50%; }
.state--working .si-wrap::after {
  content: ""; position: absolute; inset: -2px; border-radius: 50%;
  border: 1px solid currentColor; opacity: .34;
  animation: breathe 1.2s var(--ease-in-out) infinite;
}
.state--waiting .si { animation: breathe 2.4s var(--ease-in-out) infinite; transform-origin: 50% 50%; }
.state--blocked .si { animation: shake 240ms var(--ease-in-out) 1; }
.state--done .si .tick { stroke-dasharray: 12; stroke-dashoffset: 12; animation: drawCheck 320ms var(--ease-out) forwards; }
/* §2.5 done：勾描边画完后静止，3s 回落到 idle（颜色交叉 320ms）。
   回落的是「状态感」，不是数据 —— 完成后 3s 内仍是完成态，之后转成中性空闲色。 */
@keyframes doneDecay {
  from { background: var(--state-done-soft); color: var(--state-done-ink); }
  to   { background: var(--state-idle-soft); color: var(--state-idle-ink); }
}
@keyframes doneDotDecay {
  from { background: var(--state-done); }
  to   { background: var(--state-idle); }
}
.state--done.is-decay { animation: doneDecay var(--duration-slow) var(--ease-out) 3s forwards; }
.state--done.is-decay .state-dot { animation: doneDotDecay var(--duration-slow) var(--ease-out) 3s forwards; }

.state-dot { width: 8px; height: 8px; border-radius: var(--radius-full); background: var(--s); flex: 0 0 auto; }
.state--working .state-dot, .state--waiting .state-dot { animation: breathe 2.4s var(--ease-in-out) infinite; }

/* ---------------- 运行时胶囊 / 能力徽标 ---------------- */
.rt-chip {
  display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px;
  border-radius: var(--radius-sm); background: var(--color-surface-2);
  color: var(--color-text-muted); font-size: 11px; font-weight: var(--weight-medium);
  white-space: nowrap;
}
.cap {
  display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px;
  border-radius: var(--radius-sm); font-size: 11px; font-weight: var(--weight-semibold);
}
.cap--yes { background: var(--color-success-soft); color: var(--color-success-ink); }
.cap--no { background: var(--color-surface-2); color: var(--color-text-muted); }
.cap--unknown { background: transparent; color: var(--color-text-muted); border: 1px dashed var(--color-border-strong); }
.cap-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }

/* ---------------- 卡片 ---------------- */
.card { background: var(--color-surface); border-radius: var(--radius-xl); box-shadow: var(--shadow-card); }
.card-pad { padding: var(--space-6); }
.card-title { font-size: var(--font-size-h3); font-weight: var(--weight-semibold); letter-spacing: var(--tracking-snug); }
.card-sub { font-size: var(--font-size-caption); color: var(--color-text-muted); margin-top: 4px; }
.sec { margin-bottom: var(--space-6); }
.sec-head { display: flex; align-items: center; gap: var(--space-3); margin-bottom: var(--space-4); }
.sec-head h2 { font-size: var(--font-size-h2); font-weight: var(--weight-bold); letter-spacing: var(--tracking-snug); }

/* ---------------- Bot 网格与卡片 ---------------- */
.bot-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: var(--space-5); }
.bot-card {
  position: relative; display: flex; flex-direction: column;
  padding: var(--space-5); height: var(--card-height); min-height: var(--card-height);
  background: var(--color-surface); border-radius: var(--radius-xl);
  box-shadow: var(--shadow-card); cursor: pointer; text-align: left;
  transition: transform var(--duration-hover) var(--ease-out), box-shadow var(--duration-hover) var(--ease-out);
}
.bot-card::before {
  content: ""; position: absolute; left: 0; right: 0; top: 0; height: 3px;
  border-radius: var(--radius-xl) var(--radius-xl) 0 0; background: var(--bc);
}
.bot-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-raise); }
.bot-card:focus-visible { box-shadow: var(--ring-focus), var(--shadow-raise); }
.bot-card.is-unavailable::before { background: var(--color-danger); }
.bc-head { display: flex; align-items: center; gap: 10px; height: 44px; }
.bc-id { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.bc-name { font-size: var(--font-size-body); font-weight: var(--weight-bold); color: var(--bc-ink); letter-spacing: var(--tracking-snug); line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bc-persona { margin: 8px 0 10px; font-size: var(--font-size-caption); color: var(--color-text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bc-reads { display: grid; grid-template-columns: 64px minmax(0, 1fr); column-gap: 8px; }
.bc-reads > * { height: 24px; display: flex; align-items: center; min-width: 0; }
.bc-reads .k { font-size: 11px; font-weight: var(--weight-semibold); color: var(--color-text-muted); }
.bc-reads .v { font-size: 12.5px; color: var(--color-text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* §3 等宽只用于文件路径 / 命令 / token / 耗时 —— 路径必须等宽，扫读时字符宽度一致才认得出尾段 */
.path { display: flex; align-items: center; min-width: 0; font-family: var(--font-mono); font-size: var(--font-size-mono); font-variant-numeric: tabular-nums; }
.path .pre { flex: 0 0 auto; color: var(--color-text-muted); margin-right: 4px; }
.path .p-a { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.path .p-b { flex: 0 0 auto; white-space: nowrap; }
.bc-acts {
  position: absolute; right: 14px; top: 14px; display: flex; gap: 6px;
  opacity: 0; transform: translateY(-4px); pointer-events: none;
  transition: opacity var(--duration-hover) var(--ease-out), transform var(--duration-hover) var(--ease-out);
}
.bot-card:hover .bc-acts, .bot-card:focus-within .bc-acts { opacity: 1; transform: none; pointer-events: auto; }
.bc-banner {
  display: flex; align-items: center; gap: 6px; margin: 8px 0 10px;
  padding: 1px 10px; min-height: 20px; border-radius: var(--radius-sm);
  background: var(--color-danger-soft); color: var(--color-danger-ink);
  font-size: 11px; font-weight: var(--weight-medium);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.bot-card.is-unavailable .bc-persona { display: none; }
.sk {
  background: linear-gradient(90deg, var(--color-surface-2) 25%, var(--color-surface-hover) 37%, var(--color-surface-2) 63%);
  background-size: 400% 100%; animation: shimmer 1.4s var(--ease-in-out) infinite;
  border-radius: var(--radius-sm);
}
.sk-line { height: 10px; display: block; }

/* ---------------- 空态 ---------------- */
.empty {
  display: flex; flex-direction: column; align-items: center; text-align: center;
  padding: var(--space-9) var(--space-7); border-radius: var(--radius-xl);
  background: var(--color-surface); box-shadow: var(--shadow-card);
}
.empty-icon {
  width: 48px; height: 48px; border-radius: var(--radius-full); display: grid; place-items: center;
  background: var(--color-primary-soft); color: var(--color-primary-ink); margin-bottom: var(--space-4);
}
.empty h3 { font-size: var(--font-size-h2); font-weight: var(--weight-bold); letter-spacing: var(--tracking-snug); }
.empty p { margin-top: var(--space-2); font-size: var(--font-size-body-sm); color: var(--color-text-muted); max-width: 460px; line-height: 1.7; }
.empty-actions { margin-top: var(--space-5); display: flex; gap: var(--space-2); flex-wrap: wrap; justify-content: center; }

.banner {
  display: flex; align-items: center; gap: var(--space-3);
  padding: 12px var(--space-4); border-radius: var(--radius-lg);
  background: var(--color-danger-soft); color: var(--color-danger-ink);
  font-size: var(--font-size-body-sm); margin-bottom: var(--space-4);
}
.banner--warn { background: var(--color-warning-soft); color: var(--color-warning-ink); }
.banner--info { background: var(--color-info-soft); color: var(--color-info-ink); }
.banner .spacer { flex: 1; }

/* ---------------- 列表行（会话 / 任务 / 定时 / 用量） ---------------- */
.rows { display: flex; flex-direction: column; gap: 2px; }
.row-item {
  display: flex; align-items: center; gap: var(--space-3);
  min-height: var(--row-height); padding: 8px var(--space-3);
  border-radius: var(--radius-md); background: transparent; text-align: left;
  transition: background var(--duration-hover) var(--ease-out), box-shadow var(--duration-hover) var(--ease-out), transform var(--duration-hover) var(--ease-out);
  cursor: pointer; width: 100%; border: 0; font: inherit; color: inherit;
}
.row-item:hover { background: var(--color-surface); box-shadow: var(--shadow-card); }
.row-item:active { transform: scale(.995); }
.row-item.is-selected { background: var(--color-surface-3); box-shadow: none; }
.row-item.is-dim { opacity: .55; }
.row-main { flex: 1; min-width: 0; }
/* §7 频道列表行：高 56 / r10 / p8-12。
   两行文字压到 22 + 2 + 16 = 40，加 16 padding 正好 56；min-height 兜住单行与骨架行。 */
.row-title { font-size: var(--font-size-body-sm); line-height: 1.4; font-weight: var(--weight-semibold); color: var(--color-text); display: flex; align-items: center; gap: 8px; }
.row-sub { font-size: var(--font-size-micro); line-height: 1.3; color: var(--color-text-muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-time { font-size: 11px; color: var(--color-text-muted); font-variant-numeric: tabular-nums; text-align: right; }
.unread { min-width: 18px; height: 18px; padding: 0 5px; border-radius: var(--radius-full); background: var(--color-primary); color: var(--btn-primary-fg); font-size: 10px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }

.grid-row { display: grid; align-items: center; gap: var(--space-3); padding: 10px var(--space-4); min-height: var(--row-height); border-radius: var(--radius-md); transition: background var(--duration-hover) var(--ease-out), box-shadow var(--duration-hover) var(--ease-out); cursor: pointer; }
.grid-row:hover { background: var(--color-surface); box-shadow: var(--shadow-card); }
.grid-row.is-head { min-height: 34px; cursor: default; font-size: var(--font-size-micro); font-weight: var(--weight-semibold); color: var(--color-text-muted); letter-spacing: var(--tracking-wide); }
/* §8.3：用量表头 12px muted、正常字距（不加宽字距，避免「全大写标签」的工具感） */
.grid-row.is-head.usage-head { font-size: var(--font-size-micro); letter-spacing: 0; }
.grid-row.is-head:hover { background: transparent; box-shadow: none; }
.grid-row.is-dim { opacity: .58; }
.cell-num { text-align: right; font-variant-numeric: tabular-nums; font-size: var(--font-size-body-sm); }
.cell-sub { font-size: 11px; color: var(--color-text-muted); }

/* ---------------- 会话布局 ---------------- */
.chat { display: grid; grid-template-columns: minmax(0, 1fr) var(--aside-width); height: calc(100vh - 56px); min-height: 0; }
.chat-main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.chat-head { display: flex; align-items: center; gap: var(--space-3); padding: 12px var(--space-7); }
.chat-title { font-size: var(--font-size-h3); font-weight: var(--weight-bold); letter-spacing: var(--tracking-snug); line-height: 1.2; }
.chat-meta { display: flex; align-items: center; gap: 8px; font-size: var(--font-size-micro); color: var(--color-text-muted); margin-top: 3px; flex-wrap: wrap; }

.stream { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 0 var(--space-7) var(--space-3); scroll-behavior: smooth; }
.stream-inner { max-width: var(--stream-max); margin: 0 auto; padding-top: var(--space-2); display: flex; flex-direction: column; gap: var(--space-5); }

/* Turn */
.turn { position: relative; min-width: 0; }
.turn-head {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 10px; height: 44px;
  padding: 0 10px 0 16px; margin: 0;
  border-radius: var(--radius-md); background: var(--color-bg);   /* 实色，禁用渐变/透明 */
  transition: background var(--duration-hover) var(--ease-out), box-shadow var(--duration-hover) var(--ease-out);
}
/* 吸顶时抬起（§4.3 / §7 Turn 头）：实色底 + raise 阴影，气泡不会从透明处透出 */
.turn.is-stuck > .turn-head { box-shadow: var(--shadow-raise); }
.turn-head::before {
  content: ""; position: absolute; left: 0; top: 11px; bottom: 11px; width: 3px;
  border-radius: 3px; background: var(--bc);
}

.turn-name { font-size: var(--font-size-body-sm); font-weight: var(--weight-bold); color: var(--bc-ink); }
.turn-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.turn-sum { font-size: 11px; color: var(--color-text-muted); font-variant-numeric: tabular-nums; }
.turn-chev { color: var(--color-text-muted); transition: transform var(--duration-fast) var(--ease-out); display: inline-flex; }
.turn.is-collapsed .turn-chev { transform: rotate(-90deg); }
.turn-toggle { border: 0; background: transparent; color: var(--color-text-muted); cursor: pointer; padding: 4px; border-radius: var(--radius-xs); display: inline-flex; }
.turn-toggle:hover { background: var(--color-surface-hover); }
.turn-body { display: flex; flex-direction: column; gap: var(--space-2); padding-left: 16px; overflow: hidden; }
.turn.is-collapsed .turn-body { display: none; }
/* §7「Turn 头 / 已中断（灰化）」：整轮降饱和，头部文字变次要色，
   但内容仍可读（opacity .62 只压头部，正文保持原对比度，因为用户可能还要读它） */
.turn.is-interrupted > .turn-head { opacity: .62; }
.turn.is-interrupted .turn-name { color: var(--color-text-muted); }
.turn.is-interrupted .bubble--bot { box-shadow: inset 3px 0 0 var(--color-border-strong), var(--shadow-card); }
.interrupted-note {
  display: inline-flex; align-items: center; gap: 6px; padding: 2px 0;
  font-size: var(--font-size-caption); color: var(--color-text-muted);
}
.interrupted-note::before {
  content: ""; width: 6px; height: 6px; border-radius: var(--radius-full);
  background: var(--color-border-strong); flex: 0 0 auto;
}

/* 消息 */
.msg { display: flex; align-items: flex-start; gap: 12px; min-width: 0; }
.msg + .msg:not(.msg--cont) { margin-top: 4px; }   /* 事件行 gap 8 + 4 = 12：气泡组间 12 */
.msg--user { justify-content: flex-end; }
.msg-col { min-width: 0; max-width: var(--bubble-max); display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
.msg--user .msg-col { align-items: flex-end; }
.msg-name { font-size: 11px; font-weight: var(--weight-semibold); color: var(--bc-ink); padding-left: 2px; }
/* §4.2 第三条：时间只在悬停时出现，常态让位给内容 */
.msg-time { font-size: 11px; color: var(--color-text-muted); font-variant-numeric: tabular-nums; align-self: center; }
.msg-hover { display: none; align-items: center; gap: 6px; }
.msg:hover .msg-hover, .msg:focus-within .msg-hover { display: flex; animation: fadeIn var(--duration-hover) var(--ease-out) both; }
.msg--cont .msg-col { padding-left: 44px; }   /* §7：无头像无名字，左缩进 44 = 头像 32 + 间距 12 */
.msg--cont { margin-top: -4px; }  /* 连续消息 gap 8 -> 4，读作一段话 */
.turn-body { padding-top: 8px; }
.bubble {
  padding: 14px 18px; border-radius: var(--radius-bubble-single);
  background: var(--color-surface); box-shadow: var(--shadow-card);
  font-size: var(--font-size-body); line-height: 1.65; white-space: pre-wrap;
  word-break: break-word; overflow-wrap: anywhere;
  animation: bubbleIn var(--duration-fast) var(--ease-spring) both;
  transform-origin: bottom left;
}
.bubble--bot {
  background: var(--bc-tint);
  box-shadow: inset 3px 0 0 var(--bc), var(--shadow-card);
}
.bubble--user {
  background: var(--color-primary); color: var(--bubble-user-fg);
  border-radius: var(--radius-bubble-user); transform-origin: bottom right;
}
.bubble--mid { border-radius: var(--radius-bubble-mid); }
.bubble--last { border-radius: var(--radius-bubble-last); }
.msg--cont .bubble { animation: fadeIn 120ms linear both; }
.msg-tools { display: flex; gap: 6px; }
.msg-tool {
  border: 0; background: var(--color-surface); color: var(--color-text-muted);
  height: 24px; padding: 0 8px; border-radius: var(--radius-full);
  font-size: 11px; font-weight: var(--weight-medium); cursor: pointer;
  box-shadow: var(--shadow-card); display: inline-flex; align-items: center; gap: 4px;
}
.msg-tool:hover { color: var(--color-primary-ink); }
.msg-tool:active { transform: scale(.96); }
.cursor-stream {
  display: inline-block; width: 2px; height: 1.05em; margin-left: 2px;
  vertical-align: -0.16em; border-radius: 1px; background: currentColor;
  animation: blink 1s steps(1) infinite;
}
.bubble--bot .cursor-stream { background: var(--bc-ink); }

/* 事件行 */
.ev { min-width: 0; }
.ev-row {
  display: flex; align-items: center; gap: 8px; width: 100%;
  min-height: 32px; padding: 0 10px; border: 0; background: var(--block-bg);
  border-radius: var(--radius-sm); color: var(--color-text-secondary);
  font-size: var(--font-size-caption); cursor: pointer; text-align: left;
  transition: background var(--duration-hover) var(--ease-out), box-shadow var(--duration-hover) var(--ease-out);
}
.ev-row:hover { background: var(--color-surface-hover); }
.ev-row .chev { margin-left: auto; color: var(--color-text-muted); transition: transform var(--duration-fast) var(--ease-out); display: inline-flex; }
.ev-row[aria-expanded="true"] .chev { transform: rotate(90deg); }
.ev--think .ev-row { border-left: 2px dashed var(--color-border-strong); border-radius: 0 var(--radius-sm) var(--radius-sm) 0; }
.ev--tool .ev-row { border-left: 2px solid var(--bc); border-radius: 0 var(--radius-sm) var(--radius-sm) 0; position: relative; overflow: hidden; }
.ev--tool.is-running .ev-row::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--color-primary-bright) 26%, transparent), transparent);
  transform: translateX(-110%); animation: sweep 1.7s var(--ease-in-out) infinite;
}
.ev--result { padding-left: 12px; }
.ev--result .ev-row { background: transparent; color: var(--color-text-muted); }
.ev--result .ev-row:hover { background: var(--color-surface-hover); }

/* 展开态（§7「事件折叠块」：折叠 / 悬停 / 展开（白底 + card））
   行升到 --color-surface 并带 card 阴影，下方 ev-body 同底色、顶边不留缝，
   行底角归零、体底角收圆 —— 行 + 体合成一块卡片。
   选 --color-surface 而非 --block-bg 的理由：折叠块常态是「凹陷」（block-bg = 暗色下等于
   surface-2），展开是「抬起到桌面上」；surface 在两套主题里都比 block-bg 更靠近前景
   （亮色为纯白对浅灰，暗色为 #1A2129 对 #0C1014），所以展开 = 变亮一层，与阴影方向一致。 */
.ev-row[aria-expanded="true"] {
  background: var(--color-surface);
  box-shadow: var(--shadow-card);
  color: var(--color-text);
  border-radius: var(--radius-sm) var(--radius-sm) 0 0;
}
.ev-row[aria-expanded="true"]:hover { background: var(--color-surface); }
/* 展开态自带 card 阴影，会盖掉全局 :focus-visible 焦点环 —— 这里把 ring 和 card 叠回来 */
.ev-row[aria-expanded="true"]:focus-visible,
.ev--unknown .ev-row[aria-expanded="true"]:focus-visible {
  box-shadow: var(--ring-focus), var(--shadow-card);
}
.ev--think .ev-row[aria-expanded="true"],
.ev--tool .ev-row[aria-expanded="true"] { border-radius: 0 var(--radius-sm) 0 0; }
/* 行 + 体连成一块：体只在行展开时跟随白底，错误块 / 已决审计行不受影响 */
.ev-row[aria-expanded="true"] + .ev-body.is-open {
  background: var(--color-surface);
  border-radius: 0 0 var(--radius-sm) var(--radius-sm);
}
/* 身份轨在展开体里继续（工具 = 实线 Bot 色，思考 = 虚线灰） */
.ev--tool .ev-row[aria-expanded="true"] + .ev-body.is-open { border-left: 2px solid var(--bc); }
.ev--think .ev-row[aria-expanded="true"] + .ev-body.is-open { border-left: 2px dashed var(--color-border-strong); }
.ev-body {
  max-height: 0; overflow: hidden; opacity: 0;
  transition: max-height var(--duration-fast) var(--ease-out), opacity var(--duration-fast) var(--ease-out), margin var(--duration-fast) var(--ease-out);
  margin: 0; background: var(--block-bg); border-radius: var(--radius-sm);
}
.ev-body.is-open { max-height: 340px; overflow: auto; opacity: 1; margin: 0 0 2px; }
/* 非 ev-row 的触发器（错误块「查看详情」、已决权限审计行）不与体连体，保留一段间距 */
.err-block .ev-body.is-open { margin-top: 8px; }
.audit-row + .ev-body.is-open { margin-top: 6px; }

/* 未知事件（§7 第四态 / PRD P0-05 降级）：虚线边，与能力徽标未知态同语言 */
.ev--unknown .ev-row {
  border: 1px dashed var(--color-border-strong); background: transparent;
  color: var(--color-text-muted);
}
.ev--unknown .ev-row:hover { background: var(--color-surface-hover); }
.ev--unknown .ev-row[aria-expanded="true"] {
  background: var(--color-surface); box-shadow: var(--shadow-card);
  border-bottom: 0; color: var(--color-text);
}
.ev--unknown .ev-row[aria-expanded="true"]:hover { background: var(--color-surface); }
.ev--unknown .ev-body.is-open {
  background: var(--color-surface);
  border: 1px dashed var(--color-border-strong); border-top: 0;
  border-radius: 0 0 var(--radius-sm) var(--radius-sm);
}
.ev-unknown-mark {
  flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center;
  width: 16px; height: 16px; border: 1px dashed var(--color-border-strong);
  border-radius: var(--radius-xs); font-size: 10px; font-weight: var(--weight-bold);
  color: var(--color-text-muted);
}
.ev-unknown-why { color: var(--color-text-muted); font-size: var(--font-size-micro); }
.ev--unknown .ev-body pre { color: var(--color-text-muted); }
.ev-body pre {
  margin: 0; padding: 10px 12px; font-family: var(--font-mono); font-size: var(--font-size-mono);
  line-height: var(--line-mono); color: var(--color-text-secondary); white-space: pre-wrap; word-break: break-word;
}
.ev-plan-list { list-style: none; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.ev-plan-list li { display: flex; align-items: center; gap: 8px; font-size: var(--font-size-caption); color: var(--color-text-secondary); }
.plan-dot { width: 12px; height: 12px; border-radius: var(--radius-full); flex: 0 0 auto; border: 1.5px solid var(--color-border-strong); }
.plan-dot.is-done { background: var(--color-success); border-color: var(--color-success); }
.plan-dot.is-doing { background: var(--color-primary-soft); border-color: var(--color-primary); animation: breathe 1.6s var(--ease-in-out) infinite; }
.plan-ring { flex: 0 0 auto; }
.plan-ring circle { fill: none; stroke-width: 2.5; }
.plan-ring .bg { stroke: var(--color-border); }
.plan-ring .fg { stroke: var(--color-primary); stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; transition: stroke-dashoffset var(--duration-slow) var(--ease-out); }

.usage-line { display: flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 11.5px; color: var(--color-text-muted); font-variant-numeric: tabular-nums; padding: 2px 4px 2px 0; }
.end-stamp { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: var(--color-text-muted); padding: 2px 0; }
/* 非流式运行时的等待行（§6.1）：没有光标，用一行低强度文字说明「它还在等」，时长走 tabular */
.wait-line {
  display: inline-flex; align-items: center; gap: 6px; padding: 2px 0;
  font-size: var(--font-size-caption); color: var(--color-text-muted); font-variant-numeric: tabular-nums;
}
.wait-line::before {
  content: ""; width: 6px; height: 6px; border-radius: var(--radius-full);
  background: var(--color-info); animation: breathe 2.4s var(--ease-in-out) infinite;
}

.err-block {
  padding: 12px 14px 12px 16px; border-radius: var(--radius-lg);
  background: var(--color-danger-soft); box-shadow: inset 4px 0 0 var(--color-danger);
  color: var(--color-danger-ink);
}
.err-msg { font-size: var(--font-size-body-sm); line-height: 1.6; }
.err-actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }

/* 权限卡片 */
.perm {
  position: relative; padding: 16px 16px 14px 20px; border-radius: var(--radius-xl);
  background: var(--color-surface); box-shadow: var(--shadow-raise);
  animation: bubbleIn var(--duration-base) var(--ease-spring) both;
}
/* 阻断型权限卡：文档位置仍在该 Turn 内（UX F4-1「卡片插入该 Turn」），
   同时让承载它的 Turn 在视口内吸附在输入框上方 12px（§7 / §8.2）。
   sticky 的包含块是 .stream-inner（整条流），所以吸附真正生效。 */
/* 阻断型权限卡：文档位置在流尾（此刻发生的事），视口内吸附在输入框上方 12px（§7 / §8.2）。
   .stream 的 12px 底留白就是这 12px，因此 sticky bottom 取 0（相对内容盒）。 */
.turn--perm-block { position: sticky; bottom: 0; z-index: 18; }
.turn--perm-block > .turn-head { position: static; }
.perm::before {
  content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
  border-radius: var(--radius-xl) 0 0 var(--radius-xl); background: var(--perm-c);
}
.perm--block { --perm-c: var(--color-warning); --perm-soft: var(--color-warning-soft); --perm-ink: var(--color-warning-ink); }
.perm--hold { --perm-c: var(--color-info); --perm-soft: var(--color-info-soft); --perm-ink: var(--color-info-ink); }
.perm--boundary { --perm-c: var(--color-danger); --perm-soft: var(--color-danger-soft); --perm-ink: var(--color-danger-ink); }
.perm--invalid { --perm-c: var(--color-border-strong); --perm-soft: var(--color-surface-2); --perm-ink: var(--color-text-muted); opacity: .8; }
.perm-head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.perm-tag {
  display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px;
  border-radius: var(--radius-sm); background: var(--perm-soft); color: var(--perm-ink);
  font-size: 11px; font-weight: var(--weight-bold);
}
.perm-no { margin-left: auto; font-family: var(--font-mono); font-size: 11px; color: var(--color-text-muted); }
.perm-fields { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
.perm-field { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 10px; align-items: baseline; font-size: var(--font-size-caption); }
.perm-field .k { font-size: 11px; color: var(--color-text-muted); font-weight: var(--weight-semibold); }
.perm-field .v { color: var(--color-text-secondary); min-width: 0; }
.perm-field code { font-family: var(--font-mono); font-size: var(--font-size-mono); background: var(--color-surface-2); padding: 2px 6px; border-radius: var(--radius-xs); color: var(--color-text); word-break: break-all; }
.perm-countdown { font-family: var(--font-mono); font-weight: var(--weight-bold); color: var(--perm-ink); font-variant-numeric: tabular-nums; }
.perm-countdown.is-urgent { color: var(--color-danger-ink); animation: countPulse 1s var(--ease-in-out) infinite; }
.perm-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.perm-btn { display: inline-flex; align-items: center; gap: 6px; }
kbd {
  font-family: var(--font-sans); font-size: 10px; font-weight: var(--weight-semibold);
  color: var(--color-text-muted); background: var(--color-surface-2);
  border-radius: var(--radius-xs); padding: 1px 5px; line-height: 1.5;
}
.perm-note { margin-top: 10px; font-size: 11px; color: var(--color-text-muted); }
.audit-row {
  display: flex; align-items: center; gap: 8px; width: 100%; min-height: 32px;
  padding: 0 10px; border: 0; border-radius: var(--radius-sm); background: var(--color-surface-2);
  font-size: var(--font-size-caption); color: var(--color-text-muted); cursor: pointer; text-align: left;
}
.audit-row:hover { background: var(--color-surface-hover); }
.audit-row .ok { color: var(--color-success-ink); font-weight: var(--weight-bold); }
.audit-row .no { color: var(--color-danger-ink); font-weight: var(--weight-bold); }
.audit-no { margin-left: auto; font-family: var(--font-mono); font-size: 11px; color: var(--color-text-muted); }

/* 活动行（§8.2 单展开的第二半）：40px，20 头像 + 正在运行 … · 12s + 2px Bot 色进度条 */
.act-row {
  position: relative; display: flex; align-items: center; gap: 10px;
  width: 100%; height: 40px; padding: 0 12px; overflow: hidden;
  border: 0; border-radius: var(--radius-md); background: var(--color-surface);
  box-shadow: var(--shadow-card); cursor: pointer; text-align: left;
  animation: enter var(--duration-base) var(--ease-spring) both;
  transition: background var(--duration-hover) var(--ease-out), box-shadow var(--duration-hover) var(--ease-out), transform var(--duration-hover) var(--ease-out);
}
.act-row:hover { background: var(--color-surface-hover); box-shadow: var(--shadow-raise); transform: translateY(-1px); }
.act-row:active { transform: scale(.995); }
.act-row .state-dot { animation: breathe 2.4s var(--ease-in-out) infinite; }
.act-name { font-size: var(--font-size-caption); font-weight: var(--weight-semibold); color: var(--bc-ink); flex: 0 0 auto; }
.act-what { font-size: var(--font-size-caption); color: var(--color-text-secondary); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.act-what code { font-family: var(--font-mono); font-size: var(--font-size-mono); color: var(--color-text-secondary); }
.act-dur { font-family: var(--font-mono); font-size: var(--font-size-mono); color: var(--color-text-muted); font-variant-numeric: tabular-nums; flex: 0 0 auto; }
.act-take { margin-left: auto; flex: 0 0 auto; font-size: 11px; color: var(--color-text-muted); }
.act-bar { position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: var(--color-surface-2); }
.act-bar i { display: block; height: 100%; background: var(--bc); transition: width 900ms linear; }

/* 系统块 / 轮次栅栏 / 任务卡 / Session 分隔 */
.sys-block {
  display: flex; gap: 10px; padding: 12px 16px 12px 18px; border-radius: var(--radius-xl);
  background: var(--color-surface); box-shadow: inset 3px 0 0 var(--color-primary), var(--shadow-card);
  animation: bubbleIn var(--duration-base) var(--ease-spring) both;
}
.sys-tag {
  flex: 0 0 auto; height: 22px; padding: 0 8px; border-radius: var(--radius-sm);
  background: var(--color-primary-soft); color: var(--color-primary-ink);
  font-size: 11px; font-weight: var(--weight-bold); display: inline-flex; align-items: center;
}
.sys-body { min-width: 0; flex: 1; }
.sys-list { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
.sys-list li { font-size: var(--font-size-caption); color: var(--color-text-secondary); display: flex; gap: 8px; align-items: center; }
.sys-list li b { font-weight: var(--weight-semibold); }
.sys-foot { display: flex; align-items: center; gap: 10px; margin-top: 10px; font-size: 11px; color: var(--color-text-muted); flex-wrap: wrap; }

.fence {
  display: flex; align-items: center; gap: 10px; justify-content: center;
  font-size: 11px; color: var(--color-text-muted); font-variant-numeric: tabular-nums;
}
.fence::before, .fence::after { content: ""; height: 1px; flex: 1; background: var(--color-border); }
.fence .dots { display: inline-flex; gap: 3px; }
.fence .dots i { width: 6px; height: 6px; border-radius: var(--radius-full); background: var(--c); }

.session-divider {
  display: flex; align-items: center; gap: 10px; justify-content: center;
  font-size: 11px; color: var(--color-text-muted); animation: enter var(--duration-base) var(--ease-out) both;
}
.session-divider::before, .session-divider::after {
  content: ""; height: 0; flex: 1; border-top: 1px dashed var(--color-border-strong);
}
.session-divider span {
  display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 12px;
  border-radius: var(--radius-full); background: var(--color-surface-2);
  font-weight: var(--weight-semibold); transform-origin: center;
  animation: railIn 240ms var(--ease-spring);
}

.task-card {
  padding: 14px 16px; border-radius: var(--radius-xl); background: var(--color-surface);
  box-shadow: var(--shadow-card); border-left: 3px solid var(--bc);
  animation: bubbleIn var(--duration-fast) var(--ease-spring) both;
}
.task-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.task-no { margin-left: auto; font-family: var(--font-mono); font-size: 11px; color: var(--color-text-muted); }
.task-title { font-size: var(--font-size-body-sm); font-weight: var(--weight-semibold); color: var(--color-text); margin-bottom: 8px; }
.task-status { display: flex; align-items: center; gap: 8px; font-size: var(--font-size-caption); color: var(--color-text-muted); }
.task-report { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--color-border); }
.task-report ul { margin: 0; padding-left: 1.1em; font-size: var(--font-size-caption); color: var(--color-text-secondary); line-height: 1.7; }
/* F3-4「期间发生了什么」：离开再回来时说明这段时间里发生了什么，不补播动画 */
.task-away {
  margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--color-border);
  font-size: var(--font-size-micro); color: var(--color-text-muted); font-variant-numeric: tabular-nums;
}
/* F3-1 会话顶部细提示条：本会话有 N 个任务执行中 */
.task-tipbar {
  display: flex; align-items: center; gap: 8px;
  margin: 0 var(--space-7) 0; padding: 6px 12px;
  border-radius: var(--radius-md); background: var(--color-primary-tint);
  color: var(--color-primary-ink); font-size: var(--font-size-micro); font-weight: var(--weight-medium);
  transition: background var(--duration-hover) var(--ease-out);
}
.task-tipbar:hover { background: var(--color-primary-soft); }

/* 输入区 */
.composer-wrap { padding: 0 var(--space-7) var(--space-5); background: var(--color-bg); }
.composer {
  display: flex; align-items: flex-end; gap: 8px; max-width: var(--composer-max); min-height: 52px;
  margin: 0 auto; padding: 7px 8px 7px 14px; border-radius: var(--radius-pill);
  background: var(--color-surface); box-shadow: var(--shadow-card);
  transition: box-shadow var(--duration-hover) var(--ease-out), transform var(--duration-hover) var(--ease-out), background var(--duration-hover) var(--ease-out);
}
.composer:focus-within { box-shadow: var(--shadow-raise), var(--ring-focus); transform: translateY(-1px); }
.composer.is-locked { background: var(--color-surface-2); box-shadow: none; transform: none; }
.composer.is-locked textarea { color: var(--color-text-faint); }
.composer textarea {
  flex: 1; min-width: 0; border: 0; outline: none; resize: none; background: transparent;
  font-family: inherit; font-size: var(--font-size-body); line-height: 22px;
  color: var(--color-text); padding: 8px 0; max-height: 160px;
}
.composer textarea::placeholder { color: var(--color-text-faint); }
.comp-icon {
  flex: 0 0 auto; width: 28px; height: 28px; border: 0; border-radius: var(--radius-full);
  background: transparent; color: var(--color-text-muted); cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; margin-bottom: 4px;
}
.comp-icon:hover { background: var(--color-surface-hover); }
.comp-send {
  flex: 0 0 auto; width: 36px; height: 36px; border: 0; border-radius: var(--radius-md);
  background: var(--color-primary); color: var(--btn-primary-fg); cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center;
  transition: transform var(--duration-hover) var(--ease-out), background var(--duration-hover) var(--ease-out);
}
.comp-send:hover { background: var(--color-primary-hover); transform: translateY(-1px); }
.comp-send:active { transform: scale(.94); transition-duration: var(--duration-press); }
.comp-send.is-stop { background: var(--color-danger); }
.comp-meta { max-width: var(--composer-max); margin: 8px auto 0; display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--color-text-muted); }


/* 右面板 */
.aside { background: var(--color-surface); overflow-y: auto; padding: var(--space-5) var(--space-5) var(--space-8); min-width: 0; }
/* 抽屉头与遮罩只在窄屏出现；宽屏是常驻栏，不需要关闭按钮 */
.aside-drawer-head { display: none; }
.aside-scrim { display: none; }
/* ≥1280 右面板可收起：网格列归零，主区吃满宽度（用户主动收起时要的是更多流宽） */
.chat.is-aside-collapsed { grid-template-columns: minmax(0, 1fr); }
.chat.is-aside-collapsed .aside { display: none; }
.aside-sec + .aside-sec { margin-top: var(--space-6); }
.aside-sec h4 { font-size: 11px; font-weight: var(--weight-semibold); letter-spacing: var(--tracking-wide); color: var(--color-text-muted); margin-bottom: 10px; }
.person { display: flex; align-items: center; gap: 10px; padding: 5px 0; min-width: 0; }
.person-name { font-size: var(--font-size-caption); font-weight: var(--weight-semibold); color: var(--bc-ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.person .rt-chip { margin-left: auto; }
.kv { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 8px; padding: 4px 0; font-size: var(--font-size-caption); }
.kv .k { color: var(--color-text-muted); font-size: 11px; }
.kv .v { color: var(--color-text-secondary); min-width: 0; }
.aside-card { background: var(--color-surface-2); border-radius: var(--radius-lg); padding: 12px 14px; }

/* ---------------- Bot 详情 ---------------- */
.detail-head { display: flex; gap: var(--space-4); align-items: flex-start; }
.detail-title { font-size: var(--font-size-h1); font-weight: var(--weight-bold); letter-spacing: var(--tracking-snug); line-height: 1.2; }
.detail-sub { margin-top: 6px; font-size: var(--font-size-body-sm); color: var(--color-text-muted); max-width: 640px; }
.detail-meta { display: flex; align-items: center; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
.detail-grid { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: var(--space-6); align-items: start; }
.tabs { display: flex; gap: 4px; margin-bottom: var(--space-5); background: var(--color-surface-2); padding: 4px; border-radius: var(--radius-md); width: fit-content; }
.tab {
  height: 32px; padding: 0 14px; border: 0; border-radius: var(--radius-sm); background: transparent;
  color: var(--color-text-muted); font-size: var(--font-size-caption); font-weight: var(--weight-semibold);
  cursor: pointer; transition: background var(--duration-hover) var(--ease-out), color var(--duration-hover) var(--ease-out);
}
.tab:hover { color: var(--color-text); }
.tab.is-on { background: var(--color-surface); color: var(--color-primary-ink); box-shadow: var(--shadow-card); }

.mem-item { display: flex; gap: 12px; padding: 14px 16px; border-radius: var(--radius-lg); background: var(--color-surface); box-shadow: var(--shadow-card); align-items: flex-start; }
.mem-item + .mem-item { margin-top: 8px; }
.mem-text { font-size: var(--font-size-body-sm); color: var(--color-text); line-height: 1.6; }
.mem-meta { display: flex; gap: 12px; margin-top: 6px; font-size: 11px; color: var(--color-text-muted); flex-wrap: wrap; }
.switch { position: relative; width: 34px; height: 20px; flex: 0 0 auto; border-radius: var(--radius-full); background: var(--color-border-strong); cursor: pointer; border: 0; transition: background var(--duration-hover) var(--ease-out); }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--color-surface); transition: transform var(--duration-hover) var(--ease-spring); }
.switch.is-on { background: var(--color-primary); }
.switch.is-on::after { transform: translateX(14px); }

/* ---------------- 表单 ---------------- */
.field { margin-bottom: var(--space-4); }
.field > label { display: block; margin-bottom: 6px; }
.input, .select, .textarea {
  width: 100%; height: 42px; padding: 0 14px; border-radius: var(--radius-md);
  border: 1px solid var(--color-border-strong); background: var(--color-surface);
  font-family: inherit; font-size: var(--font-size-body-sm); color: var(--color-text);
  transition: box-shadow var(--duration-hover) var(--ease-out), border-color var(--duration-hover) var(--ease-out);
}
.textarea { height: auto; padding: 12px 14px; resize: vertical; line-height: 1.6; }
.input:focus, .select:focus, .textarea:focus { outline: none; border-color: var(--color-primary); box-shadow: var(--ring-focus); }
.input::placeholder, .textarea::placeholder { color: var(--color-text-faint); }
.hint { font-size: 11px; color: var(--color-text-muted); margin-top: 6px; line-height: 1.6; }
.field-err { font-size: 11px; color: var(--color-danger-ink); margin-top: 6px; }
.pick {
  display: flex; align-items: center; gap: 10px; padding: 10px 12px;
  border-radius: var(--radius-md); background: var(--color-surface-2); cursor: pointer;
  transition: background var(--duration-hover) var(--ease-out), box-shadow var(--duration-hover) var(--ease-out);
}
.pick:hover { background: var(--color-surface-hover); }
.pick.is-on { background: var(--color-primary-soft); box-shadow: inset 0 0 0 1px var(--color-primary); }
.pick-list { display: flex; flex-direction: column; gap: 6px; }
.radio-row { display: flex; gap: 8px; flex-wrap: wrap; }
.radio { display: inline-flex; align-items: center; gap: 6px; font-size: var(--font-size-caption); color: var(--color-text-secondary); }

/* ---------------- 设置 / 用量 ---------------- */
.set-grid { display: grid; grid-template-columns: 180px minmax(0, 1fr); gap: var(--space-5); align-items: start; }
.set-nav { display: flex; flex-direction: column; gap: 2px; position: sticky; top: 72px; }
.set-nav button {
  text-align: left; height: 38px; padding: 0 12px; border: 0; border-radius: var(--radius-md);
  background: transparent; color: var(--color-text-secondary); font-size: var(--font-size-caption);
  font-weight: var(--weight-medium); cursor: pointer;
}
.set-nav button:hover { background: var(--color-surface-hover); }
.set-nav button.is-on { background: var(--color-surface-3); color: var(--color-primary-ink); font-weight: var(--weight-bold); }

.bar-track { height: 6px; border-radius: var(--radius-full); background: var(--color-surface-2); overflow: hidden; min-width: 60px; }
.bar-fill { display: block; height: 100%; border-radius: var(--radius-full); background: var(--bc); transform-origin: left; animation: railIn var(--duration-slow) var(--ease-out) both; }

/* ---------------- 向导 ---------------- */
.setup-wrap { min-height: 100vh; display: flex; align-items: flex-start; justify-content: center; padding: var(--space-10) var(--space-6) var(--space-9); background: var(--color-bg); }
.setup-col { width: 100%; max-width: 640px; }
.setup-brand { display: flex; align-items: center; gap: var(--space-3); margin-bottom: var(--space-7); }
.setup-steps { display: flex; align-items: center; gap: 8px; margin-bottom: var(--space-7); }
.setup-step { display: flex; align-items: center; gap: 8px; font-size: var(--font-size-micro); color: var(--color-text-muted); font-weight: var(--weight-semibold); }
.setup-step .n {
  width: 24px; height: 24px; border-radius: var(--radius-full); display: grid; place-items: center;
  background: var(--color-surface-2); color: var(--color-text-muted); font-size: 11px; font-weight: 700;
  transition: background var(--duration-base) var(--ease-out), color var(--duration-base) var(--ease-out), transform var(--duration-base) var(--ease-spring);
}
.setup-step.is-on { color: var(--color-primary-ink); }
.setup-step.is-on .n { background: var(--color-primary); color: var(--btn-primary-fg); transform: scale(1.08); }
.setup-step.is-done { color: var(--color-success-ink); }
.setup-step.is-done .n { background: var(--color-success-soft); color: var(--color-success-ink); }
.setup-step .bar { flex: 1; height: 2px; border-radius: 2px; background: var(--color-border); min-width: 24px; }
.setup-step.is-done + .bar { background: var(--color-success); }
.setup-title { font-size: var(--font-size-h1); font-weight: var(--weight-bold); letter-spacing: var(--tracking-snug); line-height: 1.25; }
.setup-sub { margin-top: 8px; margin-bottom: var(--space-6); font-size: var(--font-size-body-sm); color: var(--color-text-muted); line-height: 1.7; }
.setup-card { background: var(--color-surface); border-radius: var(--radius-xl); box-shadow: var(--shadow-card); overflow: hidden; }
.probe-row { display: flex; align-items: center; gap: 12px; padding: 14px var(--space-5); min-height: 60px; }
.probe-row + .probe-row { border-top: 1px solid var(--color-border); }
.probe-row .nm { font-size: var(--font-size-body-sm); font-weight: var(--weight-semibold); }
.probe-row .sub { font-size: 11px; color: var(--color-text-muted); margin-top: 2px; font-family: var(--font-mono); }
.probe-state { margin-left: auto; font-size: var(--font-size-micro); color: var(--color-text-muted); display: flex; align-items: center; gap: 6px; }
.probe-state.is-ok { color: var(--color-success-ink); }
.probe-state.is-timeout { color: var(--color-warning-ink); }
.probe-state.is-missing { color: var(--color-danger-ink); }
.probe-bar { height: 3px; border-radius: 2px; background: var(--color-surface-2); overflow: hidden; margin-top: 6px; }
.probe-bar i { display: block; height: 100%; border-radius: 2px; background: var(--color-primary); width: 0; transition: width 700ms var(--ease-out); }
.probe-status {
  display: flex; align-items: center; gap: 8px; margin-bottom: 10px;
  font-size: var(--font-size-caption); color: var(--color-text-muted);
}
.probe-status::before {
  content: ""; width: 6px; height: 6px; border-radius: var(--radius-full);
  background: var(--color-primary); animation: breathe 1.6s var(--ease-in-out) infinite;
}
.setup-foot { display: flex; align-items: center; gap: 8px; margin-top: var(--space-6); }

/* ---------------- 弹层 ---------------- */
.overlay {
  position: fixed; inset: 0; z-index: 100; display: grid; place-items: center;
  padding: var(--space-5); background: var(--scrim);
  animation: overlayIn var(--duration-hover) var(--ease-out) both;
}
.overlay.is-closing { animation: overlayIn var(--duration-hover) var(--ease-out) reverse both; }
.modal {
  width: 100%; max-width: 560px; max-height: 88vh; overflow: auto;
  background: var(--color-surface); border-radius: var(--radius-3xl);
  box-shadow: var(--shadow-overlay); padding: var(--space-6);
  animation: modalIn var(--duration-fast) var(--ease-spring) both;
}
.overlay.is-closing .modal { animation: modalOut 140ms var(--ease-out) both; }
.modal-head { display: flex; align-items: center; gap: 8px; margin-bottom: var(--space-5); }
.modal-head h3 { font-size: var(--font-size-h3); font-weight: var(--weight-bold); letter-spacing: var(--tracking-snug); }
.modal-foot { display: flex; align-items: center; gap: 8px; margin-top: var(--space-6); }
.modal-foot .spacer { flex: 1; }
.icon-btn {
  width: 30px; height: 30px; border: 0; border-radius: var(--radius-sm); background: transparent;
  color: var(--color-text-muted); cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
}
.icon-btn:hover { background: var(--color-surface-hover); }
.cap-diff { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-3); }
.cap-box { padding: 12px 14px; border-radius: var(--radius-lg); background: var(--color-surface-2); }
.cap-box h5 { font-size: 11px; font-weight: var(--weight-semibold); margin-bottom: 6px; color: var(--color-text-muted); }
.cap-box.gain h5 { color: var(--color-success-ink); }
.cap-box.loss h5 { color: var(--color-danger-ink); }
.cap-box ul { margin: 0; padding-left: 1.1em; font-size: var(--font-size-caption); color: var(--color-text-secondary); }

/* ---------------- Toast / 演示条 ---------------- */
.toast-wrap { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); z-index: 200; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
.toast {
  background: var(--toast-bg); color: var(--toast-fg);
  padding: 10px 18px; border-radius: var(--radius-md); font-size: var(--font-size-caption);
  box-shadow: var(--shadow-overlay); animation: toastIn var(--duration-base) var(--ease-spring) both;
  max-width: 92vw;
}
.demo-fab {
  position: fixed; right: 20px; bottom: 20px; z-index: 90;
  display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px;
  border: 0; border-radius: var(--radius-full); background: var(--fab-bg); color: var(--fab-fg);
  font-size: var(--font-size-caption); font-weight: var(--weight-semibold); cursor: pointer;
  box-shadow: var(--shadow-overlay); transition: transform var(--duration-hover) var(--ease-out);
}
.demo-fab:hover { transform: translateY(-2px); }
.demo-fab:active { transform: scale(.97); }
.demo-panel {
  position: fixed; right: 20px; bottom: 72px; z-index: 91; width: 360px; max-width: calc(100vw - 40px);
  max-height: 70vh; overflow: auto; background: var(--color-surface);
  border-radius: var(--radius-3xl); box-shadow: var(--shadow-overlay); padding: var(--space-5);
  animation: modalIn var(--duration-fast) var(--ease-spring) both;
}
.demo-panel h4 { font-size: var(--font-size-caption); font-weight: var(--weight-bold); margin-bottom: 10px; }
.demo-line { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.demo-line .u-label { width: 100%; margin-bottom: 2px; }
.demo-panel .chip { box-shadow: none; background: var(--color-surface-2); border-color: transparent; }
.demo-panel .chip.is-on { background: var(--color-primary-soft); border-color: var(--color-primary-soft); }
.demo-panel .chip:hover { background: var(--color-surface-hover); border-color: transparent; }

/* 会话页：浮层让开输入区，避免压住发送按钮与占位提示 */
body.is-chat .toast-wrap { bottom: 112px; }

/* 演示浮钮：统一收进顶栏右侧的 32px 图标位（所有宽度）。
   之前它固定在内容右下角，实测 768px 压住 act-row 2651px²、Bot 卡悬停按钮 1498px²，
   1024px 压住 act-row 2332px² —— 演示控件盖住被演示的功能本身。
   顶栏右侧本来只有主题按钮，多留一个 32px 槽位即可零遮挡。 */
.demo-fab,
body.is-chat:not(.demo-open) .demo-fab {
  top: 12px; bottom: auto; right: 20px;
  width: 32px; height: 32px; padding: 0; justify-content: center; gap: 0;
}
.demo-fab-label { display: none; }
.topbar { padding-right: 60px; }
.demo-panel { top: 56px; bottom: auto; right: 12px; max-height: calc(100vh - 76px); }
@media (max-width: 767px) {
  body.is-chat .toast-wrap { bottom: 140px; }
  .demo-fab, body.is-chat:not(.demo-open) .demo-fab { top: 10px; right: 10px; }
  .topbar { padding-right: 48px; }
  .demo-panel { top: 50px; right: 8px; left: 8px; max-height: calc(100vh - 64px); }
}

/* ---------------- 响应式 ---------------- */
@media (max-width: 1439px) {
  .bot-grid { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
}
@media (max-width: 1279px) {
  :root { --nav-width: var(--nav-width-rail); }
  .brand-text, .nav-label, .nav-count, .sidebar-foot .foot-card span { display: none; }
  .brand { justify-content: center; padding: 0; }
  .nav-item { justify-content: center; padding: 0; }
  .nav-item.is-active::before { left: -3px; }
  .sidebar-foot { align-items: center; }
  .foot-roster { justify-content: center; }
  .bot-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .chat { grid-template-columns: minmax(0, 1fr); }
  /* UX §7：1024–1280 用 64px 图标栏，但必须「悬停展开」——否则只认识图标的老用户
     和第一次来的人都得靠猜。展开是覆盖式（网格列仍是 64，侧栏自身变宽盖在主区上），
     主区不会在悬停时被推来推去。
     注意不能用 var(--nav-width)：该断点下它已被改成 64px，展开值必须是独立常量。 */
  .sidebar {
    --nav-expanded: 240px;
    width: var(--nav-width-rail); overflow: hidden;
    transition: width var(--duration-hover) var(--ease-out), box-shadow var(--duration-hover) var(--ease-out);
  }
  .sidebar:hover, .sidebar:focus-within {
    width: var(--nav-expanded); box-shadow: var(--shadow-raise);
  }
  /* .brand-text 本身是 flex column（品牌名 + 副标题），恢复时必须回到 flex，
     否则 display:inline 会把两行文字压成一行并互相重叠。 */
  .sidebar:hover .brand-text, .sidebar:focus-within .brand-text { display: flex; animation: fadeIn var(--duration-hover) var(--ease-out) both; }
  .sidebar:hover .nav-label, .sidebar:hover .nav-count,
  .sidebar:focus-within .nav-label, .sidebar:focus-within .nav-count {
    display: inline; animation: fadeIn var(--duration-hover) var(--ease-out) both;
  }
  .sidebar:hover .brand, .sidebar:focus-within .brand { justify-content: flex-start; padding: 0 var(--space-2); }
  .sidebar:hover .nav-item, .sidebar:focus-within .nav-item { justify-content: flex-start; padding: 0 var(--space-3); }
