  );
  const body = $(".turn-body", turn);
  const next = speakers[idx + 1];

  if (next) {
    body.insertAdjacentHTML("beforeend",
      '<div class="turn-activity"><span class="led led--running"></span>' +
      esc(botOf(next.id).name) + " · 正在准备 · <span class=\"u-num\">" + "0s" + "</span></div>");
  }

  // 思考折叠行
  body.insertAdjacentHTML("beforeend", evHtml({ type: "thinking", dur: "6s", chars: 168 }));
  body.insertAdjacentHTML("beforeend", evHtml({ type: "message", text: "" }));
  const target = $(".msg-text", body);
  const cursor = document.createElement("span");
  cursor.className = "cursor";
  target.appendChild(cursor);

  // 计时
  let sec = 0;
  const timer = setInterval(() => {
    sec++;
    const dur = $(".turn-right .u-num", turn);
    if (dur) dur.textContent = sec + "s";
    const act = $(".turn-activity .u-num", body);
    if (act) act.textContent = sec + "s";
  }, 1000);

  const full = texts[bot.id] || "这一轮我看了一下上下文，结论是：现有方案可行，但需要在合并前补一个跨运行时的回放测试。";

  streamText(target, full, cursor, () => {
    clearInterval(timer);
    if (rt.streaming) {
      body.insertAdjacentHTML("beforeend", evHtml({ type: "tool_call", name: "Read", target: bot.id === "b2" ? "src/session.ts" : "docs/plan.md" }));
      body.insertAdjacentHTML("beforeend", evHtml({ type: "tool_result", ok: true, summary: "成功 · 31 行输出" }));
    }
    body.insertAdjacentHTML("beforeend", evHtml({ type: "usage", in: 1204, out: 388, mode: "交互", mult: 1 }));
    body.insertAdjacentHTML("beforeend", evHtml({ type: "end", label: "完成", dur: sec + "s" }));
    finishTurn(turn, "完成 · 1.2k/0.4k");
    // 单展开：下一个 Turn 开始前收起
    setTimeout(() => runSpeaker(speakers, idx + 1, c), 700);
  });
}

/* F4：权限卡片 */
/* 归属规则：权限卡片永远属于某一个 Turn，来源必须与该 Turn 的 Bot 一致，
   否则用户会误判是谁在请求授权。这里从流里最后一个 Turn 反查 Bot。 */
function lastTurnBot() {
  const turns = document.querySelectorAll("#stream-inner .turn[data-bot]");
  if (!turns.length) {
    const c = currentChannel();
    return c ? botOf(c.participants ? c.participants[0] : c.botId) : botOf("b1");
  }
  return botOf(turns[turns.length - 1].dataset.bot);
}

function injectPermission(kind) {
  S.permSeq++;
  const no = "A-" + String(S.permSeq).padStart(4, "0");
  const bot = lastTurnBot();
  const rt = rtOf(bot.runtimeId);
  const suffix = kind === "hold" ? " · Assignment A-0141" : " · 第 3 轮";
  const source = bot.name + " · " + rt.name + suffix;
  const ev = kind === "boundary"
    ? { type: "permission", no: no, kind: "boundary", action: "写文件 · Write", target: "/etc/hosts", source: source, botId: bot.id }
    : kind === "hold"
      ? { type: "permission", no: no, kind: "hold", action: "执行命令 · Bash", target: "npm run build && npm test", source: source, botId: bot.id }
      : { type: "permission", no: no, kind: "block", action: "写文件 · Write", target: "~/projects/agentbot/src/auth/session.ts", source: source, botId: bot.id };

  // 卡片必须落在这个 Bot 的 Turn 体内（与事件轨同一坐标系），而不是流尾的兄弟节点
  const turns = document.querySelectorAll("#stream-inner .turn[data-bot]");
  const lastTurn = turns[turns.length - 1];
  const host = lastTurn ? $(".turn-body", lastTurn) : null;
  if (host) host.insertAdjacentHTML("beforeend", evHtml(ev));
  else appendToStream(evHtml(ev));

  // 阻断型卡片绝不能被折叠的 Turn 藏起来：用户被锁住输入框却看不到原因，是最坏的一种死锁
  if (kind === "block" && lastTurn && lastTurn.classList.contains("is-collapsed")) {
    lastTurn.classList.remove("is-collapsed");
    const h = $(".turn-head", lastTurn);
    if (h) h.setAttribute("aria-expanded", "true");
  }
  startCountdowns();
  if (kind === "block") lockComposer(true);
  if (kind === "hold") toast("挂起型：输入框不锁，Session 保持等待");
  if (kind === "boundary") toast("边界拒绝：请求没有转发给运行时");
  scrollStream();
}

function lockComposer(on) {
  const comp = $("#composer");
  if (comp) comp.classList.toggle("is-locked", on);
}

function decidePerm(no, decision) {
  const card = document.querySelector('[data-perm="' + no + '"]');
  if (!card) return;
  const label = { approve: "已批准 · 你", reject: "已拒绝 · 你", remember: "已批准（记住本会话）· 你", forever: "已批准（本 Bot 永久）· 你" }[decision];
  const at = new Date();
  const time = String(at.getHours()).padStart(2, "0") + ":" + String(at.getMinutes()).padStart(2, "0");
  const action = $(".perm-field code", card) ? $(".perm-field code", card).textContent : "";
  const kind = card.dataset.kind;
  const html = permCardHtml({ type: "permission", no: no, state: "decided", decision: label, at: time, action: "已决", target: action });
  const wrap = document.createElement("div");
  wrap.innerHTML = html;
  card.closest(".ev").replaceWith(wrap.firstElementChild);
  if (kind === "block") lockComposer(false);
  toast("决定已回传运行时 · " + label);
}

function startCountdowns() {
  $$(".perm-countdown").forEach((el) => {
    if (el.dataset.started) return;
    el.dataset.started = "1";
    let sec = parseInt(el.dataset.sec || "118", 10);
    const timer = setInterval(() => {
      if (!el.isConnected) { clearInterval(timer); return; }
      sec--;
      el.textContent = sec + "s";
      if (sec <= 15) el.classList.add("is-urgent");
      if (sec <= 0) {
        clearInterval(timer);
        const card = el.closest(".perm-card");
        if (card) {
          const no = card.dataset.perm;
          decidePerm(no, "reject");
          toast("超时自动拒绝 · " + no);
        }
      }
    }, 1000);
  });
}

/* =========================================================================
   21. 事件委托
   ========================================================================= */
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-act]");
  if (!t) return;
  const act = t.dataset.act;
  const v = t.dataset.v;
  const id = t.dataset.id;

  // 卡片点击（内部按钮已处理，避免冒泡重复）
  if (t.classList.contains("bot-card") && e.target.closest("button")) return;

  switch (act) {
    case "noop": e.preventDefault(); toast("原型未实现这个动作"); break;
    case "open-bot": go("/bots/" + id); break;
    case "open-chat": go("/chat/" + id); break;
    case "open-assignment": go("/assignments/" + id); break;
    case "new-bot": modalNewBot(); break;
    case "new-group": modalNewGroup(); break;
    case "new-schedule": modalNewSchedule(); break;
    case "close-modal": closeModal(); break;
    case "modal-bg": if (e.target === t) closeModal(); break;
    case "toggle-demo":
      S.demoOpen = !S.demoOpen;
      // 只切换抽屉与按钮状态：不重渲染，避免丢掉流里刚注入的卡片
      $("#demo-bar").classList.toggle("is-open", S.demoOpen);
      $("#demo-bar").innerHTML = S.demoOpen ? demoBarHtml() : "";
      $$('[data-act="toggle-demo"]').forEach((b) => b.classList.toggle("is-on", S.demoOpen));
      break;
    case "toggle-theme": S.theme = S.theme === "light" ? "dark" : "light"; render(); break;
    case "set-scale": S.scale = v; render(); break;
    case "demo-set":
      S.demo[routeKey(parts())] = v;
      if (v === "empty" && routeKey(parts()) === "bots") { /* 空态仍显示读数条 */ }
      render();
      break;
    case "reset":
      S.bots = JSON.parse(JSON.stringify(BOTS));
      S.channels = JSON.parse(JSON.stringify(CHANNELS));
      S.assignments = JSON.parse(JSON.stringify(ASSIGNMENTS));
      S.schedules = JSON.parse(JSON.stringify(SCHEDULES));
      S.turns = seedTurns();
      S.demo = {}; S.divider = {};
      S.setup = { step: 1, probeStarted: false, detected: [], runtime: "gemini", name: "研究助手", sent: false };
      render(); toast("演示数据已重置"); break;

    case "filter":
      S.filters[t.dataset.k] = v; render(); break;
    case "clear-filters":
      S.filters = { runtime: "all", status: "all", location: "all" }; render(); break;
    case "bot-tab": S.botTab = v; render(); break;
    case "settings-tab": S.settingsTab = v; render(); break;
    case "assign-filter": S.assignFilter = v; render(); break;
    case "usage-range": S.usageRange = v; render(); break;
    case "toggle-memory": toast("记忆注入开关已切换"); break;
    case "add-memory": toast("新增记忆（原型未展开表单）"); break;

    case "toggle-turn": {
      const turn = t.closest(".turn");
      const expanded = t.getAttribute("aria-expanded") === "true";
      t.setAttribute("aria-expanded", String(!expanded));
      turn.classList.toggle("is-collapsed", expanded);
      break;
    }
    case "fold": {
      const expanded = t.getAttribute("aria-expanded") === "true";
      t.setAttribute("aria-expanded", String(!expanded));
      const body = document.getElementById(t.dataset.target);
      if (body) body.classList.toggle("is-open", !expanded);
      break;
    }
    case "fill-prompt": {
      const input = $("#composer-input");
      if (input) { input.value = t.dataset.q; input.focus(); }
      break;
    }
    case "send": handleSend(); break;
    case "stop-stream": {
      setSending(false);
      const live = $$(".turn:not(.is-collapsed)").pop();
      if (live) {
        const head = $(".turn-right", live);
        if (head) head.innerHTML = ledFor("idle") + '<span class="turn-sum">已中断 · 内容保留</span>' + '<span class="turn-chev">▾</span>';
        const cursor = $(".cursor", live);
        if (cursor) cursor.remove();
      }
      groupRunning = false;
      toast("已中断这一轮，已生成内容保留");
      break;
    }
    case "to-assignment": {
      const row = t.closest(".row");
      const text = row ? $(".msg-text", row).textContent : "";
      modalAssignment(text);
      break;
    }
    case "create-assignment": {
      const botId = t.dataset.bot || ($("#as-bot") ? $("#as-bot").value : "b1");
      const title = $("#as-title") ? $("#as-title").value : "新任务";
      closeModal();
      runAssignmentCard(botId, title);
      break;
    }
    case "assign-from-card": modalAssignFromCard(id); break;
    case "inject-assign": runAssignmentCard("b1", "整理这版发布计划的风险"); break;

    case "perm-decide": decidePerm(t.dataset.no, t.dataset.d); break;
    case "inject-perm": injectPermission(v); break;
    case "go-boundary": go("/bots/" + (t.dataset.bot || "b1")); break;
    case "run-group": {
      const c = currentChannel();
      if (c.type !== "group") { toast("这个会话不是群聊"); break; }
      appendUserMessage("这版发布计划还有哪些风险？");
      runGroupRound(c, "这版发布计划还有哪些风险？");
      break;
    }

    case "rebind": modalRebind(id); break;
    case "confirm-rebind": {
      const b = S.bots.find((x) => x.id === id);
      const nextId = $("#rebind-select").value;
      b.runtimeId = nextId;
      const rt = rtOf(nextId);
      b.session = { state: rt.status === "ready" ? "idle" : "unavailable", text: rt.status === "ready" ? "空闲" : "不可用" };
      S.divider[b.id === "b1" ? "d1" : b.id === "b2" ? "d2" : "g1"] = true;
      closeModal();
      render();
      toast("已改绑到 " + rt.name + " · 新 Session 已开始");
      break;
    }

    case "create-group": {
      const name = $("#group-name").value || "新群聊";
      const picked = $$('input[name="gp"]:checked').map((x) => x.value);
      const host = $("#group-host").value;
      if (picked.length < 2) { toast("至少选 2 个参与者"); break; }
      const nid = "g" + (S.channels.length + 1);
      S.channels.unshift({ id: nid, type: "group", name: name, participants: picked, host: host, last: "刚刚创建", time: "刚刚", unread: 0 });
      S.turns[nid] = [];
      closeModal();
      go("/chat/" + nid);
      toast("群聊已创建 · 主持人：" + botOf(host).name);
      break;
    }

    case "create-bot": {
      const name = $("#nb-name").value.trim();
      if (!name) { $("#nb-err").hidden = false; break; }
      if (S.bots.some((b) => b.name === name)) { $("#nb-err").hidden = false; break; }
      const rid = $("#nb-runtime").value;
      S.bots.push({ id: "b" + (S.bots.length + 1), name: name, initial: name.slice(0, 1),
        persona: "负责把技术结论改写成非技术同事能读的段落", runtimeId: rid, location: "local",
        path: "~/projects/agentbot", session: { state: "idle", text: "空闲" }, ago: "刚刚", pending: 0 });
      closeModal(); render(); toast("已创建 " + name);
      break;
    }

    case "create-schedule": {
      const name = $("#sc-name").value || "新定时任务";
      const botId = $("#sc-bot").value;
      const chId = $("#sc-channel").value;
      S.schedules.unshift({ id: "s" + (S.schedules.length + 1), name: name, botId: botId, channelId: chId,
        rule: "每日 09:00", next: "明天 09:00", last: "—", ok: true, enabled: true });
      closeModal(); render();
      toast("已保存 · 下次触发 明天 09:00");
      break;
    }
    case "toggle-schedule": {
      const s = S.schedules.find((x) => x.id === id);
      s.enabled = !s.enabled;
      s.next = s.enabled ? "明天 09:00" : "—";
      render();
      toast(s.enabled ? "已恢复" : "已暂停");
      break;
    }
    case "rerun": toast("已重新排队 · 新任务 " + "A-0143"); break;
    case "reset-token": toast("token 已重置 · 10 秒内断开所有客户端"); break;

    case "pending-chip": go("/chat/g1"); break;

    case "setup-next": S.setup.step = 2; render(); break;
    case "setup-back": S.setup.step = Math.max(1, S.setup.step - 1); S.setup.typed = false; render(); break;
    case "setup-skip": S.setup.step = 2; S.setup.detected = ["zcode", "codex", "cc", "gemini", "dsh"]; render(); break;
    case "setup-runtime": S.setup.runtime = id; render(); break;
    case "probe-retry": toast("重试该项探测（其余项不受影响）"); break;
    case "setup-create": {
      const name = $("#bot-name").value.trim() || "研究助手";
      S.setup.name = name;
      S.setup.step = 3;
      render();
      break;
    }
    case "setup-send": {
      const val = $("#setup-msg").value.trim();
      if (!val) break;
      S.setup.sent = true; S.setup.typed = false;
      render();
      break;
    }
    case "setup-finish":
      S.bots[0].name = S.setup.name;
      S.bots[0].initial = S.setup.name.slice(0, 1);
      go("/bots");
      toast("完成 · 已进入工作台");
      break;
  }
});

document.addEventListener("input", (e) => {
  if (e.target.dataset.act === "setup-name") S.setup.name = e.target.value;
});

document.addEventListener("keydown", (e) => {
  const tag = (e.target.tagName || "").toLowerCase();
  const typing = tag === "input" || tag === "textarea" || tag === "select";
  if (typing) return;

  const blocking = $(".perm-card[data-kind='block']");
  if (blocking && (e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === "a" || e.key === "A")) {
    e.preventDefault(); decidePerm(blocking.dataset.perm, "forever"); return;
  }
  if (blocking && !e.metaKey && !e.ctrlKey) {
    if (e.key === "a" || e.key === "A") {
      if (e.shiftKey) { e.preventDefault(); decidePerm(blocking.dataset.perm, "remember"); }
      else { e.preventDefault(); decidePerm(blocking.dataset.perm, "approve"); }
      return;
    }
    if (e.key === "r" || e.key === "R") { e.preventDefault(); decidePerm(blocking.dataset.perm, "reject"); return; }
  }
  if (e.key === "Escape") { closeModal(); return; }
  if (e.key === "F6") {
    const c = $(".perm-card");
    if (c) { e.preventDefault(); c.scrollIntoView({ block: "center" }); c.setAttribute("tabindex", "-1"); c.focus(); }
  }
});

/* F3：任务卡状态流转 */
function runAssignmentCard(botId, title) {
  const b = botOf(botId);
  const no = "A-" + String(143 + Math.floor(Math.random() * 5)).padStart(4, "0");
  const wrap = appendToStream(
    '<div class="task-card" data-task="' + no + '">' +
    '<div class="task-head"><span class="u-label">Assignment</span><span class="task-no">№ ' + no + "</span></div>" +
    '<div class="task-body"><div class="task-title">' + esc(title) + "</div>" +
    '<div class="task-status" data-ts><span class="led led--queued"></span><span>已排队 · ' + esc(b.name) + " · 0s</span></div>" +
    '<div class="task-report" hidden data-tr></div>' +
    "</div></div>"
  );
  scrollStream();

  setTimeout(() => {
    const st = $("[data-ts]", wrap);
    if (!st) return;
    st.innerHTML = '<span class="led led--running"></span><span>执行中 · ' + esc(b.name) + ' · 12s · 正在读 docs/plan.md</span>';
  }, 1600);

  setTimeout(() => {
    const st = $("[data-ts]", wrap);
    if (!st) return;
    st.innerHTML = '<span class="led led--done"></span><span>已完成 · ' + esc(b.name) + " · 1m 12s</span>";
    const tr = $("[data-tr]", wrap);
    tr.hidden = false;
    tr.innerHTML = "<div class=\"u-label\" style=\"margin-bottom:4px\">报告摘要</div>" +
      "<ul><li>三处风险已按影响面排序，第一条会推迟发布一天。</li><li>涉及 2 个文件的改动建议，未直接修改。</li></ul>" +
      '<div class="usage-line">1,204 in / 388 out · 交互 ×1</div>' +
      '<button class="btn btn-sm" style="margin-top:8px" data-act="open-assignment" data-id="a-0142">查看完整报告</button>';
    toast("任务完成 · 报告已回贴");
    scrollStream();
  }, 5200);
}

/* 全局：Turn 吸顶阴影 & 初始化 */
window.addEventListener("scroll", () => {}, { passive: true });

if (!location.hash) location.hash = "#/bots";
render();
</script>
