<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentBot · 本地工作台</title>
<style>
/* ==========================================================================
   令牌 —— 原样内联自 ../agentbot-tokens.css（源文件 147 行 / 89 个自定义属性）
   为保证双击即可离线打开，不依赖相对路径加载；数值一字未改。
   ========================================================================== */
:root {
  --color-surface-0: #E4EAEC;
  --color-surface-1: #DDE4E7;
  --color-surface-2: #F8FAFB;
  --color-surface-3: #FFFFFF;

  --color-fg-1: #12191B;
  --color-fg-2: #3E4B4E;
  --color-fg-3: #586568;
  --color-fg-4: #727F83;

  --color-border-1: #D2DBDE;
  --color-border-2: #B4C0C4;
  --color-border-3: #6E7C80;

  --color-accent: #0B6E69;
  --color-accent-hover: #085C58;
  --color-accent-active: #064B48;
  --color-accent-fg: #F8FAFB;
  --color-accent-weak-bg: #D3E6E3;
  --color-accent-weak-fg: #0A5C58;

  --color-success: #26713A;  --color-success-fg: #FFFFFF;
  --color-warning: #8A5A00;  --color-warning-fg: #FFFFFF;
  --color-danger:  #B33127;  --color-danger-fg:  #FFFFFF;
  --color-info:    #456681;  --color-info-fg:    #FFFFFF;

  --color-led-running: #0A847C;
  --color-led-idle:    #68767A;
  --color-led-queued:  #4A6C82;
  --color-led-pending: #A87200;
  --color-led-failed:  #B33127;
  --color-led-done:    #26713A;

  --font-sans: "IBM Plex Sans", "Segoe UI Variable Text", "Segoe UI",
               "Noto Sans SC", "Microsoft YaHei UI", -apple-system, sans-serif;
  --font-mono: "IBM Plex Mono", "Cascadia Mono", Consolas, "SF Mono",
               "Noto Sans Mono", monospace;

  --text-2xs: 10px; --leading-2xs: 14px;
  --text-xs:  11px; --leading-xs:  16px;
  --text-sm:  12px; --leading-sm:  18px;
  --text-md:  13px; --leading-md:  20px;
  --text-lg:  15px; --leading-lg:  22px;
  --text-xl:  20px; --leading-xl:  26px;
  --text-2xl: 26px; --leading-2xl: 32px;
  --text-3xl: 34px; --leading-3xl: 40px;
  --weight-regular: 400; --weight-medium: 500; --weight-semi: 600;
  --tracking-label: 0.08em;

  --space-0: 2px;  --space-1: 4px;  --space-2: 6px;  --space-3: 8px;
  --space-4: 12px; --space-5: 16px; --space-6: 20px; --space-7: 24px;
  --space-8: 32px; --space-9: 40px; --space-10: 48px; --space-11: 64px;

  --radius-sm: 2px;
  --radius-md: 3px;
  --radius-lg: 4px;

  --border-hairline: 1px; --border-strong: 2px; --border-marker: 3px;

  --shadow-overlay: 0 4px 12px rgba(18, 25, 27, .14);
  --shadow-sticky:  0 1px 0 var(--color-border-1);

  --layout-sidebar: 240px; --layout-sidebar-rail: 64px; --layout-context: 320px;
  --layout-header: 64px;
  --layout-card-h: 172px;  --layout-row: 36px;
  --layout-label-col: 64px; --layout-measure: 68ch;

  --duration-instant: 120ms; --duration-quick: 180ms; --duration-state: 240ms;
  --duration-breathe: 2000ms; --duration-blink: 1400ms;
  --ease-out: cubic-bezier(.2, .8, .3, 1);

  --focus-ring: 0 0 0 2px var(--color-surface-2), 0 0 0 4px var(--color-accent);
  --focus-ring-inset: inset 0 0 0 1px var(--color-accent);
}

[data-theme="dark"] {
  --color-surface-0: #0F1517; --color-surface-1: #0A1011;
  --color-surface-2: #1C2528; --color-surface-3: #232E31;

  --color-fg-1: #E4EBEC; --color-fg-2: #B7C3C5;
  --color-fg-3: #8D9B9E; --color-fg-4: #5F6D70;

  --color-border-1: #2A3639; --color-border-2: #3A484B; --color-border-3: #6B7B7E;

  --color-accent: #3FB3A8; --color-accent-hover: #52C2B7;
  --color-accent-active: #2E9A90;
  --color-accent-fg: #0F1517;
  --color-accent-weak-bg: #12312F; --color-accent-weak-fg: #5CC8BD;

  --color-success: #3FAE79; --color-warning: #D8A03A;
  --color-danger:  #E8756A; --color-info:    #6E9AB5;
  --color-success-fg: #0F1517; --color-warning-fg: #0F1517;
  --color-danger-fg:  #0F1517; --color-info-fg:    #0F1517;

  --color-led-running: #3FB3A8; --color-led-idle:    #8A989C;
  --color-led-queued:  #6E9AB5; --color-led-pending: #D8A03A;
  --color-led-failed:  #E8756A; --color-led-done:    #3FAE79;

  --shadow-overlay: 0 4px 12px rgba(0, 0, 0, .55);
}

[data-text-scale="lg"] {
  --text-2xs: 11px; --text-xs: 12px; --text-sm: 13px; --text-md: 15px;
  --text-lg: 17px;  --text-xl: 22px; --text-2xl: 29px; --text-3xl: 38px;
}
[data-text-scale="xl"] {
  --text-2xs: 12px; --text-xs: 14px; --text-sm: 15px; --text-md: 16px;
  --text-lg: 19px;  --text-xl: 25px; --text-2xl: 33px; --text-3xl: 42px;
}

.u-num {
  font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
  font-feature-settings: "tnum" 1;
}
.u-label {
  font-family: var(--font-sans); font-size: var(--text-2xs);
  line-height: var(--leading-2xs); letter-spacing: var(--tracking-label);
  text-transform: uppercase; font-weight: var(--weight-semi);
  color: var(--color-fg-3);
}

@media (prefers-reduced-motion: reduce) {
  :root {
    --duration-instant: 0ms; --duration-quick: 0ms; --duration-state: 0ms;
    --duration-breathe: 0ms; --duration-blink: 0ms;
  }
}

/* ==========================================================================
   基础
   ========================================================================== */
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--color-surface-0);
  color: var(--color-fg-1);
  font-family: var(--font-sans);
  font-size: var(--text-md);
  line-height: var(--leading-md);
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus { outline: none; }
:focus-visible { box-shadow: var(--focus-ring); border-radius: var(--radius-sm); }
input, textarea, select { font: inherit; color: inherit; }
h1,h2,h3,h4 { margin: 0; font-weight: var(--weight-semi); }
p { margin: 0; }
code { font-family: var(--font-mono); font-size: var(--text-sm); }
::selection { background: var(--color-accent-weak-bg); color: var(--color-accent-weak-fg); }

/* 滚动条：细，不抢视线 */
* { scrollbar-width: thin; scrollbar-color: var(--color-border-2) transparent; }
*::-webkit-scrollbar { width: 10px; height: 10px; }
*::-webkit-scrollbar-thumb { background: var(--color-border-2); border: 3px solid transparent; background-clip: content-box; border-radius: var(--radius-sm); }
*::-webkit-scrollbar-track { background: transparent; }

/* ==========================================================================
   外壳
   ========================================================================== */
.shell { display: grid; grid-template-columns: var(--layout-sidebar) 1fr; min-height: 100vh; }

.sidebar {
  background: var(--color-surface-1);
  border-right: var(--border-hairline) solid var(--color-border-1);
  display: flex; flex-direction: column;
  position: sticky; top: 0; height: 100vh;
  overflow: hidden;
}
.brand {
  height: var(--layout-header); flex: 0 0 var(--layout-header);
  display: flex; align-items: center; gap: var(--space-3);
  padding: 0 var(--space-5);
  border-bottom: var(--border-hairline) solid var(--color-border-1);
}
.brand-mark {
  width: 22px; height: 22px; border: var(--border-hairline) solid var(--color-accent);
  display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr;
  gap: 1px; padding: 3px; border-radius: var(--radius-sm); flex: none;
}
.brand-mark i { background: var(--color-accent); display: block; }
.brand-mark i:nth-child(2) { opacity: .45; }
.brand-mark i:nth-child(3) { opacity: .45; }
.brand-name { font-size: var(--text-md); font-weight: var(--weight-semi); letter-spacing: .02em; }
.brand-sub { font-size: var(--text-2xs); color: var(--color-fg-3); letter-spacing: var(--tracking-label); text-transform: uppercase; }

.nav { padding: var(--space-3) 0; flex: 1; overflow-y: auto; }
.nav-item {
  position: relative; display: flex; align-items: center; gap: var(--space-3);
  height: 32px; padding: 0 var(--space-5); margin: 0 0 1px;
  font-size: var(--text-md); color: var(--color-fg-2);
  transition: background var(--duration-instant) var(--ease-out);
}
.nav-item:hover { background: var(--color-surface-0); }
.nav-item.is-active { background: var(--color-accent-weak-bg); color: var(--color-fg-1); font-weight: var(--weight-medium); }
.nav-item.is-active::before {
  content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--color-accent);
}
.nav-item svg { flex: none; color: var(--color-fg-3); }
.nav-item.is-active svg { color: var(--color-accent); }
.nav-count {
  margin-left: auto; font-family: var(--font-mono); font-size: var(--text-xs);
  color: var(--color-fg-3); font-variant-numeric: tabular-nums;
}
.nav-count.is-alert { color: var(--color-warning); font-weight: var(--weight-semi); }

.sidebar-foot {
  border-top: var(--border-hairline) solid var(--color-border-1);
  padding: var(--space-3) var(--space-5);
  display: grid; gap: var(--space-1);
}
.foot-read { display: flex; align-items: center; gap: var(--space-2); font-size: var(--text-xs); color: var(--color-fg-3); }
.foot-read b { font-family: var(--font-mono); color: var(--color-fg-2); font-weight: var(--weight-medium); }

.main { min-width: 0; display: flex; flex-direction: column; min-height: 100vh; }

.topbar {
  height: 44px; flex: 0 0 44px;
  display: flex; align-items: center; gap: var(--space-4);
  padding: 0 var(--space-7);
  background: var(--color-surface-1);
  border-bottom: var(--border-hairline) solid var(--color-border-1);
  position: sticky; top: 0; z-index: 30;
}
.crumb { display: flex; align-items: center; gap: var(--space-2); font-size: var(--text-sm); color: var(--color-fg-3); }
.crumb b { color: var(--color-fg-1); font-weight: var(--weight-medium); }
.crumb .sep { color: var(--color-border-3); }
.topbar-spacer { flex: 1; }

.chip-pending {
  display: inline-flex; align-items: center; gap: var(--space-2);
  height: 24px; padding: 0 var(--space-3);
  border: var(--border-hairline) solid var(--color-warning);
  color: var(--color-warning); border-radius: var(--radius-sm);
  font-size: var(--text-xs); font-weight: var(--weight-medium);
  background: color-mix(in srgb, var(--color-warning) 8%, var(--color-surface-1));
}
.chip-pending:hover { background: color-mix(in srgb, var(--color-warning) 14%, var(--color-surface-1)); }

.icon-btn {
  width: 28px; height: 28px; display: grid; place-items: center;
  border: var(--border-hairline) solid transparent; border-radius: var(--radius-md);
  color: var(--color-fg-3);
}
.icon-btn:hover { background: var(--color-surface-0); border-color: var(--color-border-1); color: var(--color-fg-1); }
.icon-btn.is-on { color: var(--color-accent); border-color: var(--color-accent); }

.page { padding: var(--space-7); max-width: 1440px; width: 100%; }
.page--flush { padding: 0; max-width: none; }

/* ==========================================================================
   通用件
   ========================================================================== */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2);
  height: 32px; padding: 0 var(--space-4); border-radius: var(--radius-md);
  font-size: var(--text-md); font-weight: var(--weight-medium);
  border: var(--border-hairline) solid var(--color-border-2);
  background: transparent; color: var(--color-fg-2);
  transition: background var(--duration-instant) var(--ease-out), border-color var(--duration-instant) var(--ease-out), color var(--duration-instant) var(--ease-out);
  white-space: nowrap;
}
.btn:hover { border-color: var(--color-border-3); color: var(--color-fg-1); background: var(--color-surface-1); }
.btn:active { background: var(--color-surface-0); }
.btn:disabled { background: var(--color-surface-1); color: var(--color-fg-4); border-color: transparent; cursor: not-allowed; }
.btn-primary { background: var(--color-accent); border-color: var(--color-accent); color: var(--color-accent-fg); }
.btn-primary:hover { background: var(--color-accent-hover); border-color: var(--color-accent-hover); color: var(--color-accent-fg); }
.btn-primary:active { background: var(--color-accent-active); border-color: var(--color-accent-active); }
.btn-primary:disabled { background: var(--color-surface-1); color: var(--color-fg-4); border-color: transparent; }
.btn-danger { border-color: var(--color-danger); color: var(--color-danger); }
.btn-danger:hover { background: var(--color-danger); border-color: var(--color-danger); color: var(--color-danger-fg); }
.btn-sm { height: 28px; padding: 0 var(--space-3); font-size: var(--text-sm); }
.btn-xs { height: 22px; padding: 0 var(--space-2); font-size: var(--text-xs); border-radius: var(--radius-sm); }
.btn-ghost { border-color: transparent; }
.btn-ghost:hover { background: var(--color-surface-1); border-color: transparent; }
.btn.is-loading { position: relative; color: transparent; }
.btn.is-loading::before {
  content: ""; position: absolute; width: 8px; height: 8px; background: var(--color-accent-fg);
  animation: pulse 900ms ease-in-out infinite;
}
kbd {
  font-family: var(--font-mono); font-size: var(--text-2xs); line-height: 1;
  padding: 2px 4px; border: var(--border-hairline) solid currentColor; border-radius: var(--radius-sm);
  opacity: .72;
}

/* 页头读数条 */
.page-head {
  display: flex; align-items: flex-start; gap: var(--space-5);
  padding-bottom: var(--space-4); border-bottom: var(--border-hairline) solid var(--color-border-1);
  margin-bottom: var(--space-5);
}
.page-title { font-size: var(--text-2xl); line-height: var(--leading-2xl); letter-spacing: -.01em; }
.page-desc { font-size: var(--text-sm); color: var(--color-fg-3); margin-top: var(--space-1); max-width: 62ch; }
.page-head .spacer { flex: 1; }

.readbar { display: flex; align-items: center; gap: var(--space-5); }
.read-group { display: flex; flex-direction: column; gap: 1px; padding-right: var(--space-5); border-right: var(--border-hairline) solid var(--color-border-1); }
.read-group:last-child { border-right: 0; padding-right: 0; }
.read-num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: var(--text-xl); line-height: var(--leading-xl); font-weight: var(--weight-semi); color: var(--color-fg-1); }
.read-num.is-accent { color: var(--color-accent); }
.read-num.is-warning { color: var(--color-warning); }

/* 筛选条 */
.filters {
  display: flex; align-items: center; gap: var(--space-5); flex-wrap: wrap;
  min-height: 40px; padding-bottom: var(--space-4);
  border-bottom: var(--border-hairline) solid var(--color-border-1);
  margin-bottom: var(--space-5);
}
.filter-group { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; }
.filter-group > .u-label { margin-right: var(--space-1); }
.chip {
  height: 24px; padding: 0 var(--space-3); display: inline-flex; align-items: center; gap: var(--space-1);
  font-size: var(--text-xs); color: var(--color-fg-2);
  border: var(--border-hairline) solid var(--color-border-2); border-radius: var(--radius-sm);
  background: transparent;
}
.chip:hover { border-color: var(--color-border-3); color: var(--color-fg-1); }
.chip.is-on { background: var(--color-accent-weak-bg); border-color: var(--color-accent); color: var(--color-fg-1); font-weight: var(--weight-medium); }
.filters .spacer { flex: 1; }
.filter-count { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--color-fg-3); }

/* 指示灯 */
.led { width: 6px; height: 6px; display: inline-block; flex: none; border-radius: var(--radius-sm); }
.led--running { background: var(--color-led-running); animation: breathe var(--duration-breathe) ease-in-out infinite; }
.led--idle { background: var(--color-led-idle); }
.led--queued { background: var(--color-led-queued); }
.led--pending { background: var(--color-led-pending); animation: blink var(--duration-blink) steps(2) infinite; }
.led--failed { background: var(--color-led-failed); }
.led--done { background: var(--color-led-done); }
@keyframes breathe { 0%,100% { opacity: 1; } 50% { opacity: .42; } }
@keyframes blink { 50% { opacity: .18; } }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .2; } }

/* 能力徽标 */
.badge {
  display: inline-flex; align-items: center; height: 20px; padding: 0 var(--space-2);
  font-family: var(--font-mono); font-size: var(--text-xs); line-height: 1;
  border-radius: var(--radius-sm); white-space: nowrap;
}
.badge--yes { border: var(--border-hairline) solid var(--color-accent); color: var(--color-accent); }
.badge--no { border: var(--border-hairline) solid var(--color-border-2); color: var(--color-fg-3); }
.badge--unknown { border: 1px dashed var(--color-border-3); color: var(--color-fg-3); }

.cap-row { display: flex; align-items: center; gap: var(--space-5); flex-wrap: wrap; }
.cap { display: inline-flex; align-items: center; gap: var(--space-2); }
.cap .u-label { min-width: 52px; }

/* 方牌（Bot 首字） */
.sq {
  width: 20px; height: 20px; flex: none; display: grid; place-items: center;
  font-family: var(--font-mono); font-size: var(--text-xs); font-weight: var(--weight-semi);
  border: var(--border-hairline) solid var(--color-accent); border-radius: var(--radius-sm);
  color: var(--color-accent); background: color-mix(in srgb, var(--color-accent) 7%, var(--color-surface-2));
  line-height: 1;
}
.sq--lg { width: 34px; height: 34px; font-size: var(--text-md); }
.sq--b1 { background: color-mix(in srgb, var(--color-accent) 10%, var(--color-surface-2)); }
.sq--b2 { background: color-mix(in srgb, var(--color-accent) 20%, var(--color-surface-2)); }
.sq--b3 { background: color-mix(in srgb, var(--color-accent) 30%, var(--color-surface-2)); }
.sq--b4 { background: color-mix(in srgb, var(--color-accent) 6%, var(--color-surface-2)); }
.sq--b5 { background: color-mix(in srgb, var(--color-accent) 38%, var(--color-surface-2)); }

/* 表格 */
.table { width: 100%; border-collapse: collapse; font-size: var(--text-sm); }
.table thead th {
  height: 32px; background: var(--color-surface-1);
  font-family: var(--font-sans); font-size: var(--text-2xs); letter-spacing: var(--tracking-label);
  text-transform: uppercase; font-weight: var(--weight-semi); color: var(--color-fg-3);
  text-align: left; padding: 0 var(--space-4); border-bottom: var(--border-hairline) solid var(--color-border-1);
  white-space: nowrap;
}
.table thead th.num { text-align: right; }
.table tbody td { height: var(--layout-row); padding: 0 var(--space-4); border-bottom: var(--border-hairline) solid var(--color-border-1); color: var(--color-fg-2); vertical-align: middle; }
.table tbody td.num { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.table tbody tr:hover td { background: var(--color-surface-1); }
.table tbody tr.is-dim td { opacity: .6; }
.table tfoot td { height: 40px; padding: 0 var(--space-4); border-top: var(--border-strong) solid var(--color-border-3); font-family: var(--font-mono); font-variant-numeric: tabular-nums; color: var(--color-fg-1); font-weight: var(--weight-medium); }
.table tfoot td.num { text-align: right; }
.ticks { display: flex; gap: var(--space-3); width: 40px; margin-top: 2px; justify-content: flex-end; }
.ticks i { display: block; width: 1px; height: 4px; background: var(--color-border-3); }

/* 表格在窄屏改为堆叠行（不产生横向滚动） */
.table-wrap { width: 100%; overflow-x: auto; }
@media (max-width: 640px) {
  .table-wrap { overflow-x: visible; }
  .table--stackable thead { display: none; }
  .table--stackable, .table--stackable tbody, .table--stackable tfoot { display: block; width: 100%; }
  .table--stackable tbody tr, .table--stackable tfoot tr {
    display: block; padding: var(--space-2) 0; border-bottom: var(--border-hairline) solid var(--color-border-1);
  }
  .table--stackable tfoot tr { border-top: var(--border-strong) solid var(--color-border-3); }
  .table--stackable tbody td, .table--stackable tfoot td {
    display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-4);
    height: auto; min-height: 22px; padding: 1px var(--space-3); border: 0;
    text-align: right; font-size: var(--text-sm);
  }
  .table--stackable tbody td::before, .table--stackable tfoot td::before {
    content: attr(data-label); flex: none;
    font-family: var(--font-sans); font-size: var(--text-2xs); letter-spacing: var(--tracking-label);
    text-transform: uppercase; color: var(--color-fg-3); font-weight: var(--weight-semi);
    text-align: left;
  }
  .table--stackable td:empty { display: none; }
  .table--stackable td.num { text-align: right; }
  .table--stackable .ticks { display: none; }
  /* 窄屏隐藏次要列：用量只留两个数值（UX §7） */
  .table--stackable td.col-opt, .table--stackable th.col-opt { display: none; }
  .table--stackable td[data-label=""]::before { content: none; }
}

/* 空态 / 骨架 */
.empty { border-top: var(--border-hairline) solid var(--color-border-1); padding-top: var(--space-7); max-width: 52ch; }
.empty h3 { font-size: var(--text-xl); line-height: var(--leading-xl); margin-bottom: var(--space-2); }
.empty p { font-size: var(--text-md); color: var(--color-fg-3); margin-bottom: var(--space-5); }
.empty .empty-alt { font-size: var(--text-sm); color: var(--color-fg-3); }
.sk { background: var(--color-surface-1); border-radius: var(--radius-sm); animation: pulse 1.6s ease-in-out infinite; }
.sk-line { height: 10px; }

.banner {
  display: flex; align-items: center; gap: var(--space-3);
  min-height: 40px; padding: var(--space-2) var(--space-4);
  border: var(--border-hairline) solid var(--color-danger);
  background: color-mix(in srgb, var(--color-danger) 7%, var(--color-surface-0));

  margin-bottom: var(--space-5);
}
.banner .spacer { flex: 1; }
.banner--info { border-color: var(--color-info); background: color-mix(in srgb, var(--color-info) 7%, var(--color-surface-0)); }

/* 通知 */
.toast-wrap { position: fixed; right: var(--space-7); bottom: var(--space-7); display: grid; gap: var(--space-2); z-index: 90; }
.toast {
  background: var(--color-surface-3); border: var(--border-hairline) solid var(--color-border-2);
  border-left: var(--border-marker) solid var(--color-accent);
  padding: var(--space-3) var(--space-4); border-radius: var(--radius-md);
  font-size: var(--text-sm); max-width: 340px;
  animation: toastIn var(--duration-quick) var(--ease-out);
}
@keyframes toastIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* ==========================================================================
   Bot 卡片（S3 核心：锁高 172px + 64px 标签列 → 跨卡读数共线）
   ========================================================================== */
.bot-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: var(--space-5); }
.bot-card {
  position: relative;
  height: var(--layout-card-h);
  padding: var(--space-4);
  background: var(--color-surface-2);
  border: var(--border-hairline) solid var(--color-border-1);
  border-radius: var(--radius-md);
  display: flex; flex-direction: column;
  cursor: pointer;
  transition: border-color var(--duration-instant) var(--ease-out), background var(--duration-instant) var(--ease-out);
}
.bot-card:hover { border-color: var(--color-border-3); }
.bot-card:hover::before { content: ""; position: absolute; left: -1px; top: -1px; bottom: -1px; width: 2px; background: var(--color-accent); border-radius: var(--radius-md) 0 0 var(--radius-md); }
.bot-card.is-unavailable { padding-top: 36px; }
.bc-banner {
  position: absolute; left: 0; right: 0; top: 0; height: 24px;
  display: flex; align-items: center; gap: var(--space-2); padding: 0 var(--space-3);
  background: color-mix(in srgb, var(--color-danger) 8%, var(--color-surface-2));
  border-bottom: var(--border-hairline) solid color-mix(in srgb, var(--color-danger) 30%, var(--color-surface-2));
  color: var(--color-danger); font-size: var(--text-xs); border-radius: var(--radius-md) var(--radius-md) 0 0;
}
.bc-head { height: 44px; display: flex; align-items: flex-start; justify-content: space-between; gap: var(--space-3); flex: none; }
.bc-id { display: flex; align-items: center; gap: var(--space-3); min-width: 0; }
.bc-name { font-size: var(--text-lg); font-weight: var(--weight-semi); line-height: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bc-status { display: inline-flex; align-items: center; gap: var(--space-1); font-size: var(--text-xs); color: var(--color-fg-3); white-space: nowrap; padding-top: 3px; }
.bc-actions { position: absolute; right: var(--space-3); top: var(--space-3); display: flex; gap: var(--space-1); opacity: 0; pointer-events: none; background: var(--color-surface-2); padding-left: var(--space-2); }
.bot-card:hover .bc-actions, .bot-card:focus-within .bc-actions { opacity: 1; pointer-events: auto; }
.bot-card:hover .bc-status { opacity: 0; }
.bc-div { height: 1px; background: var(--color-border-1); margin: 0 calc(-1 * var(--space-4)) var(--space-1); flex: none; }
.bot-card.is-unavailable .bc-head { height: 32px; }
.bc-persona {
  height: 20px; line-height: 20px; font-size: var(--text-sm); color: var(--color-fg-3);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: none;
}
.bc-reads { display: grid; grid-template-rows: repeat(3, 1fr); flex: 1; min-height: 0; }
.bot-card.is-unavailable .bc-head { height: 32px; }
.bc-read { display: grid; grid-template-columns: var(--layout-label-col) 1fr; align-items: center; min-width: 0; }
.bc-label { white-space: nowrap; }
.bc-val {
  font-family: var(--font-mono); font-size: var(--text-sm); color: var(--color-fg-2);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  display: flex; align-items: center; gap: var(--space-1);
}
.bc-val .dot { color: var(--color-border-3); }
/* 路径中段省略：保留类型前缀与末段（最可辨识的两头），中段收缩 */
.bc-path { display: flex; min-width: 0; align-items: baseline; gap: 0; }
.bc-path .p-head { flex: none; padding-right: 4px; }
.bc-path .p-mid { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bc-path .p-tail { flex: none; }

/* ==========================================================================
   会话
   ========================================================================== */
.chat-layout { display: grid; grid-template-columns: 1fr var(--layout-context); height: calc(100vh - 44px); min-height: 0; }
.chat-main { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--color-surface-0); }

.chat-head {
  height: 48px; flex: 0 0 48px;
  display: flex; align-items: center; gap: var(--space-3);
  padding: 0 var(--space-6);
  border-bottom: var(--border-hairline) solid var(--color-border-1);
  background: var(--color-surface-0);
}
.chat-title { font-size: var(--text-md); font-weight: var(--weight-semi); }
.chat-meta { font-size: var(--text-xs); color: var(--color-fg-3); display: flex; align-items: center; gap: var(--space-2); }
.chat-head .spacer { flex: 1; }
.stack-sq { display: flex; }
.stack-sq .sq { margin-left: -4px; }
.stack-sq .sq:first-child { margin-left: 0; }

.stream { flex: 1; overflow-y: auto; position: relative; min-height: 0; scroll-behavior: smooth; overscroll-behavior: contain; }
.stream-inner { padding: var(--space-4) var(--space-6) var(--space-9) 64px; position: relative; max-width: 980px; }
/* 事件轨：贯穿整段对话的 1px 线，挂在内容容器上才会随内容一起延伸 */
.stream-inner::before {
  content: ""; position: absolute; left: 40px; top: 0; bottom: 0; width: 1px;
  background: var(--color-border-1); z-index: 0;
}
.stream-inner > * { position: relative; }

.row { position: relative; }
.ev-sym {
  position: absolute; left: -44px; top: 0; width: 40px;
  display: flex; justify-content: center;
  font-family: var(--font-mono); font-size: var(--text-sm); line-height: 20px;
  padding-top: 2px;
}
.ev-sym span { background: var(--color-surface-0); padding: 0 2px; position: relative; z-index: 1; }

.turn { position: relative; margin-bottom: var(--space-4); }
.turn-head {
  position: sticky; top: 0; z-index: 6;
  height: 36px; display: flex; align-items: center; gap: var(--space-2);
  padding: 0 var(--space-3) 0 calc(44px + var(--space-3));
  margin-left: -44px;
  background: var(--color-surface-3);
  border-bottom: var(--border-hairline) solid var(--color-border-1);
  border-radius: var(--radius-sm) var(--radius-sm) 0 0;
  cursor: pointer;
}
.turn-head:hover { background: var(--color-surface-1); }
.turn.is-scrolled .turn-head { box-shadow: var(--shadow-sticky); }
.turn-name { font-size: var(--text-md); font-weight: var(--weight-semi); }
.rt-badge {
  font-size: var(--text-xs); color: var(--color-fg-3); font-family: var(--font-mono);
  border: var(--border-hairline) solid var(--color-border-1); border-radius: var(--radius-sm);
  padding: 0 var(--space-1); line-height: 14px;
}
.turn-mode { font-size: var(--text-xs); color: var(--color-fg-3); }
.turn-right { margin-left: auto; display: flex; align-items: center; gap: var(--space-2); font-size: var(--text-xs); color: var(--color-fg-3); }
.turn-sum { color: var(--color-fg-2); }
.turn-chev { color: var(--color-fg-3); transition: transform var(--duration-instant) var(--ease-out); font-size: var(--text-2xs); }
.turn.is-collapsed .turn-chev { transform: rotate(-90deg); }
.turn.is-collapsed .turn-body { display: none; }
.turn-body { padding: var(--space-3) 0 var(--space-4); }

.turn-activity {
  display: flex; align-items: center; gap: var(--space-2);
  height: 28px; padding: 0 var(--space-3);
  font-size: var(--text-xs); color: var(--color-fg-3);
  border-left: var(--border-strong) solid var(--color-border-2);
  margin-bottom: var(--space-2); background: var(--color-surface-1);
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
}

.ev { position: relative; }
.ev-fold { display: flex; align-items: center; gap: var(--space-2); width: 100%; height: 28px; padding: 0 var(--space-2); border-radius: var(--radius-sm); text-align: left; font-size: var(--text-xs); color: var(--color-fg-3); }
.ev-fold:hover { background: var(--color-surface-1); }
.ev-fold:focus-visible { box-shadow: var(--focus-ring-inset); }
.ev-fold .ev-sum { color: var(--color-fg-2); font-family: var(--font-mono); }
.ev-fold .ev-chev { margin-left: auto; font-size: var(--text-2xs); transition: transform var(--duration-instant) var(--ease-out); }
.ev-fold[aria-expanded="true"] .ev-chev { transform: rotate(90deg); }
.ev-body { display: none; margin: var(--space-1) 0 var(--space-2); padding: var(--space-3) var(--space-4); background: var(--color-surface-1); border-radius: var(--radius-sm); font-family: var(--font-mono); font-size: var(--text-sm); line-height: var(--leading-sm); color: var(--color-fg-2); white-space: pre-wrap; word-break: break-word; border-left: var(--border-hairline) solid var(--color-border-2); }
.ev-body.is-open { display: block; }
.ev--indent { padding-left: var(--space-6); }

.msg-text { font-size: var(--text-lg); line-height: var(--leading-lg); color: var(--color-fg-1); max-width: var(--layout-measure); padding: var(--space-1) 0 var(--space-2); }
.msg-text strong { font-weight: var(--weight-semi); }
.msg-actions { display: flex; gap: var(--space-2); height: 22px; opacity: 0; transition: opacity var(--duration-instant); }
.row:hover .msg-actions, .row:focus-within .msg-actions { opacity: 1; }
.msg-actions .btn { background: var(--color-surface-0); }

.user-msg { background: var(--color-surface-1); border-left: var(--border-strong) solid var(--color-border-3); padding: var(--space-3) var(--space-4); border-radius: 0 var(--radius-sm) var(--radius-sm) 0; margin: var(--space-3) 0; max-width: calc(var(--layout-measure) + 40px); }
.user-msg .msg-text { font-size: var(--text-md); line-height: var(--leading-md); padding: 0; }
.user-msg .u-label { display: block; margin-bottom: var(--space-1); }

.sys-block {
  display: flex; align-items: flex-start; gap: var(--space-3);
  padding: var(--space-3) var(--space-4);
  background: var(--color-surface-1); border: var(--border-hairline) solid var(--color-border-1);
  border-radius: var(--radius-sm); font-size: var(--text-sm); color: var(--color-fg-2);
  margin: var(--space-3) 0;
}
.sys-block .sys-tag { font-size: var(--text-2xs); letter-spacing: var(--tracking-label); text-transform: uppercase; color: var(--color-fg-3); font-weight: var(--weight-semi); padding-top: 2px; white-space: nowrap; }
.sys-block ul { margin: var(--space-1) 0 0; padding-left: var(--space-5); }
.sys-block li { margin-bottom: 2px; }
.sys-block .reason { color: var(--color-fg-3); }
.sys-foot { margin-top: var(--space-2); display: flex; align-items: center; gap: var(--space-3); font-size: var(--text-xs); color: var(--color-fg-3); }

.round-fence { display: flex; align-items: center; gap: var(--space-3); margin: var(--space-5) 0; font-size: var(--text-xs); color: var(--color-fg-3); font-family: var(--font-mono); }
.round-fence::before, .round-fence::after { content: ""; flex: 1; height: 1px; background: var(--color-border-1); }

.session-divider { display: flex; align-items: center; gap: var(--space-3); height: 32px; margin: var(--space-4) 0; font-size: var(--text-xs); color: var(--color-fg-3); }
.session-divider::before, .session-divider::after { content: ""; flex: 1; height: 1px; background: var(--color-border-1); }
.session-divider b { font-weight: var(--weight-medium); color: var(--color-fg-2); }

.usage-line { display: flex; align-items: center; gap: var(--space-2); font-size: var(--text-xs); color: var(--color-fg-3); font-family: var(--font-mono); padding: 2px 0; }
.end-stamp { display: flex; align-items: center; gap: var(--space-2); font-size: var(--text-xs); color: var(--color-fg-3); padding: 2px 0; font-family: var(--font-mono); }
.err-block { border: var(--border-hairline) solid var(--color-danger); border-left: var(--border-marker) solid var(--color-danger); background: color-mix(in srgb, var(--color-danger) 5%, var(--color-surface-2)); border-radius: var(--radius-sm); padding: var(--space-3) var(--space-4); margin: var(--space-2) 0; }
.err-block .err-msg { font-size: var(--text-md); color: var(--color-fg-1); margin-bottom: var(--space-2); }
.err-block .err-actions { display: flex; gap: var(--space-2); }

.cursor {
  display: inline-block; width: 8px; height: 15px; background: var(--color-fg-1);
  margin-left: 2px; vertical-align: -2px; animation: cursorblink 1.1s steps(2, end) infinite;
}
@keyframes cursorblink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }

/* 权限卡片：单据语言 */
.perm-card {
  position: relative;
  background: var(--color-surface-3);
  border: var(--border-hairline) solid var(--color-border-2);
  border-left: var(--border-marker) solid var(--color-warning);
  border-radius: var(--radius-sm);
  margin: var(--space-3) 0;
  max-width: 560px;
  animation: permIn var(--duration-quick) var(--ease-out);
}
@keyframes permIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.perm-card.is-hold { border-left-color: var(--color-info); }
.perm-card.is-boundary { border-left-color: var(--color-danger); }
.perm-card.is-invalid { opacity: .6; }
.perm-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: var(--space-2) var(--space-4);
  border-bottom: var(--border-marker) double var(--color-border-3);
}
.perm-no { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--color-fg-3); letter-spacing: .04em; }
.perm-body { padding: var(--space-2) 0; }
.perm-field { display: grid; grid-template-columns: 56px 1fr; gap: var(--space-3); padding: var(--space-1) var(--space-4); font-size: var(--text-sm); }
.perm-field .u-label { padding-top: 1px; }
.perm-field code { font-family: var(--font-mono); font-size: var(--text-sm); color: var(--color-fg-1); word-break: break-all; }
.perm-countdown { font-family: var(--font-mono); font-variant-numeric: tabular-nums; color: var(--color-warning); }
.perm-countdown.is-urgent { color: var(--color-danger); font-weight: var(--weight-semi); }
.perm-actions { display: flex; flex-wrap: wrap; gap: var(--space-2); padding: var(--space-2) var(--space-4) var(--space-3); border-top: var(--border-hairline) solid var(--color-border-1); }
.perm-btn { display: inline-flex; flex-direction: column; align-items: center; gap: 2px; }
.perm-btn .btn { width: 100%; }
.perm-btn small { font-family: var(--font-mono); font-size: var(--text-2xs); color: var(--color-fg-3); }
.perm-sign { padding: 0 var(--space-4) var(--space-3); font-size: var(--text-xs); color: var(--color-fg-3); }

.stamp {
  display: inline-block; border: var(--border-strong) solid var(--color-success); color: var(--color-success);
  padding: 1px var(--space-2); font-size: var(--text-xs); font-weight: var(--weight-semi);
  letter-spacing: .16em; text-transform: uppercase; transform: rotate(-5deg); border-radius: var(--radius-sm);
  opacity: .92;
}
.stamp--danger { border-color: var(--color-danger); color: var(--color-danger); }
.stamp--info { border-color: var(--color-info); color: var(--color-info); }
.stamp--muted { border-color: var(--color-border-3); color: var(--color-fg-3); }
/* 审计行里的小签章：1px 边 + 8px 字，塞得进 28px 行高 */
.stamp--mini {
  border-width: var(--border-hairline); font-size: var(--text-2xs); line-height: 12px;
  padding: 0 var(--space-1); letter-spacing: .12em; transform: none; opacity: 1; flex: none;
}

.audit-row {
  display: flex; align-items: center; gap: var(--space-2); height: 28px;
  padding: 0 var(--space-3); margin: var(--space-1) 0;
  border-left: var(--border-marker) solid var(--color-border-2);
  background: var(--color-surface-1); border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  font-size: var(--text-xs); color: var(--color-fg-3); cursor: pointer; width: 100%; text-align: left;
}
.audit-row:hover { background: var(--color-surface-2); }
.audit-row .audit-sym { font-family: var(--font-mono); color: var(--color-success); }
.audit-row.is-danger .audit-sym { color: var(--color-danger); }
.audit-row .audit-no { font-family: var(--font-mono); color: var(--color-fg-3); }
.audit-row .audit-main { color: var(--color-fg-2); }
.audit-row .audit-time { margin-left: auto; font-family: var(--font-mono); }

/* 任务卡（流内） */
.task-card {
  border: var(--border-hairline) solid var(--color-border-2);
  background: var(--color-surface-2); border-radius: var(--radius-md);
  margin: var(--space-3) 0; max-width: 560px; overflow: hidden;
}
.task-head { display: flex; align-items: center; gap: var(--space-2); height: 32px; padding: 0 var(--space-3); border-bottom: var(--border-hairline) solid var(--color-border-1); font-size: var(--text-xs); color: var(--color-fg-3); }
.task-no { font-family: var(--font-mono); margin-left: auto; }
.task-body { padding: var(--space-3) var(--space-4); }
.task-title { font-size: var(--text-md); font-weight: var(--weight-medium); margin-bottom: var(--space-2); }
.task-status { display: flex; align-items: center; gap: var(--space-2); font-size: var(--text-sm); color: var(--color-fg-2); }
.task-report { margin-top: var(--space-3); padding-top: var(--space-3); border-top: var(--border-hairline) solid var(--color-border-1); font-size: var(--text-sm); color: var(--color-fg-2); }
.task-report ul { margin: var(--space-1) 0 var(--space-2); padding-left: var(--space-5); }

/* 输入区 */
.composer { flex: none; border-top: var(--border-hairline) solid var(--color-border-2); background: var(--color-surface-0); padding: var(--space-3) var(--space-6) var(--space-4); }
.composer-lock { display: none; align-items: center; gap: var(--space-2); font-size: var(--text-xs); color: var(--color-warning); margin-bottom: var(--space-2); }
.composer.is-locked .composer-lock { display: flex; }
.composer.is-locked textarea { background: var(--color-surface-1); color: var(--color-fg-3); }
.composer textarea {
  width: 100%; min-height: 44px; max-height: 160px; resize: none;
  padding: 10px var(--space-4); background: var(--color-surface-3);
  border: var(--border-hairline) solid var(--color-border-2); border-radius: var(--radius-md);
  font-size: var(--text-md); line-height: var(--leading-md); color: var(--color-fg-1);
  font-family: var(--font-sans);
}
.composer textarea:focus { border-color: var(--color-accent); box-shadow: var(--focus-ring-inset); }
.composer-actions { display: flex; align-items: center; gap: var(--space-2); height: 32px; margin-top: var(--space-2); }
.composer-actions .spacer { flex: 1; }
.composer-hint { font-size: var(--text-2xs); color: var(--color-fg-3); font-family: var(--font-mono); }

/* 右上下文面板 */
.ctx-panel { border-left: var(--border-hairline) solid var(--color-border-1); background: var(--color-surface-2); overflow-y: auto; }
/* 任务详情的事件流时间线：窄屏折到底部，不隐藏 */
.ev-timeline { background: var(--color-surface-2); border: var(--border-hairline) solid var(--color-border-1); border-radius: var(--radius-md); overflow-y: auto; max-height: 640px; }
.ctx-sec { padding: var(--space-4) var(--space-5); border-bottom: var(--border-hairline) solid var(--color-border-1); }

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const botOf = (id) => S.bots.find((b) => b.id === id) || { name: "未知 Bot", initial: "?", runtimeId: "gemini", persona: "" };
const rtOf = (id) => RUNTIMES.find((r) => r.id === id) || RUNTIMES[0];
const chanOf = (id) => S.channels.find((c) => c.id === id);
const assignOf = (id) => S.assignments.find((a) => a.id === id);
const num = (n) => n == null ? "—" : n.toLocaleString("en-US");

function toast(msg) {
  const root = $("#toast-root");
  const el = document.createElement("div");
  el.className = "toast";
  el.textContent = msg;
  root.appendChild(el);
  setTimeout(() => { el.remove(); }, 3600);
}

function ledFor(state) {
  const map = { running: "running", idle: "idle", queued: "queued", pending: "pending", failed: "failed", done: "done", unavailable: "failed" };
  return '<span class="led led--' + (map[state] || "idle") + '"></span>';
}

function capBadge(v) {
  if (v === true) return '<span class="badge badge--yes">支持</span>';
  if (v === false) return '<span class="badge badge--no">不支持</span>';
  return '<span class="badge badge--unknown">未知</span>';
}

function sq(bot, cls) {
  return '<span class="sq ' + (cls || "") + ' sq--' + bot.id + '">' + esc(bot.initial) + "</span>";
}

function statusWord(a) {
  return { done: "已完成", running: "执行中", queued: "排队中", failed: "失败", timeout: "超时" }[a.status] || a.status;
}

function routeKey(parts) {
  const head = parts[0] || "bots";
  if (head === "bots") return parts.length > 1 ? "bot" : "bots";
  if (head === "assignments") return parts.length > 1 ? "assignment" : "assignments";
  if (head === "chat") return "chat";
  return head;
}

function evHtml(ev, idx) {
  const uid = "ev" + (idx == null ? Math.random().toString(36).slice(2) : idx);
  switch (ev.type) {
    case "thinking":
      return '<div class="row ev">' +
        '<span class="ev-sym" style="color:var(--color-fg-3)"><span>⋯</span></span>' +
        '<button class="ev-fold" aria-expanded="false" data-act="fold" data-target="' + uid + '">' +
        '<span class="ev-sum">思考 ' + esc(ev.dur || "") + (ev.chars ? " · " + ev.chars + " 字" : "") + "</span>" +
        '<span class="ev-chev">▸</span></button>' +
        '<div class="ev-body" id="' + uid + '">' + esc(ev.text || "先确认输入，再决定要不要调用工具；这一步不需要用户参与。") + "</div></div>";

    case "tool_call":
      return '<div class="row ev">' +
        '<span class="ev-sym" style="color:var(--color-accent)"><span>▸</span></span>' +
        '<button class="ev-fold" aria-expanded="false" data-act="fold" data-target="' + uid + '">' +
        '<span class="ev-sum">' + esc(ev.name) + (ev.target ? " " + esc(ev.target) : "") + "</span>" +
        '<span class="ev-chev">▸</span></button>' +
        '<div class="ev-body" id="' + uid + '">' + esc(ev.args || ("tool: " + ev.name + "\ninput: " + (ev.target || "") + "\nstarted: 14:32:08")) + "</div></div>";

    case "tool_result":
      return '<div class="row ev ev--indent">' +
        '<span class="ev-sym" style="color:var(--color-' + (ev.ok ? "success" : "danger") + ')"><span>◂</span></span>' +
        '<button class="ev-fold" aria-expanded="false" data-act="fold" data-target="' + uid + '">' +
        '<span class="ev-sum">' + esc(ev.summary || (ev.ok ? "成功" : "失败")) + "</span>" +
        '<span class="ev-chev">▸</span></button>' +
        '<div class="ev-body" id="' + uid + '">' + esc(ev.output || (ev.ok ? "# 输出\n1. Cursor\n2. Claude Code\n3. Gemini CLI\n(42 行，已折叠)" : "exit code: 1\nstderr: ...")) + "</div></div>";

    case "plan": {
      const items = ev.items || [];
      const done = items.filter((i) => i.s === "done").length;
      const list = items.map((i) => (i.s === "done" ? "[x] " : i.s === "doing" ? "[~] " : "[ ] ") + i.t).join("\n");
      return '<div class="row ev">' +
        '<span class="ev-sym" style="color:var(--color-fg-2)"><span>≡</span></span>' +
        '<button class="ev-fold" aria-expanded="false" data-act="fold" data-target="' + uid + '">' +
        '<span class="ev-sum">计划 ' + items.length + " 项 · " + done + " 完成</span>" +
        '<span class="ev-chev">▸</span></button>' +
        '<div class="ev-body" id="' + uid + '">' + esc(list) + "</div></div>";
    }

    case "permission":
      return permCardHtml(ev);

    case "usage":
      return '<div class="row ev">' +
        '<span class="ev-sym" style="color:var(--color-fg-3)"><span>∑</span></span>' +
        '<div class="usage-line">' + num(ev.in) + " in / " + num(ev.out) + " out · " + esc(ev.mode) + " ×" + ev.mult + "</div></div>";

    case "end":
      return '<div class="row ev">' +
        '<span class="ev-sym" style="color:var(--color-fg-3)"><span>■</span></span>' +
        '<div class="end-stamp">' + esc(ev.label || "完成") + " · " + esc(ev.dur || "") + "</div></div>";

    case "error":
      return '<div class="row ev">' +
        '<span class="ev-sym" style="color:var(--color-danger)"><span>✕</span></span>' +
        '<div class="err-block"><div class="err-msg">' + esc(ev.text) + "</div>" +
        '<div class="err-actions"><button class="btn btn-sm" data-act="noop">重发</button>' +
        '<button class="btn btn-sm btn-ghost" data-act="fold" data-target="' + uid + '" aria-expanded="false">查看详情</button></div>' +
        '<div class="ev-body" id="' + uid + '">' + esc(ev.detail || "exit code: 1") + "</div></div></div>";

    case "message":
    default:
      return '<div class="row ev"><span class="ev-sym" aria-hidden="true"></span>' +
        '<div class="msg-text">' + esc(ev.text) + "</div>" +
        '<div class="msg-actions"><button class="btn btn-xs" data-act="to-assignment">转为任务</button></div></div>';
  }
}

/* 权限卡片：单据语言（表头双线 / 字段行 / 编号 / 签章区） */
function permCardHtml(ev) {
  const no = ev.no || ("A-" + String(S.permSeq).padStart(4, "0"));
  const kind = ev.kind || "block"; // block | hold | boundary | invalid
  const cls = kind === "hold" ? "is-hold" : kind === "boundary" ? "is-boundary" : kind === "invalid" ? "is-invalid" : "";
  const head = '<div class="perm-head"><span class="u-label">授权请求 · Permission</span>' +
    '<span class="perm-no">№ ' + esc(no) + "</span></div>";

  if (ev.state === "decided") {
    const rejected = /拒绝/.test(ev.decision || "");
    // 签章只写结论，操作者与时间放右边，避免同一句说两遍
    const who = (ev.decision || "你").replace(/^已(批准|拒绝)[^·]*·?\s*/, "") || "你";
    return '<div class="row ev"><span class="ev-sym" style="color:var(--color-' + (rejected ? "danger" : "success") + ')"><span>▲</span></span>' +
      '<button class="audit-row' + (rejected ? " is-danger" : "") + '" data-act="fold" data-target="audit-' + esc(no) + '" aria-expanded="false">' +
      '<span class="audit-sym">' + (rejected ? "✕" : "✓") + "</span>" +
      '<span class="stamp stamp--mini' + (rejected ? " stamp--danger" : "") + '">' + (rejected ? "已拒绝" : "已批准") + "</span>" +
      '<span class="audit-main">' + esc(who) + "</span>" +
      '<span class="audit-no">№ ' + esc(no) + "</span>" +
      '<span class="audit-time">' + esc(ev.at || "14:32") + "</span></button>" +
      '<div class="ev-body" id="audit-' + esc(no) + '">' + esc(ev.action + "\n" + ev.target + "\n" + (ev.decision || "")) + "</div></div>";
  }

  if (kind === "boundary") {
    return '<div class="row ev"><span class="ev-sym" style="color:var(--color-danger)"><span>▲</span></span>' +
      '<div class="perm-card is-boundary" data-perm="' + esc(no) + '">' + head +
      '<div class="perm-body">' +
      field("动作", esc(ev.action || "写文件 · Write")) +
      field("目标", "<code>" + esc(ev.target || "/etc/hosts") + "</code>") +
      field("来源", esc(ev.source || "研究助手 · Gemini CLI · 第 3 轮")) +
      field("判定", '<span style="color:var(--color-danger)">超出 Bot 边界 · 已自动拒绝</span>') +
      "</div>" +
      '<div class="perm-actions"><button class="btn btn-sm" data-act="go-boundary" data-bot="' + esc(ev.botId || "b1") + '">去调整边界</button></div>' +
      '<div class="perm-sign">这个动作没有转发给运行时。边界变更只影响之后的请求。</div></div></div>';
  }

  if (kind === "invalid") {
    return '<div class="row ev"><span class="ev-sym" style="color:var(--color-fg-3)"><span>▲</span></span>' +
      '<div class="perm-card is-invalid" data-perm="' + esc(no) + '">' + head +
      '<div class="perm-body">' +
      field("动作", esc(ev.action || "执行命令 · Bash")) +
      field("目标", "<code>" + esc(ev.target || "rm -rf .release/tmp") + "</code>") +
      field("状态", "请求已失效 · 运行时进程已退出") +
      "</div>" +
      '<div class="perm-actions">' +
      '<span class="perm-btn"><button class="btn btn-sm" disabled>批准一次</button><small>A</small></span>' +
      '<span class="perm-btn"><button class="btn btn-sm" disabled>拒绝</button><small>R</small></span>' +
      "</div></div></div>";
  }

  const hold = kind === "hold";
  return '<div class="row ev"><span class="ev-sym" style="color:var(--color-' + (hold ? "info" : "warning") + ')"><span>▲</span></span>' +
    '<div class="perm-card ' + cls + '" data-perm="' + esc(no) + '" data-kind="' + kind + '">' + head +
    '<div class="perm-body">' +
    field("动作", esc(ev.action || "写文件 · Write")) +
    field("目标", "<code>" + esc(ev.target || "~/projects/agentbot/src/auth/session.ts") + "</code>") +
    field("来源", esc(ev.source || "研究助手 · Gemini CLI · 第 3 轮")) +
    (hold
      ? field("状态", '<span style="color:var(--color-info)">等待你回来 · 已挂起 1h 20m</span>') +
        field("上限", "最长保留 24h")
      : field("剩余", '<span class="perm-countdown" data-sec="118">118s</span>')) +
    "</div>" +
    '<div class="perm-actions">' +
    '<span class="perm-btn"><button class="btn btn-sm btn-primary" data-act="perm-decide" data-no="' + esc(no) + '" data-d="approve">批准一次</button><small>A</small></span>' +
    '<span class="perm-btn"><button class="btn btn-sm" data-act="perm-decide" data-no="' + esc(no) + '" data-d="reject">拒绝</button><small>R</small></span>' +
    '<span class="perm-btn"><button class="btn btn-sm" data-act="perm-decide" data-no="' + esc(no) + '" data-d="remember">记住（本会话）</button><small>⇧A</small></span>' +
    '<span class="perm-btn"><button class="btn btn-sm" data-act="perm-decide" data-no="' + esc(no) + '" data-d="forever">记住（本 Bot 永久）</button><small>⌃⇧A</small></span>' +
    "</div>" +
    '<div class="perm-sign">' + (hold ? "该请求来自 Assignment，不会因超时被拒绝。" : "决定会写入权限审计，记录不可在界面内删除。") + "</div></div></div>";
}
function field(k, v) {
  return '<div class="perm-field"><span class="u-label">' + esc(k) + "</span><span>" + v + "</span></div>";
}

/* Turn */
function turnHtml(t) {
  const bot = botOf(t.botId);
  const rt = rtOf(t.runtimeId);
  const collapsed = t.status === "done" && !t.expanded;
  const right = t.status === "done"
    ? ledFor("done") + '<span class="turn-sum">' + esc(t.summary || "完成") + "</span>"
    : t.status === "streaming"
      ? ledFor("running") + '<span class="u-num">' + esc(t.dur || "0s") + "</span>"
      : ledFor("queued") + "<span>" + esc(t.statusLabel || "排队中") + "</span>";
  return '<section class="turn ' + (collapsed ? "is-collapsed" : "") + '" data-turn="' + esc(t.id) + '" data-bot="' + esc(bot.id) + '">' +
    '<header class="turn-head" tabindex="0" role="button" aria-expanded="' + (!collapsed) + '" data-act="toggle-turn" data-id="' + esc(t.id) + '">' +
    sq(bot) +
    '<span class="turn-name">' + esc(bot.name) + "</span>" +
    '<span class="rt-badge">' + esc(rt.name) + " · " + esc(rt.protocol) + "</span>" +
    '<span class="turn-mode">' + esc(t.mode || "交互") + "</span>" +
    '<span class="turn-right">' + right + '<span class="turn-chev">▾</span></span>' +
    "</header>" +
    '<div class="turn-body">' + (t.events || []).map((e, i) => evHtml(e, t.id + "-" + i)).join("") + "</div>" +
    "</section>";
}

function shell(activeKey, crumb, inner, opts) {
  opts = opts || {};
  const nav = NAV.map((n) => {
    const on = n.key === activeKey;
    const c = n.count ? '<span class="nav-count' + (n.key === "assignments" ? " is-alert" : "") + '">' + n.count + "</span>" : "";

      ICONS[n.icon] + '<span class="nav-label">' + n.label + "</span>" + c + "</a>";
  }).join("");

  const crumbHtml = crumb.map((c, i) =>
    (i ? '<span class="sep">/</span>' : "") + (c.href ? '<a href="#' + c.href + '">' + esc(c.t) + "</a>" : "<b>" + esc(c.t) + "</b>")
  ).join("");

  return '<div class="shell">' +
    '<aside class="sidebar">' +
    '<div class="brand"><span class="brand-mark"><i></i><i></i><i></i><i></i></span>' +
    '<span class="brand-text"><div class="brand-name">AgentBot</div><div class="brand-sub">Local Workbench</div></span></div>' +

    '<div class="foot-read"><span class="led led--running"></span><b>1</b><span>个执行中</span></div>' +

    '<button class="icon-btn" data-act="toggle-theme" aria-label="切换明暗主题" title="切换明暗主题">' + ICONS.sun + "</button>" +
    '<button class="chip' + (S.demoOpen ? " is-on" : "") + '" data-act="toggle-demo" aria-label="演示控制" title="切换空/加载/错误态与流程演示">演示控制</button>' +

/* =========================================================================
   8. /bots
   ========================================================================= */
function demoOf(key) { return S.demo[key] || "normal"; }

function filteredBots() {
  return S.bots.filter((b) => {
    if (S.filters.runtime !== "all" && b.runtimeId !== S.filters.runtime) return false;
    if (S.filters.status !== "all" && b.session.state !== S.filters.status) return false;
    if (S.filters.location !== "all" && b.location !== S.filters.location) return false;
    return true;
  });
}

/* 路径显示：worktree / local 前缀 + 中段可省略的目录 + 末段。
   窄屏时中段收缩打点，两头始终可见——「wt/research」比「~/.agentbot/w…」有用。 */
function pathHtml(location, path) {
  const parts = String(path).split("/");
  const tail = parts.length > 1 ? parts.pop() : "";
  const mid = parts.join("/") + (parts.length ? "/" : "");
  return '<span class="bc-path">' +
    '<span class="p-head">' + (location === "worktree" ? "worktree " : "local ") + "</span>" +
    '<span class="p-mid">' + esc(mid) + "</span>" +
    (tail ? '<span class="p-tail">' + esc(tail) + "</span>" : "") +
    "</span>";
}

function botCard(b) {
  const rt = rtOf(b.runtimeId);
  const unavailable = rt.status !== "ready";
  const rtText = rt.status === "ready" ? rt.name + " · " + rt.protocol + " · 交互" : rt.name + " · 未就绪";
  const locHtml = pathHtml(b.location, b.path);
  const sessText = b.session.state === "unavailable" ? "不可用 · 运行时未就绪" : b.ago + " · 待批 " + b.pending;
  return '<article class="bot-card' + (unavailable ? " is-unavailable" : "") + '" tabindex="0" role="link" data-act="open-bot" data-id="' + b.id + '" aria-label="' + esc(b.name) + '，打开详情">' +
    (unavailable ? '<div class="bc-banner"><span class="led led--failed"></span>运行时不可用 · ' + esc(rt.name) + " 未就绪</div>" : "") +
    '<div class="bc-head"><div class="bc-id">' + sq(botOf(b.id)) + '<span class="bc-name">' + esc(b.name) + "</span></div>" +
    '<span class="bc-status">' + ledFor(b.session.state) + esc(b.session.text) + "</span></div>" +
    '<div class="bc-actions">' +
    '<button class="btn btn-xs" data-act="open-bot" data-id="' + b.id + '">详情</button>' +
    '<button class="btn btn-xs" data-act="assign-from-card" data-id="' + b.id + '">派任务</button>' +
    "</div>" +
    '<div class="bc-div"></div>' +
    '<div class="bc-persona">' + esc(b.persona) + "</div>" +
    '<div class="bc-reads">' +
    '<div class="bc-read"><span class="u-label bc-label">Runtime</span><span class="bc-val">' + esc(rtText) + "</span></div>" +
    '<div class="bc-read"><span class="u-label bc-label">Location</span><span class="bc-val">' + locHtml + "</span></div>" +
    '<div class="bc-read"><span class="u-label bc-label">Session</span><span class="bc-val">' + esc(sessText) + "</span></div>" +
    "</div></article>";
}

function skeletonCards(n) {
  let out = "";
  for (let i = 0; i < n; i++) {
    out += '<div class="bot-card" aria-hidden="true">' +
      '<div class="bc-head"><div class="bc-id"><span class="sk" style="width:20px;height:20px"></span><span class="sk sk-line" style="width:88px"></span></div></div>' +
      '<div class="bc-div"></div>' +
      '<div style="margin-bottom:8px"><span class="sk sk-line" style="width:70%;display:block"></span></div>' +
      '<div class="bc-reads">' +
      '<div class="bc-read"><span class="sk sk-line" style="width:40px"></span><span class="sk sk-line" style="width:62%"></span></div>' +
      '<div class="bc-read"><span class="sk sk-line" style="width:48px"></span><span class="sk sk-line" style="width:76%"></span></div>' +
      '<div class="bc-read"><span class="sk sk-line" style="width:44px"></span><span class="sk sk-line" style="width:54%"></span></div>' +
      "</div></div>";
  }
  return out;
}

function viewBots() {
  const st = demoOf("bots");
  const list = filteredBots();
  const running = S.bots.filter((b) => b.session.state === "running" || b.session.state === "queued").length;
  const pending = S.bots.reduce((s, b) => s + b.pending, 0);

  const head = '<div class="page-head">' +
    "<div><h1 class=\"page-title\">Bot</h1><p class=\"page-desc\">每个 Bot 绑定一个运行时、一个执行位置、一个当前 Session。读数按列对齐，横向扫一遍就是一台机器的仪表。</p></div>" +
    '<div class="spacer"></div>' +
    '<div class="readbar">' +
    '<div class="read-group"><span class="read-num u-num">' + S.bots.length + '</span><span class="u-label">Bots</span></div>' +
    '<div class="read-group"><span class="read-num u-num">' + RUNTIMES.filter((r) => r.status === "ready").length + '</span><span class="u-label">Runtimes</span></div>' +
    '<div class="read-group"><span class="read-num u-num">' + running + '</span><span class="u-label">Running</span></div>' +
    '<div class="read-group"><span class="read-num u-num is-warning">' + pending + '</span><span class="u-label">Awaiting</span></div>' +
    "</div>" +
    '<button class="btn btn-primary" data-act="new-bot">新建 Bot</button>' +
    "</div>";

  const rtChips = [["all", "全部"], ["gemini", "Gemini"], ["codex", "Codex"], ["zcode", "ZCode"], ["dsh", "DSH"]]
    .map(([k, l]) => '<button class="chip' + (S.filters.runtime === k ? " is-on" : "") + '" data-act="filter" data-k="runtime" data-v="' + k + '">' + l + "</button>").join("");
  const stChips = [["all", "全部"], ["idle", "空闲"], ["running", "生成中"], ["queued", "排队中"], ["unavailable", "不可用"]]
    .map(([k, l]) => '<button class="chip' + (S.filters.status === k ? " is-on" : "") + '" data-act="filter" data-k="status" data-v="' + k + '">' + l + "</button>").join("");
  const locChips = [["all", "全部"], ["local", "local"], ["worktree", "worktree"]]
    .map(([k, l]) => '<button class="chip' + (S.filters.location === k ? " is-on" : "") + '" data-act="filter" data-k="location" data-v="' + k + '">' + l + "</button>").join("");

  const filters = '<div class="filters">' +
    '<div class="filter-group"><span class="u-label">Runtime</span>' + rtChips + "</div>" +
    '<div class="filter-group"><span class="u-label">Status</span>' + stChips + "</div>" +
    '<div class="filter-group"><span class="u-label">Location</span>' + locChips + "</div>" +
    '<div class="spacer"></div><span class="filter-count">' + list.length + "/" + S.bots.length + "</span></div>";

  let body;
  if (st === "loading") {
    body = '<div class="bot-grid">' + skeletonCards(6) + "</div>";
  } else if (st === "error") {
    body = '<div class="banner"><span class="led led--failed"></span><span>读取 Bot 失败：本地服务没有响应。</span><span class="spacer"></span><button class="btn btn-sm" data-act="demo-set" data-v="normal">重试</button></div>' +
      '<div class="bot-grid">' + skeletonCards(3) + "</div>";
  } else if (st === "empty" || S.bots.length === 0) {
    body = '<div class="empty"><h3>创建你的第一个 Bot</h3>' +
      '<p>Bot 有名字、人格、记忆和权限边界；运行时只是它当前绑定的一台机器。换运行时，人格和记忆都留着。</p>' +
      '<p class="empty-alt">执行位置决定它改的是哪个目录：local 直接用当前目录，worktree 会另开一份。</p>' +
      '<button class="btn btn-primary" data-act="new-bot">新建 Bot</button></div>';
  } else if (list.length === 0) {
    body = '<div class="empty" style="border-top:0;padding-top:var(--space-5)"><p style="margin-bottom:var(--space-3)">没有符合条件的 Bot。</p>' +
      '<button class="btn btn-sm" data-act="clear-filters">清除筛选</button></div>';
  } else {
    body = '<div class="bot-grid">' + list.map(botCard).join("") + "</div>";
  }

  return shell("bots", [{ t: "Bot", href: "/bots" }], head + filters + body);
}

      '<div class="doc-sec"><h3>改动文件</h3>' +
      (a.files.length ? '<table class="table"><thead><tr><th>路径</th><th class="num">+</th><th class="num">−</th></tr></thead><tbody>' +
        a.files.map((f) => '<tr><td style="font-family:var(--font-mono);font-size:var(--text-sm)">' + esc(f.p) + '</td><td class="num" style="color:var(--color-success)">+' + f.add + '</td><td class="num" style="color:var(--color-danger)">−' + f.del + "</td></tr>").join("") + "</tbody></table>"
        : '<p style="font-size:var(--text-sm);color:var(--color-fg-3)">尚未产生文件改动。</p>') + "</div>" +
      '<div class="doc-sec"><h3>用量</h3><div class="usage-line">' + (a.usage.in == null ? "— 运行时未上报" : num(a.usage.in) + " in / " + num(a.usage.out) + " out · 交互 ×1") + "</div></div>" +
      "</div>";
  }

  const sign = '<div class="doc-sign"><span class="who">交付物：' + esc(a.deliverable) + "</span>" +
    (a.status === "done" ? '<span class="stamp">已交付 · ' + esc(a.started) + "</span>" : '<span class="who">—</span>') + "</div>";

  const timeline = '<aside class="ev-timeline">' +
    '<div class="ctx-sec"><h4>事件流</h4>' +
    ((a.events || []).length ? a.events.map((e, i) => {
      const sym = { thinking: "⋯", tool_call: "▸", tool_result: "◂", plan: "≡", permission: "▲", usage: "∑", end: "■", error: "✕", message: "" }[e.type] || "·";
      const color = e.type === "error" || (e.type === "tool_result" && e.ok === false) ? "var(--color-danger)" : e.type === "tool_call" ? "var(--color-accent)" : e.type === "tool_result" ? "var(--color-success)" : "var(--color-fg-3)";
      const label = e.type === "thinking" ? "思考 " + e.dur :
        e.type === "tool_call" ? e.name + " " + (e.target || "") :
          e.type === "tool_result" ? e.summary :
            e.type === "plan" ? "计划 " + e.items.length + " 项" :
              e.type === "permission" ? "权限 · " + (e.state === "decided" ? e.decision : "待批") :
                e.type === "usage" ? num(e.in) + " in / " + num(e.out) + " out" :
                  e.type === "end" ? e.label + " · " + e.dur :
                    e.type === "error" ? "错误" : "消息";
      return '<div style="display:flex;gap:var(--space-2);font-size:var(--text-xs);padding:3px 0;color:var(--color-fg-2)">' +
        '<span style="font-family:var(--font-mono);color:' + color + ';width:12px;text-align:center">' + sym + "</span>" +
        '<span style="font-family:var(--font-mono);color:var(--color-fg-3);width:22px">' + String(i + 1).padStart(2, "0") + "</span>" +
        "<span>" + esc(label) + "</span></div>";
    }).join("") : '<p style="font-size:var(--text-xs);color:var(--color-fg-3)">还没有事件</p>') + "</div></aside>";

  return shell("assignments", [{ t: "任务", href: "/assignments" }, { t: a.no }],
    head + '<div style="display:grid;grid-template-columns:1fr 320px;gap:var(--space-5);align-items:start" class="assign-detail">' +

  const rows = S.usage.map((u) => {
    const b = u.name ? { id: "bx", name: u.name, initial: "文", runtimeId: u.runtimeId } : botOf(u.botId);

    const cells = u.unreported
      ? '<td class="num">—</td><td class="num">—</td><td class="num" style="color:var(--color-fg-3)">未上报</td>'

    return '<tr' + (deleted ? ' class="is-dim"' : "") + '>' +
      '<td><span style="display:inline-flex;align-items:center;gap:6px">' + sq(b) + esc(b.name) + (deleted ? ' <span class="badge badge--no">已删除 Bot</span>' : "") + "</span></td>" +
      "<td>" + esc(rtOf(u.runtimeId).name) + "</td>" +
      '<td class="num">' + u.req + "</td>" + cells + "</tr>";
  }).join("");

  const sumIn = S.usage.reduce((s, u) => s + (u.in || 0), 0);
  const sumOut = S.usage.reduce((s, u) => s + (u.out || 0), 0);
  const sumReq = S.usage.reduce((s, u) => s + u.req, 0);

  const table = '<table class="table"><thead><tr>' +
    "<th>Bot</th><th>运行时</th>" +
    '<th class="num">请求数<span class="ticks"><i></i><i></i><i></i><i></i><i></i></span></th>' +
    '<th class="num">输入 token<span class="ticks"><i></i><i></i><i></i><i></i><i></i></span></th>' +
    '<th class="num">输出 token<span class="ticks"><i></i><i></i><i></i><i></i><i></i></span></th>' +
    '<th class="num">模式</th></tr></thead><tbody>' + rows + "</tbody>" +
    '<tfoot><tr><td colspan="2">合计</td><td class="num">' + sumReq + '</td><td class="num">' + num(sumIn) + '</td><td class="num">' + num(sumOut) + '</td><td class="num">—</td></tr></tfoot></table>';

  return shell("usage", [{ t: "用量", href: "/usage" }], head + chips + table +
    '<p class="hint" style="margin-top:var(--space-3)">headless 模式按 ×3 计费倍率标注；ZCode 未上报 token，聚合时不估算，单列显示 —。</p>');
}

function viewSetup() {
  const st = S.setup;
  const stepNames = ["探测运行时", "创建 Bot", "发第一条消息"];
  const steps = stepNames.map((n, i) => {
    const idx = i + 1;
    const cls = st.step === idx ? "is-on" : st.step > idx ? "is-done" : "";
    return '<div class="setup-step ' + cls + '"><span class="n">' + (st.step > idx ? "✓" : idx) + "</span><span>" + n + "</span></div>" +
      (i < 2 ? '<span class="bar"></span>' : "");
  }).join("");

  let body = "";
  if (st.step === 1) {
    const items = [
      { id: "zcode", name: "ZCode", ver: "0.9.0", path: "/opt/zcode/bin/zcode", state: "ok" },
      { id: "codex", name: "Codex", ver: "0.48.1", path: "~/.local/bin/codex", state: "ok" },
      { id: "cc", name: "Claude Code", ver: "3 秒无响应", path: "—", state: "timeout" },
      { id: "gemini", name: "Gemini CLI", ver: "0.14.2", path: "/usr/local/bin/gemini", state: "ok" },
      { id: "dsh", name: "DSH", ver: "PATH 中未找到可执行文件", path: "—", state: "missing" }
    ];
    const rows = items.map((it) => {
      const known = st.detected.indexOf(it.id) >= 0;
      if (!known) {
        return '<div class="probe-row" data-probe="' + it.id + '"><span class="sk" style="width:10px;height:10px"></span>' +
          '<div><span class="sk sk-line" style="width:100px;display:block"></span><span class="sk sk-line" style="display:block;width:160px;margin-top:6px;height:8px"></span></div>' +
          '<span class="probe-state">检测中…</span></div>';

      const label = it.state === "ok" ? "可用" : it.state === "timeout" ? "检测超时" : "未安装";
      const led = it.state === "ok" ? "done" : it.state === "timeout" ? "pending" : "failed";
      return '<div class="probe-row" data-probe="' + it.id + '"><span class="led led--' + led + '"></span>' +
        '<div><div class="nm">' + esc(it.name) + "</div><div class=\"sub\">" +
        (it.state === "ok" ? esc(it.ver) + " · " + esc(it.path) : esc(it.ver)) + "</div></div>" +
        '<span class="probe-state">' + (it.state === "ok" ? label : label + ' <button class="btn btn-xs" data-act="probe-retry">重试</button>') + "</span></div>";
    }).join("");

    body = '<h1 class="setup-title">检测你机器上的 agent</h1>' +

  if (st.step === 2) {

function runProbe() {
  const order = ["zcode", "codex", "cc", "gemini", "dsh"];
  order.forEach((id, i) => {
    if (S.setup.detected.indexOf(id) >= 0) return;
    setTimeout(() => {
      if (S.setup.step !== 1) return;
      if (S.setup.detected.indexOf(id) >= 0) return;
      S.setup.detected.push(id);
      const el = document.querySelector('[data-probe="' + id + '"]');
      if (!el) return;
      const ok = id !== "cc" && id !== "dsh";
      const label = id === "cc" ? "检测超时" : id === "dsh" ? "未安装" : "可用";
      const led = ok ? "done" : id === "cc" ? "pending" : "failed";
      const sub = id === "zcode" ? "0.9.0 · /opt/zcode/bin/zcode"
        : id === "codex" ? "0.48.1 · ~/.local/bin/codex"
          : id === "gemini" ? "0.14.2 · /usr/local/bin/gemini"
            : id === "cc" ? "3 秒无响应" : "PATH 中未找到可执行文件";
      el.innerHTML = '<span class="led led--' + led + '"></span>' +
        "<div><div class=\"nm\">" + ({ zcode: "ZCode", codex: "Codex", cc: "Claude Code", gemini: "Gemini CLI", dsh: "DSH" }[id]) + "</div>" +
        '<div class="sub">' + sub + "</div></div>" +
        '<span class="probe-state">' + label + (ok ? "" : ' <button class="btn btn-xs" data-act="probe-retry">重试</button>') + "</span>";
      if (S.setup.detected.length === 5) {
        const btn = document.querySelector('[data-act="setup-next"]');
        if (btn) btn.disabled = false;
      }
    }, 380 + i * 420);
  });
}

/* 表格装饰：给每个数据表加 data-label（窄屏堆叠用）并包一层可滚动容器。
   列头文字是唯一真源，改表头即同步；不手写 label，避免两边漂移。 */
function decorateTables(root) {
  root.querySelectorAll("table.table").forEach((tb) => {
    if (tb.dataset.decorated) return;
    tb.dataset.decorated = "1";
    tb.classList.add("table--stackable");
    const ths = Array.from(tb.querySelectorAll("thead th")).map((th) => th.textContent.replace(/\s+/g, " ").trim());
    if (!ths.length) return;
    tb.querySelectorAll("tbody tr, tfoot tr").forEach((tr) => {
      Array.from(tr.children).forEach((td, i) => {
        td.dataset.label = ths[i] || "";
      });
    });
    if (!tb.parentElement.classList.contains("table-wrap")) {
      const wrap = document.createElement("div");
      wrap.className = "table-wrap";
      tb.parentElement.insertBefore(wrap, tb);
      wrap.appendChild(tb);
    }
  });
}

function render() {
  const p = parts();
  const key = routeKey(p);
  let html = "";
  if (key === "setup") html = viewSetup();
  else if (key === "bots") html = viewBots();
  else if (key === "bot") html = viewBot(p[1]);
  else if (key === "chats") html = viewChats();
  else if (key === "chat") html = viewChat(p[1]);
  else if (key === "assignments") html = viewAssignments();
  else if (key === "assignment") html = viewAssignment(p[1]);
  else if (key === "schedules") html = viewSchedules();
  else if (key === "usage") html = viewUsage();
  else if (key === "settings") html = viewSettings();
  else html = viewBots();

  $("#app").innerHTML = html;
  decorateTables($("#app"));
  renderDemoBar();
  document.documentElement.dataset.theme = S.theme;
  if (S.scale) document.documentElement.dataset.textScale = S.scale;
  else delete document.documentElement.dataset.textScale;

  if (key === "setup" && S.setup.step === 1 && !S.setup.probeStarted) {
    S.setup.probeStarted = true;
    runProbe();
  }
  if (key === "setup" && S.setup.step === 3 && S.setup.sent && !S.setup.typed) {
    S.setup.typed = true;
    runSetupStream();
  }
  if (key === "chat") {
    attachChat(key);
    scrollStream();
  }
  startCountdowns();
}

function scrollStream() {
  const el = $("#stream");
  if (el) el.scrollTop = el.scrollHeight;
}

function attachChat() {
  const input = $("#composer-input");
  if (input) {
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); handleSend(); }
    });
  }
  const stream = $("#stream");
  if (stream) {
    stream.addEventListener("scroll", () => {
      $$(".turn", stream).forEach((t) => {
        const head = $(".turn-head", t);
        if (!head) return;
        t.classList.toggle("is-scrolled", t.getBoundingClientRect().top <= 50 && t.getBoundingClientRect().bottom > 100);
      });
    }, { passive: true });
  }
}

function currentChannel() { return chanOf(parts()[1]) || chanOf("g1"); }

function appendToStream(html) {
  const inner = $("#stream-inner");
  if (!inner) return null;
  const tmp = document.createElement("div");
  tmp.innerHTML = html;
  const node = tmp.firstElementChild;
  inner.appendChild(node);
  scrollStream();
  return node;
}

function setSending(on) {
  const b = $("#send-btn");
  if (!b) return;
  b.textContent = on ? "停止" : "发送";
  b.dataset.act = on ? "stop-stream" : "send";
  b.classList.toggle("btn-primary", !on);
}

function handleSend() {
  const input = $("#composer-input");
  if (!input || input.disabled) return;
  if ($(".perm-card[data-kind='block']")) { toast("等待你批准，无法继续发送"); return; }
  const comp = $("#composer");
  if (comp && comp.classList.contains("is-locked")) { toast("等待你批准，无法继续发送"); return; }
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  const c = currentChannel();
  appendUserMessage(text);
  setSending(true);
  if (c.type === "group") runGroupRound(c, text);
  else runDmReply(c, text);
}

function appendUserMessage(text) {
  const el = appendToStream(
    '<div class="row user-msg" data-msg="' + Date.now() + '">' +
    '<span class="u-label">你 · 14:3' + (Math.floor(Math.random() * 9)) + "</span>" +
    '<div class="msg-text">' + esc(text) + "</div>" +
    '<div class="msg-actions"><button class="btn btn-xs" data-act="to-assignment">转为任务</button></div></div>'
  );
  return el;
}

function runDmReply(c, text) {
  const bot = botOf(c.botId);
  const rt = rtOf(bot.runtimeId);
  const turn = appendTurnEl({
    id: "t" + Date.now(), botId: bot.id, runtimeId: bot.runtimeId,
    mode: rt.streaming ? "交互" : "非流式", status: "streaming", dur: "0.6s"
  });
  const body = $(".turn-body", turn);
  body.innerHTML = evHtml({ type: "message", text: "" });
  const target = $(".msg-text", body);
  const cursor = document.createElement("span");
  cursor.className = "cursor";
  target.appendChild(cursor);

  const reply = "收到。我先看一下这个仓库里与「" + text.slice(0, 8) + "」相关的部分：session 的续接状态记在 Session 表里，重建上下文时按记忆更新时间倒序取最近 20 条。结论是现有实现能跑通，但重建路径缺一个跨运行时的回放测试，建议在合并前补上。";
  streamText(target, reply, cursor, () => {
    body.insertAdjacentHTML("beforeend", evHtml({ type: "usage", in: 842, out: 214, mode: "交互", mult: 1 }));
    body.insertAdjacentHTML("beforeend", evHtml({ type: "end", label: "完成", dur: "4.2s" }));
    finishTurn(turn, "完成 · 842/214");
    setSending(false);
  });
}

function appendTurnEl(t) {
  const el = appendToStream(turnHtml(t));
  return el;
}

function finishTurn(el, summary) {
  el.classList.add("is-collapsed");
  const head = $(".turn-head", el);
  head.setAttribute("aria-expanded", "false");
  const right = $(".turn-right", el);
  right.innerHTML = ledFor("done") + '<span class="turn-sum">' + esc(summary) + "</span>" + '<span class="turn-chev">▾</span>';
}

function streamText(el, text, cursor, done) {
  if (reduced()) {
    el.textContent = text;
    if (cursor) cursor.remove();
    done && done();
    return;
  }
  let i = 0;
  const timer = setInterval(() => {
    i += 2;
    if (!el.isConnected) { clearInterval(timer); return; }
    el.textContent = text.slice(0, i);
    el.appendChild(cursor);
    scrollStream();
    if (i >= text.length) {
      clearInterval(timer);
      el.textContent = text;
      cursor.remove();
      done && done();
    }
  }, 40);
}

/* F2：群聊一轮 */
let groupRunning = false;
function runGroupRound(c, userText) {
  if (groupRunning) { toast("上一轮还在跑，等它结束"); return; }
  groupRunning = true;

  const host = botOf(c.host);
  const others = c.participants.filter((p) => p !== c.host).map(botOf);
  const speakers = others.slice(0, 2);

  // 1. 主持人 Turn（折叠一行）
  const hostTurn = appendToStream(
    '<div class="turn" data-turn="host" data-bot="' + esc(host.id) + '"><header class="turn-head" style="position:static">' +
    sq(host) + '<span class="turn-name">' + esc(host.name) + '</span><span class="rt-badge">' + esc(rtOf(host.runtimeId).name) + " · 交互</span>" +
    '<span class="turn-right">' + ledFor("running") + '<span>主持人在决定发言人…</span></span></header></div>'
  );

  setTimeout(() => {
    if (!hostTurn.isConnected) { groupRunning = false; return; }
    hostTurn.remove();
    // 2. 发言人名单
    appendToStream(
      '<div class="sys-block"><span class="sys-tag">本轮发言人</span><div style="flex:1">' +
      '<ul>' + speakers.map((b) => "<li><b>" + esc(b.name) + "</b> — " + (b.id === "b1" ? "问题涉及竞品与排期，需要外部信息" : "问题涉及实现风险，需要读代码") + "</li>").join("") + "</ul>" +
      '<div class="sys-foot"><span class="u-num">本轮调用 ' + speakers.length + "/" + c.participants.length + "</span>" +
      '<button class="btn btn-xs btn-ghost" data-act="noop">改由我指定</button>' +

      "</div></div>"
    );
    setTimeout(() => runSpeaker(speakers, 0, c), 500);
  }, 1400);
}

  };

  // 其他在跑的 Bot 折叠为活动行

    '<span class="turn-mode">' + (rt.streaming ? "交互" : "非流式") + "</span>" +
    '<span class="turn-right">' + ledFor("running") + '<span class="u-num">0s</span></span></header>' +
