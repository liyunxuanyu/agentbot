<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AgentBot 手机尺寸预览</title>
<style>
  :root {
    --bg: #0f1419;
    --panel: #1a2129;
    --text: #e6edf3;
    --muted: #8b9bab;
    --line: #2c3540;
    --accent: #0c7a8f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 -apple-system, "Segoe UI Variable Text", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
  }
  h1 { margin: 0; font-size: 14px; font-weight: 700; letter-spacing: .01em; }
  .hint { color: var(--muted); font-size: 12px; }
  .sizes { display: flex; gap: 6px; margin-left: auto; flex-wrap: wrap; }
  button {
    font: inherit;
    font-size: 12px;
    color: var(--text);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 6px 10px;
    cursor: pointer;
  }
  button:hover { background: #232c36; border-color: #3a4653; }
  button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  input {
    font: inherit;
    font-size: 12px;
    width: 300px;
    color: var(--text);
    background: #12181e;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 6px 10px;
  }
  main {
    flex: 1;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    gap: 24px;
    padding: 24px 16px 40px;
    overflow: auto;
  }
  .device {
    position: relative;
    border-radius: 34px;
    background: #0a0e12;
    border: 10px solid #232b34;
    box-shadow: 0 24px 60px rgba(0, 0, 0, .55);
    flex: 0 0 auto;
    overflow: hidden;
  }
  .device::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 8px;
    transform: translateX(-50%);
    width: 74px;
    height: 5px;
    border-radius: 3px;
    background: #232b34;
    pointer-events: none;
    z-index: 2;
  }
  iframe {
    display: block;
    border: 0;
    background: #fff;
  }
  .meta { color: var(--muted); font-size: 12px; text-align: center; margin-top: 10px; }
  .meta b { color: var(--text); font-variant-numeric: tabular-nums; }
  .note { max-width: 300px; color: var(--muted); font-size: 12px; line-height: 1.7; }
  .note code { color: #9fd6e0; }
</style>
</head>
<body>
<header>
  <h1>手机尺寸预览</h1>
  <span class="hint">同源 iframe，沿用当前登录 cookie</span>
  <div class="sizes" id="sizes"></div>
</header>
<main>
  <div>
    <div class="device" id="device">
      <iframe id="frame" src="/" title="AgentBot 手机预览"></iframe>
    </div>
    <div class="meta">视口 <b id="dims">390 × 844</b> · 触发 <code>max-width:767px</code> 底栏断点</div>
  </div>
  <div class="note">
    <p><b>看什么</b></p>
    <p>① 底部 tab 栏：鼠标悬停时不应再缩成一条（刚修的 bug）。</p>
    <p>② 会话页输入区：权限模式胶囊在窄屏是否被挤掉、是否还能点开。</p>
    <p>③ 横向是否出现滚动条。</p>
    <p>要直接看某个会话，把地址改成
      <code>/phone.html?path=/chat/&lt;渠道id&gt;</code>。</p>
    <p>若预览区显示 401，说明当前浏览器还没有 cookie：先用带 <code>?t=</code> 的地址打开一次主界面。</p>
  </div>
</main>
<script>
  const PRESETS = [
    { label: "iPhone 14 · 390×844", w: 390, h: 844 },
    { label: "小屏 · 360×780", w: 360, h: 780 },
    { label: "iPhone SE · 375×667", w: 375, h: 667 },
    { label: "平板竖屏 · 768×1024", w: 768, h: 1024 },
    { label: "平板横屏 · 1024×768", w: 1024, h: 768 },
  ];
  const frame = document.getElementById("frame");
  const dims = document.getElementById("dims");
  const sizes = document.getElementById("sizes");

  const params = new URLSearchParams(location.search);
  const inner = params.get("path") || "/";
  frame.src = inner;

  function apply(w, h, btn) {
    frame.style.width = w + "px";
    frame.style.height = h + "px";
    dims.textContent = w + " × " + h;
    for (const b of sizes.children) b.classList.toggle("on", b === btn);
  }

  PRESETS.forEach((p, i) => {
    const b = document.createElement("button");
    b.textContent = p.label;
    b.onclick = () => apply(p.w, p.h, b);
    sizes.appendChild(b);
    if (i === 0) queueMicrotask(() => apply(p.w, p.h, b));
  });
</script>
</body>
</html>
